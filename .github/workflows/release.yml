name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
            client:
              - 'client/**'
              - 'protocol/**'
            tools:
              - 'tools/**'
              - 'protocol/**'

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: cd protocol && go test ./...
      - run: cd protocol && go vet ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: cd server && go test ./...
      - run: cd server && go vet ./...
      - run: cd server && go build -o /dev/null ./cmd/demarkus-server

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: cd client && go test ./...
      - run: cd client && go vet ./...
      - run: cd client && go build -o /dev/null ./cmd/demarkus

  test-tools:
    needs: detect-changes
    if: needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: cd tools && go test ./...
      - run: cd tools && go vet ./...
      - run: cd tools && go build -o /dev/null ./demarkus-broker
      - run: cd tools && go build -o /dev/null ./demarkus-token
      - run: cd tools && go build -o /dev/null ./demarkus-publish

  semver-protocol:
    needs: test-protocol
    if: always() && needs.test-protocol.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@v5.3.0
        id: semver
        with:
          tag_prefix: "protocol/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          change_path: "protocol/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="protocol/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-server:
    needs: test-server
    if: always() && needs.test-server.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@v5.3.0
        id: semver
        with:
          tag_prefix: "server/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          change_path: "server/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="server/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-client:
    needs: test-client
    if: always() && needs.test-client.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@v5.3.0
        id: semver
        with:
          tag_prefix: "client/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          change_path: "client/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="client/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-tools:
    needs: test-tools
    if: always() && needs.test-tools.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@v5.3.0
        id: semver
        with:
          tag_prefix: "tools/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          change_path: "tools/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="tools/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  release-protocol:
    needs: semver-protocol
    if: needs.semver-protocol.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'protocol/v${{ needs.semver-protocol.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'protocol/v${{ needs.semver-protocol.outputs.new_version }}';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Protocol ${{ needs.semver-protocol.outputs.new_version }}`,
              generate_release_notes: true
            });

  release-server:
    needs: semver-server
    if: needs.semver-server.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'server/v${{ needs.semver-server.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f server/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "server/v${{ needs.semver-server.outputs.new_version }}"

      # Multi-stage Dockerfile compiles binaries from source; build context
      # is the repo root because the server image bundles demarkus + demarkus-
      # server which live in different go modules. Versions are stamped via
      # build-args. Multi-arch matches the goreleaser binary matrix.
      - name: Build + push demarkus-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-server:${{ needs.semver-server.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-server:latest
          build-args: |
            VERSION=${{ needs.semver-server.outputs.new_version }}

  release-client:
    needs: semver-client
    if: needs.semver-client.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'client/v${{ needs.semver-client.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f client/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "client/v${{ needs.semver-client.outputs.new_version }}"

      # demarkus-agent lives in client/cmd/ so it rides the client release
      # cadence. Multi-stage Dockerfile compiles from source; context is the
      # repo root because the agent module's tools/ replace directive needs
      # protocol/ alongside.
      - name: Build + push demarkus-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/cmd/demarkus-agent/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-agent:${{ needs.semver-client.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-agent:latest
          build-args: |
            VERSION=${{ needs.semver-client.outputs.new_version }}

  release-tools:
    needs: semver-tools
    if: needs.semver-tools.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'tools/v${{ needs.semver-tools.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f tools/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "tools/v${{ needs.semver-tools.outputs.new_version }}"

      # demarkus-broker is the only runtime image in tools/. Admin CLIs
      # (demarkus-token, demarkus-publish) ship as standalone binary archives
      # via goreleaser above and are not bundled into any image — see §6.7.A
      # decisions on minimal pod blast radius.
      - name: Build + push demarkus-broker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/demarkus-broker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-broker:${{ needs.semver-tools.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-broker:latest
          build-args: |
            VERSION=${{ needs.semver-tools.outputs.new_version }}
