name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; each release job grants itself the write scopes it
# uses (tags, releases, images, charts).
permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      tools: ${{ steps.filter.outputs.tools }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      knowledge_system: ${{ steps.filter.outputs.knowledge_system }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
              - 'client/**'
              - 'deploy/helm/demarkus-server/**'
              - 'deploy/helm/demarkus-server-common/**'
            client:
              - 'client/**'
              - 'protocol/**'
              - 'deploy/helm/demarkus-agent/**'
            tools:
              - 'tools/**'
              - 'protocol/**'
              - 'client/**'
            knowledge:
              - 'knowledge/**'
              - 'server/**'
              - 'protocol/**'
              - 'client/**'
              - 'deploy/helm/demarkus-knowledge-server/**'
            knowledge_system:
              - 'deploy/helm/demarkus-knowledge-system/**'
              - 'deploy/helm/demarkus-knowledge-server/**'

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: cd protocol && go test -race ./...
      - run: cd protocol && go vet ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: cd server && go test -race ./...
      - run: cd server && go vet ./...
      - run: cd server && go build -o /dev/null ./cmd/demarkus-server
      - run: cd server && go build -o /dev/null ./cmd/demarkus-knowledge-server

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: cd client && go test -race ./...
      - run: cd client && go vet ./...
      - run: cd client && go build -o /dev/null ./cmd/demarkus

  test-tools:
    needs: detect-changes
    if: needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/go.sum
      - run: cd tools && go test -race ./...
      - run: cd tools && go vet ./...
      - run: cd tools && go build ./...

  test-knowledge:
    needs: detect-changes
    if: needs.detect-changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: knowledge/go.sum
      - run: cd knowledge && go test -race ./...
      - run: cd knowledge && go vet ./...
      - run: cd knowledge && go build ./...

  semver-protocol:
    needs: test-protocol
    if: always() && needs.test-protocol.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "protocol/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          change_path: "protocol/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="protocol/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-server:
    needs: test-server
    if: always() && needs.test-server.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "server/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          # Chart and image release together, so chart-only commits must
          # bump too. protocol/ is compiled in via replace directives, and
          # the image bundles the client CLI for chart exec probes: a fix
          # in either that skips this gate silently never ships (#295).
          change_path: "server/ protocol/ client/ deploy/helm/demarkus-server/ deploy/helm/demarkus-server-common/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="server/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-client:
    needs: test-client
    if: always() && needs.test-client.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "client/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          # See server's change_path note: chart-only commits must
          # bump the version so the chart actually publishes.
          change_path: "client/ protocol/ deploy/helm/demarkus-agent/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="client/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  semver-tools:
    needs: test-tools
    if: always() && needs.test-tools.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "tools/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          # Enumerated (not tools/) so the ignored benchmark tree under
          # tools/ never cuts a release; a new tool dir must be added here.
          change_path: "tools/demarkus-token/ tools/demarkus-publish/ tools/demarkus-plugin/ tools/plugin-prompts/ tools/tools.go tools/go.mod tools/go.sum protocol/ client/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="tools/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  # The composed knowledge binary (server plus broker), its image and the
  # demarkus-knowledge-server chart release together on knowledge/v, so
  # admin-CLI and plugin churn on tools/v never rebuilds them and knowledge
  # changes never trigger the plugin pin-bump chain. server/ is compiled in.
  semver-knowledge:
    needs: test-knowledge
    if: always() && needs.test-knowledge.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "knowledge/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          # See server's change_path note: chart-only commits must
          # bump the version so the chart actually publishes.
          change_path: "knowledge/ server/ protocol/ client/ deploy/helm/demarkus-knowledge-server/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          # The demarkus-knowledge-server chart published on server/v until
          # the broker fold, so the first knowledge/v release must sort above
          # the last server/v chart or `helm install` without --version keeps
          # picking the old one: seed it as the next minor of that tag.
          if [ -z "$(git tag --list 'knowledge/v*')" ]; then
            last_server="$(git tag --list 'server/v*' --sort=-v:refname | head -n1 | sed 's#^server/v##')"
            VERSION="$(printf '%s' "$last_server" | cut -d. -f1).$(( $(printf '%s' "$last_server" | cut -d. -f2) + 1 )).0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="knowledge/v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${VERSION}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  # The umbrella chart releases on its own stream (knowledge-system/v). It
  # vendors the local knowledge-server chart, so its changes bump it too;
  # the release job re-versions it to its latest tag before packaging.
  semver-knowledge-system:
    needs: detect-changes
    if: needs.detect-changes.outputs.knowledge_system == 'true'
    runs-on: ubuntu-latest
    # Reads tags only.
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: PaulHatch/semantic-version@8d3552d38408b608e90e76237a2a5ac9fe524d04 # v5.3.0
        id: semver
        with:
          tag_prefix: "knowledge-system/v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: '/^feat(\(.+\))?:/' # regex (slash-wrapped): also matches scoped feat(x):
          change_path: "deploy/helm/demarkus-knowledge-system/ deploy/helm/demarkus-knowledge-server/"
          bump_each_commit: false
          search_commit_body: true
      - name: Check if version changed
        id: check
        run: |
          TAG="knowledge-system/v${{ steps.semver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${{ steps.semver.outputs.version }}, Tag exists: $(git rev-parse --verify "$TAG" 2>/dev/null && echo yes || echo no)"

  release-protocol:
    needs: semver-protocol
    if: needs.semver-protocol.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Create tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'protocol/v${{ needs.semver-protocol.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);
      - name: Create GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'protocol/v${{ needs.semver-protocol.outputs.new_version }}';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Protocol ${{ needs.semver-protocol.outputs.new_version }}`,
              generate_release_notes: true
            });

  release-server:
    needs: semver-server
    if: needs.semver-server.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'server/v${{ needs.semver-server.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f server/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "server/v${{ needs.semver-server.outputs.new_version }}"

      # Stage pre-built binaries into dist/docker/<arch>/ so the Dockerfile
      # is COPY-only and buildx skips QEMU compilation entirely. demarkus-
      # server comes from server/.goreleaser.yml above; demarkus CLI lives
      # in client/ and isn't part of that goreleaser run, so we native
      # cross-compile it inline (fast — no QEMU because the runner is
      # amd64 and Go natively cross-compiles to any GOARCH).
      - name: Stage binaries for Docker build
        env:
          STAGED_BINS: demarkus-server
        run: |
          set -euxo pipefail
          ls dist/
          mkdir -p dist/docker/amd64 dist/docker/arm64 dist/docker/armv7

          for bin in $STAGED_BINS; do
            for arch in amd64:amd64 arm64:arm64 arm_7:armv7; do
              cp dist/${bin}_linux_${arch%%:*}*/"$bin" "dist/docker/${arch##*:}/"
            done
          done

          VER="${{ needs.semver-server.outputs.new_version }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C client -ldflags="-s -w -X main.version=$VER" \
              -o ../dist/docker/amd64/demarkus ./cmd/demarkus
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -C client -ldflags="-s -w -X main.version=$VER" \
              -o ../dist/docker/arm64/demarkus ./cmd/demarkus
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -C client -ldflags="-s -w -X main.version=$VER" \
              -o ../dist/docker/armv7/demarkus ./cmd/demarkus

      # Dockerfile is COPY-only over the staged binaries above. Multi-arch
      # build under QEMU completes in seconds because no Go compile runs
      # under emulation.
      - name: Build + push demarkus-server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-server:${{ needs.semver-server.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-server:latest

      # Chart version + appVersion are pinned 1:1 to the server module
      # version so `helm install ghcr.io/.../charts/demarkus-server --version
      # X` resolves the image at the same tag. Helm 3.13+ reads ~/.docker/
      # config.json for OCI auth, which docker/login-action already wrote.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.13.2

      # Dependency update vendors the common library chart into the package.
      - name: Package + push server charts
        run: |
          VER="${{ needs.semver-server.outputs.new_version }}"
          helm dependency update deploy/helm/demarkus-server
          helm package deploy/helm/demarkus-server --version "$VER" --app-version "$VER" --destination /tmp/charts
          helm push "/tmp/charts/demarkus-server-${VER}.tgz" oci://ghcr.io/latebit-io/charts

  release-client:
    needs: semver-client
    if: needs.semver-client.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'client/v${{ needs.semver-client.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f client/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "client/v${{ needs.semver-client.outputs.new_version }}"

      # Stage pre-built agent binaries (built by client/.goreleaser.yml's
      # demarkus-agent build entry, which also ships a linux tarball) into
      # dist/docker/<arch>/ so the Dockerfile is COPY-only and buildx
      # skips QEMU compilation.
      - name: Stage binaries for Docker build
        run: |
          set -euxo pipefail
          ls dist/
          mkdir -p dist/docker/amd64 dist/docker/arm64 dist/docker/armv7
          cp dist/demarkus-agent_linux_amd64*/demarkus-agent dist/docker/amd64/
          cp dist/demarkus-agent_linux_arm64*/demarkus-agent dist/docker/arm64/
          cp dist/demarkus-agent_linux_arm_7*/demarkus-agent dist/docker/armv7/

      # demarkus-agent lives in client/cmd/ so it rides the client release
      # cadence. Dockerfile is COPY-only over the staged binaries above.
      - name: Build + push demarkus-agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: client/cmd/demarkus-agent/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-agent:${{ needs.semver-client.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-agent:latest

      # Chart version + appVersion pinned 1:1 to the client module version
      # so the agent chart and the agent image released in the same module
      # bump always reference each other.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.13.2

      - name: Package + push demarkus-agent chart
        run: |
          VER="${{ needs.semver-client.outputs.new_version }}"
          helm package deploy/helm/demarkus-agent --version "$VER" --app-version "$VER" --destination /tmp/charts
          helm push "/tmp/charts/demarkus-agent-${VER}.tgz" oci://ghcr.io/latebit-io/charts

  release-tools:
    needs: semver-tools
    if: needs.semver-tools.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Create module tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'tools/v${{ needs.semver-tools.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      # Admin CLIs and plugin binaries only; the knowledge system ships on
      # its own stream via release-knowledge below.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f tools/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "tools/v${{ needs.semver-tools.outputs.new_version }}"

  release-knowledge:
    needs: semver-knowledge
    if: needs.semver-knowledge.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: knowledge/go.sum

      - name: Create module tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'knowledge/v${{ needs.semver-knowledge.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean -f knowledge/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: "knowledge/v${{ needs.semver-knowledge.outputs.new_version }}"

      # Stage the pre-built binary (built by knowledge/.goreleaser.yml above)
      # into dist/docker/<arch>/ so the Dockerfile is COPY-only and buildx
      # skips QEMU compilation.
      - name: Stage binaries for Docker build
        env:
          STAGED_BINS: demarkus-knowledge
        run: |
          set -euxo pipefail
          ls dist/
          mkdir -p dist/docker/amd64 dist/docker/arm64 dist/docker/armv7
          for bin in $STAGED_BINS; do
            for arch in amd64:amd64 arm64:arm64 arm_7:armv7; do
              cp dist/${bin}_linux_${arch%%:*}*/"$bin" "dist/docker/${arch##*:}/"
            done
          done

      # Admin CLIs ship as standalone binary archives on the tools stream
      # and are not bundled into any image (§6.7.A: minimal pod blast radius).
      - name: Build + push demarkus-knowledge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: knowledge/cmd/demarkus-knowledge/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/latebit-io/demarkus-knowledge:${{ needs.semver-knowledge.outputs.new_version }}
            ghcr.io/latebit-io/demarkus-knowledge:latest

      # Chart version + appVersion pinned 1:1 to the knowledge stream version
      # so the chart and the image released in the same bump always
      # reference each other.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.13.2

      - name: Package + push demarkus-knowledge-server chart
        run: |
          VER="${{ needs.semver-knowledge.outputs.new_version }}"
          helm package deploy/helm/demarkus-knowledge-server --version "$VER" --app-version "$VER" --destination /tmp/charts
          helm push "/tmp/charts/demarkus-knowledge-server-${VER}.tgz" oci://ghcr.io/latebit-io/charts

  # Runs after the sub-chart releases so the vendored charts and their image
  # tags point at releases that exist. Skipped sub-chart releases are fine;
  # a failed one blocks the umbrella, as do failed knowledge tests, which
  # skip that release rather than fail it.
  release-knowledge-system:
    needs: [semver-knowledge-system, test-knowledge, release-knowledge]
    if: ${{ always() && !cancelled() && needs.semver-knowledge-system.outputs.should_release == 'true' && contains(fromJSON('["success", "skipped"]'), needs.test-knowledge.result) && needs.release-knowledge.result != 'failure' }}
    runs-on: ubuntu-latest
    # Tag creation needs contents; the chart push and the library pull need packages.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.13.2

      - name: Re-version the vendored chart to its latest release tag
        # The sub-chart publishes with --version/--app-version from its own
        # tag stream; the committed Chart.yaml values are only local-render
        # placeholders. Mirror the published number so the vendored copy
        # defaults to the same image tag. A component job tags before it
        # pushes, so a tag alone does not prove a release: require the
        # component chart (pushed last, after its image) to exist on ghcr.
        run: |
          set -euo pipefail
          latest() { git tag --list "$1/v*" --sort=-v:refname | head -n1 | sed "s#^$1/v##"; }
          for pair in knowledge:demarkus-knowledge-server; do
            stream="${pair%%:*}"
            chart="${pair##*:}"
            ver="$(latest "$stream")"
            if [ -z "$ver" ]; then
              echo "no $stream/v* tag found" >&2
              exit 1
            fi
            if ! helm show chart "oci://ghcr.io/latebit-io/charts/$chart" --version "$ver" >/dev/null; then
              echo "::error::$stream/v$ver is tagged but $chart $ver is not on ghcr; that release did not finish" >&2
              exit 1
            fi
            yq -i ".version = \"$ver\" | .appVersion = \"$ver\"" "deploy/helm/$chart/Chart.yaml"
            echo "$chart -> $ver"
          done

      - name: Package + push demarkus-knowledge-system chart
        run: |
          VER="${{ needs.semver-knowledge-system.outputs.new_version }}"
          helm dependency update deploy/helm/demarkus-knowledge-system
          helm package deploy/helm/demarkus-knowledge-system --version "$VER" --app-version "$VER" --destination /tmp/charts
          helm push "/tmp/charts/demarkus-knowledge-system-${VER}.tgz" oci://ghcr.io/latebit-io/charts

      # Tag last: an existing tag makes semver skip the version, so tagging
      # before a failed push would never publish it.
      - name: Create chart tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = 'knowledge-system/v${{ needs.semver-knowledge-system.outputs.new_version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

  # Dispatch the pin-bump workflow after any binary release. The bump
  # workflow's own release trigger never fires: GoReleaser publishes with
  # the default GITHUB_TOKEN, and GitHub suppresses workflow triggering
  # from events that token creates. workflow_dispatch is the documented
  # exception to that suppression, so an explicit dispatch here is what
  # makes the pin chain release-driven instead of daily-cron-driven.
  dispatch-pin-bump:
    needs: [release-server, release-client, release-tools]
    if: ${{ !cancelled() && (needs.release-server.result == 'success' || needs.release-client.result == 'success' || needs.release-tools.result == 'success') }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow block: this job only
    # dispatches, so it gets exactly actions: write and nothing else.
    permissions:
      actions: write
    steps:
      - name: Trigger plugin pin bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run plugin-pin-bump.yml --repo "${{ github.repository }}"
