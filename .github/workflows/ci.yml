name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the Pulls.listFiles GitHub API on
    # pull_request events to compute the diff. The default GITHUB_TOKEN
    # in this repo lacks pull-requests scope (Settings → Actions →
    # Workflow permissions is set to restricted), so the action errors
    # with "Bad credentials". Grant the two scopes the action needs at
    # the job level — narrowest blast radius, no effect on other jobs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      broker: ${{ steps.filter.outputs.broker }}
      charts: ${{ steps.filter.outputs.charts }}
      release_contract: ${{ steps.filter.outputs.release_contract }}
      install: ${{ steps.filter.outputs.install }}
      agent_plugins: ${{ steps.filter.outputs.agent_plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
            client:
              - 'client/**'
              - 'protocol/**'
            broker:
              - 'tools/demarkus-broker/**'
              - 'tools/go.mod'
              - 'tools/go.sum'
              - 'protocol/**'
            charts:
              - 'deploy/helm/**'
            release_contract:
              - '.github/workflows/release.yml'
              - 'server/.goreleaser.yml'
              - 'server/Dockerfile.knowledge'
            install:
              - 'install.sh'
              - 'install-stack.sh'
              - 'scripts/test-install-renewal.sh'
              - 'scripts/test-install-stack-tokens.sh'
              - 'scripts/test-install-update-stack.sh'
            agent_plugins:
              - '.claude-plugin/**'
              - 'plugins/prompt-source/**'
              - 'plugins/claude-code/**'
              - 'plugins/claude-code-knowledge/**'
              - 'plugins/pi-memory/**'
              - 'plugins/pi-knowledge/**'
              - 'plugins/opencode-memory/**'
              - 'plugins/opencode-knowledge/**'
              - 'tools/plugin-prompts/**'
              - 'tools/demarkus-plugin/**'
              - 'tools/go.mod'
              - 'tools/go.sum'

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: protocol
      - name: Test
        run: cd protocol && go test ./...
      - name: Vet
        run: cd protocol && go vet ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Backend parity is a core invariant, so pgstore tests must run here, not
    # skip: DEMARKUS_TEST_PG_REQUIRED turns a missing DSN into a failure.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demarkus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMARKUS_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/demarkus_test
      DEMARKUS_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        # This job runs PR-controlled code; do not leave a token in .git/config.
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: server
      - name: Test
        run: cd server && go test ./...
      - name: Vet
        run: cd server && go vet ./...
      # Optional storage SDKs must not leak into the default server binary.
      - name: Build
        run: |
          set -euo pipefail
          cd server
          deps="$(go list -deps ./cmd/demarkus-server)"
          test -n "$deps"
          if grep -Eq '/internal/knowledge|cloud\.google\.com/go/storage' <<<"$deps"; then
            echo "default demarkus-server depends on knowledge storage code" >&2
            exit 1
          fi
          go build -o /tmp/demarkus-server ./cmd/demarkus-server
          syms="$(go tool nm /tmp/demarkus-server)"
          # Without this, a failed nm would leave grep with empty input and
          # the check would "pass" while proving nothing.
          test -n "$syms"
          if grep -Eq "jackc/pgx|cloud\.google\.com/go/storage" <<<"$syms"; then
            echo "default demarkus-server links an optional storage SDK" >&2
            exit 1
          fi
          go build -o /tmp/demarkus-knowledge-server ./cmd/demarkus-knowledge-server
          go build -o /tmp/demarkus-knowledge-bootstrap ./cmd/demarkus-knowledge-bootstrap
      - name: Build (postgres flavor)
        run: |
          set -euo pipefail
          cd server
          go vet -tags pg ./cmd/demarkus-server
          go build -tags pg -o /dev/null ./cmd/demarkus-server
          go build -o /dev/null ./cmd/demarkus-migrate
      # The release builds 32-bit arm, where an untyped 64-bit constant is a
      # compile error the amd64 build never sees (it shipped one: #338).
      - name: Cross-compile the release targets
        run: |
          set -euo pipefail
          cd server
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64; do
            export GOOS="${target%%/*}" GOARM=""
            rest="${target#*/}"
            case "$rest" in */*) export GOARCH="${rest%%/*}" GOARM="${rest#*/}" ;; *) export GOARCH="$rest" ;; esac
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-server
            CGO_ENABLED=0 go build -tags pg -o /dev/null ./cmd/demarkus-server
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-migrate
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-knowledge-server
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-knowledge-bootstrap
            echo "ok $GOOS/$GOARCH${GOARM:+v$GOARM}"
          done

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: client
      - name: Test
        run: cd client && go test ./...
      - name: Vet
        run: cd client && go vet ./...
      - name: Build CLI
        run: cd client && go build -o /dev/null ./cmd/demarkus
      - name: Build TUI
        run: cd client && go build -o /dev/null ./cmd/demarkus-tui
      - name: Build MCP
        run: cd client && go build -o /dev/null ./cmd/demarkus-mcp

  test-broker:
    needs: detect-changes
    if: needs.detect-changes.outputs.broker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: tools/demarkus-broker
      - name: Test
        run: cd tools && go test ./demarkus-broker/...
      - name: Vet
        run: cd tools && go vet ./demarkus-broker/...
      - name: Build
        run: cd tools && go build -o /dev/null ./demarkus-broker

  test-install:
    needs: detect-changes
    if: needs.detect-changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lints and runs a local script; no authenticated git operation, no API call.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # install.sh carries a pre-existing warning/info backlog (SC2034, SC2206,
      # SC2059, SC2024, SC2001) that is out of scope here, so it is gated at
      # error only. The test script is new and held to warning.
      - name: Shellcheck install.sh
        run: shellcheck -S error install.sh
      - name: Shellcheck install-stack.sh
        run: shellcheck -S error install-stack.sh
      - name: Shellcheck the renewal test
        run: shellcheck -S warning scripts/test-install-renewal.sh
      - name: Shellcheck the stack-tokens test
        run: shellcheck -S warning scripts/test-install-stack-tokens.sh
      - name: Shellcheck the update-stack test
        run: shellcheck -S warning scripts/test-install-update-stack.sh
      - name: Test certbot renewal wiring
        run: bash scripts/test-install-renewal.sh
      - name: Test stack token rotation
        run: bash scripts/test-install-stack-tokens.sh
      - name: Test stack component updates
        run: bash scripts/test-install-update-stack.sh

  test-agent-plugins:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Check generated prompts
        run: |
          cd tools
          go test ./plugin-prompts ./demarkus-plugin/...
          go run ./plugin-prompts check
      - name: Install plugin development dependencies
        run: |
          npm ci --prefix plugins/pi-memory
          npm ci --prefix plugins/pi-knowledge
          npm ci --prefix plugins/opencode-memory
          npm ci --prefix plugins/opencode-knowledge
      - name: Typecheck adapters (Pi is typecheck-only)
        run: |
          npm run typecheck --prefix plugins/pi-memory
          npm run typecheck --prefix plugins/pi-knowledge
          npm run typecheck --prefix plugins/opencode-memory
          npm run typecheck --prefix plugins/opencode-knowledge
      - name: Test OpenCode adapters and installers
        run: |
          npm test --prefix plugins/opencode-memory
          npm test --prefix plugins/opencode-knowledge
      - name: Check installers
        run: |
          bash -n plugins/opencode-memory/install.sh
          bash -n plugins/opencode-memory/scripts/bootstrap.sh
          bash -n plugins/opencode-knowledge/install.sh
          bash -n plugins/opencode-knowledge/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-memory/install.sh plugins/opencode-memory/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-knowledge/install.sh plugins/opencode-knowledge/scripts/bootstrap.sh

  # release.yml stages goreleaser build output by id; a rename on either side
  # would otherwise only surface at release time.
  test-release-contract:
    needs: detect-changes
    if: needs.detect-changes.outputs.release_contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert the release config builds what the images stage
        run: |
          set -euo pipefail
          staged="$(sed -n 's/.*for bin in \(.*\); do/\1/p' .github/workflows/release.yml)"
          test -n "$staged"
          for id in $staged; do
            yq -e ".builds[] | select(.id == \"$id\")" server/.goreleaser.yml >/dev/null \
              || { echo "release.yml stages $id but server/.goreleaser.yml has no such build id" >&2; exit 1; }
          done
          test "$(yq -r '.jobs."release-server".steps[] | select(.name == "Build + push demarkus-knowledge-server image") | .with.file' .github/workflows/release.yml)" = "server/Dockerfile.knowledge"
          yq -e '.jobs."release-server".steps[] | select(.name == "Build + push demarkus-knowledge-server image") | .with.tags | contains("ghcr.io/latebit-io/demarkus-knowledge-server")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."release-server".steps[] | select(.name == "Build + push demarkus-knowledge-server image") | .with.tags | contains("needs.semver-server.outputs.new_version")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs.detect-changes.steps[] | select(.id == "filter") | .with.filters | contains("deploy/helm/demarkus-knowledge-server/**")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."semver-server".steps[] | select(.id == "semver") | .with.change_path | contains("deploy/helm/demarkus-knowledge-server/")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."release-server".steps[] | select(.name == "Package + push server charts") | .run | contains("demarkus-knowledge-server")' .github/workflows/release.yml >/dev/null

  test-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - name: Install helm-unittest
        # helm-unittest v0.6.2's plugin-install hook fails on checksum
        # validation ("no properly formatted SHA checksum lines found"). The
        # release tarball already carries plugin.yaml + the untt binary, so
        # extract it straight into the helm plugins dir — helm discovers the
        # plugin with no install hook (and no broken checksum step).
        run: |
          HELM_PLUGINS="$(helm env HELM_PLUGINS)"
          mkdir -p "$HELM_PLUGINS/helm-unittest"
          curl -fsSL https://github.com/helm-unittest/helm-unittest/releases/download/v0.6.2/helm-unittest-linux-amd64-0.6.2.tgz \
            | tar -xz -C "$HELM_PLUGINS/helm-unittest"
      # Both server charts vendor deploy/helm/demarkus-server-common (a
      # library chart) so their shared templates cannot drift.
      - name: Build chart dependencies
        run: |
          helm dependency update deploy/helm/demarkus-server
          helm dependency update deploy/helm/demarkus-server-pg
      - name: Lint demarkus-server chart
        run: helm lint deploy/helm/demarkus-server
      - name: Lint demarkus-server-pg chart
        run: helm lint deploy/helm/demarkus-server-pg --set server.postgres.dsnSecret.name=pg-app
      - name: Lint demarkus-broker chart
        run: helm lint deploy/helm/demarkus-broker
      - name: Lint demarkus-agent chart
        run: helm lint deploy/helm/demarkus-agent
      - name: Lint demarkus-knowledge-server chart
        run: helm lint deploy/helm/demarkus-knowledge-server -f deploy/helm/demarkus-knowledge-server/tests/fixtures/valid-values.yaml
      # Helm never merges a library chart's values, so the two backend
      # charts must carry the same defaults; add deliberate divergences to
      # the del() list.
      - name: Assert the two server charts share their non-backend defaults
        run: |
          set -euo pipefail
          # Real files, not process substitution: bash drops the exit status
          # of a substituted command, so two failed yq runs would leave diff
          # comparing empty inputs and passing.
          strip() { yq -o=json 'del(.image, .storage, .server.postgres)' "$1" > "$2"; }
          strip deploy/helm/demarkus-server/values.yaml /tmp/file-values.json
          strip deploy/helm/demarkus-server-pg/values.yaml /tmp/pg-values.json
          test -s /tmp/file-values.json && test -s /tmp/pg-values.json
          diff /tmp/file-values.json /tmp/pg-values.json \
            || { echo "demarkus-server and demarkus-server-pg values drifted" >&2; exit 1; }
      - name: Unit test demarkus-server chart
        run: helm unittest deploy/helm/demarkus-server
      - name: Unit test demarkus-server-pg chart
        run: helm unittest deploy/helm/demarkus-server-pg
      - name: Unit test demarkus-broker chart
        run: helm unittest deploy/helm/demarkus-broker
      - name: Unit test demarkus-knowledge-server chart
        run: helm unittest deploy/helm/demarkus-knowledge-server

  test-charts-kind:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - uses: helm/kind-action@v1
        with:
          cluster_name: chart-upgrade-wipe
      - name: Upgrade-wipe regression — demarkus-server
        # The token Secret is now created out-of-band by the chart's
        # pre-install/pre-upgrade bootstrap Job (not templated), so it is never
        # helm-release-owned: broker-minted entries survive `helm upgrade` (the
        # Job no-ops on an existing Secret) and the Secret survives `helm
        # uninstall`. (The old lookup-skip "legacy-migration" case is gone with
        # the chart-templated Secret it guarded.)
        run: |
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-server \
            demarkus-server \
            test-server \
            demarkus-server-tokens \
            broker-minted-test \
            ZmFrZS10b2tlbi1oYXNo
      - name: Upgrade-wipe regression — demarkus-broker
        run: |
          # Broker requires a parseable ECDSA P-256 PEM for
          # oidc.brokerSigningKey — OIDCConfig.validate now parses
          # the key at LoadConfig (parse-at-validate). Generate an
          # ephemeral key per run, hand it to helm via --set-file
          # so the multi-line value travels through a file instead
          # of the shell, and let the trap rm it. The PEM never
          # lives in the repo or shell history.
          # (Avoid the literal GitHub-Actions expression marker in
          # this comment — the workflow parser scans `run:` blocks
          # for expressions and rejects an unmatched opener.)
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$SIGNING_KEY_FILE"
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-broker \
            demarkus-broker \
            test-broker \
            demarkus-broker-refresh-tokens \
            broker-seeded-test \
            ZmFrZS10b2tlbg== \
            --set oidc.issuer=https://accounts.google.com \
            --set oidc.clientID=test-client \
            --set oidc.clientSecret=test-secret \
            --set oidc.redirectURL=https://broker.example/auth/callback \
            --set server.publicURL=https://broker.example \
            --set-file oidc.brokerSigningKey="$SIGNING_KEY_FILE"
