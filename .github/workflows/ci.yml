name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the Pulls.listFiles GitHub API on
    # pull_request events to compute the diff. The default GITHUB_TOKEN
    # in this repo lacks pull-requests scope (Settings → Actions →
    # Workflow permissions is set to restricted), so the action errors
    # with "Bad credentials". Grant the two scopes the action needs at
    # the job level — narrowest blast radius, no effect on other jobs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      tools: ${{ steps.filter.outputs.tools }}
      charts: ${{ steps.filter.outputs.charts }}
      release_contract: ${{ steps.filter.outputs.release_contract }}
      install: ${{ steps.filter.outputs.install }}
      agent_plugins: ${{ steps.filter.outputs.agent_plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
            client:
              - 'client/**'
              - 'protocol/**'
            knowledge:
              - 'knowledge/**'
              - 'server/**'
              - 'protocol/**'
              - 'client/**'
            tools:
              - 'tools/**'
              - 'protocol/**'
              - 'client/**'
            charts:
              - 'deploy/helm/**'
            release_contract:
              - '.github/workflows/release.yml'
              - 'server/.goreleaser.yml'
              - 'knowledge/.goreleaser.yml'
              - 'knowledge/cmd/demarkus-knowledge/Dockerfile'
            install:
              - 'install.sh'
              - 'install-readonly.sh'
              - 'scripts/test-install-checksum.sh'
              - 'scripts/test-install-renewal.sh'
              - 'scripts/test-install-restart.sh'
              - 'scripts/test-install-update-stack.sh'
            agent_plugins:
              - '.claude-plugin/**'
              - 'plugins/prompt-source/**'
              - 'plugins/claude-code/**'
              - 'plugins/claude-code-knowledge/**'
              - 'plugins/pi-memory/**'
              - 'plugins/pi-knowledge/**'
              - 'plugins/opencode-memory/**'
              - 'plugins/opencode-knowledge/**'
              - 'plugins/cursor-memory/**'
              - 'plugins/cursor-knowledge/**'
              - '.cursor-plugin/**'
              - 'tools/plugin-prompts/**'
              - 'tools/demarkus-plugin/**'
              - 'tools/go.mod'
              - 'tools/go.sum'

  repo-checks:
    runs-on: ubuntu-latest
    # Runs scripts from the pull request; no authenticated git, no API call.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # check-comment-length.sh needs the merge base with main
          fetch-depth: 0
          persist-credentials: false
      - name: Shell scripts
        run: bash scripts/check-shell.sh
      - name: Plugin copies
        run: bash scripts/check-identical-copies.sh
      - name: Session start hooks report failures
        run: bash scripts/test-session-start-hooks.sh
      - name: Hook commands start under a spaced plugin root
        run: bash scripts/test-hook-commands.sh
      - name: Comment length
        run: |
          git branch -f main origin/main 2>/dev/null || true
          bash scripts/check-comment-length.sh

  lint-ratchet:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.protocol == 'true' ||
      needs.detect-changes.outputs.server == 'true' ||
      needs.detect-changes.outputs.client == 'true' ||
      needs.detect-changes.outputs.tools == 'true' ||
      needs.detect-changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # No root go.sum: without this the module cache never restores
          # and every run refetches everything.
          cache-dependency-path: "**/go.sum"
      # Two downloads from github.com, checksum verified. `go install` was
      # ~200 proxy fetches plus sumdb checks per run and failed on hiccups twice.
      - name: Install golangci-lint
        run: |
          v=2.9.0
          base="https://github.com/golangci/golangci-lint/releases/download/v$v"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/golangci-lint-$v-linux-amd64.tar.gz"
          curl -sSfLO "$base/golangci-lint-$v-checksums.txt"
          grep " golangci-lint-$v-linux-amd64.tar.gz$" "golangci-lint-$v-checksums.txt" | sha256sum -c -
          tar -xzf "golangci-lint-$v-linux-amd64.tar.gz" --strip-components=1 \
            -C "$(go env GOPATH)/bin" "golangci-lint-$v-linux-amd64/golangci-lint"
          golangci-lint --version
      # Fetch modules up front so a proxy hiccup fails here, once retried,
      # instead of surfacing as typecheck errors inside the ratchet.
      - name: Download modules
        run: |
          for modfile in */go.mod; do
            mod="${modfile%/go.mod}"
            (cd "$mod" && go mod download) || { sleep 15; (cd "$mod" && go mod download); }
          done
      - name: Lint ratchet
        run: bash scripts/lint-ratchet.sh

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: protocol
      - name: Test
        run: cd protocol && go test -race ./...
      - name: Vet
        run: cd protocol && go vet ./...
      - name: Vulnerabilities
        run: cd protocol && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        # This job runs PR-controlled code; do not leave a token in .git/config.
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: server
      - name: Test
        run: cd server && go test -race ./...
      - name: Vet
        run: cd server && go vet ./...
      - name: Vulnerabilities
        run: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Optional storage SDKs must not leak into the default server binary.
      - name: Build
        run: |
          set -euo pipefail
          cd server
          deps="$(go list -deps ./cmd/demarkus-server)"
          test -n "$deps"
          if grep -Eq '/internal/knowledge|cloud\.google\.com/go/storage' <<<"$deps"; then
            echo "default demarkus-server depends on knowledge storage code" >&2
            exit 1
          fi
          go build -o /tmp/demarkus-server ./cmd/demarkus-server
          go build -o /tmp/demarkus-knowledge-server ./cmd/demarkus-knowledge-server
      # The release builds 32-bit arm, where an untyped 64-bit constant is a
      # compile error the amd64 build never sees (it shipped one: #338).
      - name: Cross-compile the release targets
        run: |
          set -euo pipefail
          cd server
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64; do
            export GOOS="${target%%/*}" GOARM=""
            rest="${target#*/}"
            case "$rest" in */*) export GOARCH="${rest%%/*}" GOARM="${rest#*/}" ;; *) export GOARCH="$rest" ;; esac
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-server
            CGO_ENABLED=0 go build -o /dev/null ./cmd/demarkus-knowledge-server
            echo "ok $GOOS/$GOARCH${GOARM:+v$GOARM}"
          done

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: client
      - name: Test
        run: cd client && go test -race ./...
      - name: Vet
        run: cd client && go vet ./...
      - name: Vulnerabilities
        run: cd client && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build CLI
        run: cd client && go build -o /dev/null ./cmd/demarkus
      - name: Build TUI
        run: cd client && go build -o /dev/null ./cmd/demarkus-tui
      - name: Build MCP
        run: cd client && go build -o /dev/null ./cmd/demarkus-mcp

  test-knowledge:
    needs: detect-changes
    if: needs.detect-changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: knowledge/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: knowledge
      - name: Test
        run: cd knowledge && go test -race ./...
      - name: Vet
        run: cd knowledge && go vet ./...
      - name: Vulnerabilities
        run: cd knowledge && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        run: cd knowledge && go build ./...

  test-tools:
    needs: detect-changes
    if: needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: tools
      - name: Test
        run: cd tools && go test -race ./...
      - name: Vet
        run: cd tools && go vet ./...
      - name: Vulnerabilities
        run: cd tools && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        run: cd tools && go build ./...

  test-install:
    needs: detect-changes
    if: needs.detect-changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lints and runs a local script; no authenticated git operation, no API call.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # install.sh carries a pre-existing warning/info backlog (SC2034, SC2206,
      # SC2059, SC2024, SC2001) that is out of scope here, so it is gated at
      # error only. The test script is new and held to warning.
      - name: Shellcheck install.sh
        run: shellcheck -S error install.sh
      - name: Shellcheck the renewal test
        run: shellcheck -S warning scripts/test-install-renewal.sh
      - name: Shellcheck the update-stack test
        run: shellcheck -S warning scripts/test-install-update-stack.sh
      - name: Test certbot renewal wiring
        run: bash scripts/test-install-renewal.sh
      - name: Test stack component updates
        run: bash scripts/test-install-update-stack.sh
      - name: Test checksum verification fails closed
        run: bash scripts/test-install-checksum.sh
      - name: Test update stops and verifies only the installed server
        run: bash scripts/test-install-restart.sh

  test-agent-plugins:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent_plugins == 'true'
    runs-on: ubuntu-latest
    # Healthy runs take 4 to 7 minutes; a sick registry once took 5 minutes per
    # npm ci, so the store is cached and a slow run fails instead of waiting.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/*/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/go.sum
      - name: Check generated prompts
        run: |
          cd tools
          go test -race ./plugin-prompts ./demarkus-plugin/...
          go run ./plugin-prompts check
      - name: Install plugin development dependencies
        # No audit or fund calls in CI, and a short fetch timeout: a hung
        # registry request otherwise waits npm's 5-minute default per install.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
          NPM_CONFIG_FETCH_RETRIES: "1"
        run: |
          npm ci --prefix plugins/pi-memory
          npm ci --prefix plugins/pi-knowledge
          npm ci --prefix plugins/opencode-memory
          npm ci --prefix plugins/opencode-knowledge
      - name: Typecheck adapters (Pi is typecheck-only)
        run: |
          npm run typecheck --prefix plugins/pi-memory
          npm run typecheck --prefix plugins/pi-knowledge
          npm run typecheck --prefix plugins/opencode-memory
          npm run typecheck --prefix plugins/opencode-knowledge
      - name: Test OpenCode adapters and installers
        run: |
          npm test --prefix plugins/opencode-memory
          npm test --prefix plugins/opencode-knowledge
      - name: Check installers
        run: |
          bash -n plugins/opencode-memory/install.sh
          bash -n plugins/opencode-memory/scripts/bootstrap.sh
          bash -n plugins/opencode-knowledge/install.sh
          bash -n plugins/opencode-knowledge/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-memory/install.sh plugins/opencode-memory/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-knowledge/install.sh plugins/opencode-knowledge/scripts/bootstrap.sh
      - name: Check the Cursor plugins
        run: |
          jq empty .cursor-plugin/marketplace.json
          for p in cursor-memory cursor-knowledge; do
            bash -n plugins/$p/hooks/*.sh plugins/$p/scripts/bootstrap.sh
            shellcheck -S warning plugins/$p/hooks/*.sh plugins/$p/scripts/bootstrap.sh
            for f in plugins/$p/.cursor-plugin/plugin.json plugins/$p/hooks/hooks.json; do
              jq empty "$f"
            done
            bash plugins/$p/hooks/test.sh
          done
          jq empty plugins/cursor-memory/mcp.json

  # release.yml stages goreleaser build output by id; a rename on either side
  # would otherwise only surface at release time.
  test-release-contract:
    needs: detect-changes
    if: needs.detect-changes.outputs.release_contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert the release config builds what the images stage
        run: |
          set -euo pipefail
          # Each release job stages the ids its own goreleaser config builds.
          for pair in release-server:server/.goreleaser.yml release-knowledge:knowledge/.goreleaser.yml; do
            job="${pair%%:*}"
            config="${pair##*:}"
            staged="$(yq -r ".jobs.\"$job\".steps[] | select(.name == \"Stage binaries for Docker build\") | .env.STAGED_BINS" .github/workflows/release.yml)"
            test -n "$staged"
            for id in $staged; do
              yq -e ".builds[] | select(.id == \"$id\")" "$config" >/dev/null \
                || { echo "release.yml $job stages $id but $config has no such build id" >&2; exit 1; }
            done
          done
          test "$(yq -r '.jobs."release-knowledge".steps[] | select(.name == "Build + push demarkus-knowledge image") | .with.file' .github/workflows/release.yml)" = "knowledge/cmd/demarkus-knowledge/Dockerfile"
          yq -e '.jobs."release-knowledge".steps[] | select(.name == "Build + push demarkus-knowledge image") | .with.tags | contains("ghcr.io/latebit-io/demarkus-knowledge:")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."release-knowledge".steps[] | select(.name == "Build + push demarkus-knowledge image") | .with.tags | contains("needs.semver-knowledge.outputs.new_version")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs.detect-changes.steps[] | select(.id == "filter") | .with.filters | contains("deploy/helm/demarkus-knowledge-server/**")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."semver-knowledge".steps[] | select(.id == "semver") | .with.change_path | contains("deploy/helm/demarkus-knowledge-server/")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."semver-knowledge".steps[] | select(.id == "semver") | .with.change_path | contains("server/")' .github/workflows/release.yml >/dev/null
          yq -e '.jobs."release-knowledge".steps[] | select(.name == "Package + push demarkus-knowledge-server chart") | .run | contains("demarkus-knowledge-server")' .github/workflows/release.yml >/dev/null

  test-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - name: Install helm-unittest
        # helm-unittest v0.6.2's plugin-install hook fails on checksum
        # validation ("no properly formatted SHA checksum lines found"). The
        # release tarball already carries plugin.yaml + the untt binary, so
        # extract it straight into the helm plugins dir — helm discovers the
        # plugin with no install hook (and no broken checksum step).
        run: |
          HELM_PLUGINS="$(helm env HELM_PLUGINS)"
          mkdir -p "$HELM_PLUGINS/helm-unittest"
          curl -fsSL https://github.com/helm-unittest/helm-unittest/releases/download/v0.6.2/helm-unittest-linux-amd64-0.6.2.tgz \
            | tar -xz -C "$HELM_PLUGINS/helm-unittest"
      # demarkus-server vendors the demarkus-server-common library chart.
      - name: Build chart dependencies
        run: |
          helm dependency update deploy/helm/demarkus-server
      - name: Lint demarkus-server chart
        run: helm lint deploy/helm/demarkus-server
      - name: Lint demarkus-agent chart
        run: helm lint deploy/helm/demarkus-agent
      - name: Lint demarkus-knowledge-server chart
        run: helm lint deploy/helm/demarkus-knowledge-server -f deploy/helm/demarkus-knowledge-server/tests/fixtures/valid-values.yaml
      # The umbrella vendors the two local charts (file://) and the
      # library chart from ghcr.
      - name: Lint demarkus-knowledge-system umbrella chart
        run: |
          helm dependency update deploy/helm/demarkus-knowledge-system
          helm lint deploy/helm/demarkus-knowledge-system -f deploy/helm/demarkus-knowledge-system/tests/fixtures/values.yaml
      - name: Unit test demarkus-server chart
        run: helm unittest deploy/helm/demarkus-server
      - name: Unit test demarkus-knowledge-server chart
        run: helm unittest deploy/helm/demarkus-knowledge-server
      - name: Unit test demarkus-agent chart
        run: helm unittest deploy/helm/demarkus-agent
      - name: Unit test demarkus-knowledge-system umbrella chart
        run: helm unittest deploy/helm/demarkus-knowledge-system

  test-charts-kind:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - uses: helm/kind-action@v1
        with:
          cluster_name: chart-upgrade-wipe
      - name: Upgrade-wipe regression — demarkus-server
        # The token Secret is now created out-of-band by the chart's
        # pre-install/pre-upgrade bootstrap Job (not templated), so it is never
        # helm-release-owned: broker-minted entries survive `helm upgrade` (the
        # Job no-ops on an existing Secret) and the Secret survives `helm
        # uninstall`. (The old lookup-skip "legacy-migration" case is gone with
        # the chart-templated Secret it guarded.)
        run: |
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-server \
            demarkus-server \
            test-server \
            demarkus-server-tokens \
            broker-minted-test \
            ZmFrZS10b2tlbi1oYXNo
