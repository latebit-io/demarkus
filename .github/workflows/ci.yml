name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the Pulls.listFiles GitHub API on
    # pull_request events to compute the diff. The default GITHUB_TOKEN
    # in this repo lacks pull-requests scope (Settings → Actions →
    # Workflow permissions is set to restricted), so the action errors
    # with "Bad credentials". Grant the two scopes the action needs at
    # the job level — narrowest blast radius, no effect on other jobs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      broker: ${{ steps.filter.outputs.broker }}
      charts: ${{ steps.filter.outputs.charts }}
      install: ${{ steps.filter.outputs.install }}
      opencode_plugins: ${{ steps.filter.outputs.opencode_plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
            client:
              - 'client/**'
              - 'protocol/**'
            broker:
              - 'tools/demarkus-broker/**'
              - 'tools/go.mod'
              - 'tools/go.sum'
              - 'protocol/**'
            charts:
              - 'deploy/helm/**'
            install:
              - 'install.sh'
              - 'install-stack.sh'
              - 'scripts/test-install-renewal.sh'
              - 'scripts/test-install-stack-tokens.sh'
              - 'scripts/test-install-update-stack.sh'
            opencode_plugins:
              - 'plugins/opencode-memory/**'
              - 'plugins/opencode-knowledge/**'

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: protocol
      - name: Test
        run: cd protocol && go test ./...
      - name: Vet
        run: cd protocol && go vet ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: server
      - name: Test
        run: cd server && go test ./...
      - name: Vet
        run: cd server && go vet ./...
      - name: Build
        run: cd server && go build -o /dev/null ./cmd/demarkus-server

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: client
      - name: Test
        run: cd client && go test ./...
      - name: Vet
        run: cd client && go vet ./...
      - name: Build CLI
        run: cd client && go build -o /dev/null ./cmd/demarkus
      - name: Build TUI
        run: cd client && go build -o /dev/null ./cmd/demarkus-tui
      - name: Build MCP
        run: cd client && go build -o /dev/null ./cmd/demarkus-mcp

  test-broker:
    needs: detect-changes
    if: needs.detect-changes.outputs.broker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: tools/demarkus-broker
      - name: Test
        run: cd tools && go test ./demarkus-broker/...
      - name: Vet
        run: cd tools && go vet ./demarkus-broker/...
      - name: Build
        run: cd tools && go build -o /dev/null ./demarkus-broker

  test-install:
    needs: detect-changes
    if: needs.detect-changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lints and runs a local script; no authenticated git operation, no API call.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # install.sh carries a pre-existing warning/info backlog (SC2034, SC2206,
      # SC2059, SC2024, SC2001) that is out of scope here, so it is gated at
      # error only. The test script is new and held to warning.
      - name: Shellcheck install.sh
        run: shellcheck -S error install.sh
      - name: Shellcheck install-stack.sh
        run: shellcheck -S error install-stack.sh
      - name: Shellcheck the renewal test
        run: shellcheck -S warning scripts/test-install-renewal.sh
      - name: Shellcheck the stack-tokens test
        run: shellcheck -S warning scripts/test-install-stack-tokens.sh
      - name: Shellcheck the update-stack test
        run: shellcheck -S warning scripts/test-install-update-stack.sh
      - name: Test certbot renewal wiring
        run: bash scripts/test-install-renewal.sh
      - name: Test stack token rotation
        run: bash scripts/test-install-stack-tokens.sh
      - name: Test stack component updates
        run: bash scripts/test-install-update-stack.sh

  test-opencode-plugins:
    needs: detect-changes
    if: needs.detect-changes.outputs.opencode_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install plugin development dependencies
        run: |
          npm install --prefix plugins/opencode-memory
          npm install --prefix plugins/opencode-knowledge
      - name: Typecheck adapters
        run: |
          npm run typecheck --prefix plugins/opencode-memory
          npm run typecheck --prefix plugins/opencode-knowledge
      - name: Test knowledge adapter
        run: npm test --prefix plugins/opencode-knowledge
      - name: Check installers
        run: |
          bash -n plugins/opencode-memory/install.sh
          bash -n plugins/opencode-memory/scripts/bootstrap.sh
          bash -n plugins/opencode-knowledge/install.sh
          bash -n plugins/opencode-knowledge/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-memory/install.sh plugins/opencode-memory/scripts/bootstrap.sh
          shellcheck -S warning plugins/opencode-knowledge/install.sh plugins/opencode-knowledge/scripts/bootstrap.sh

  test-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - name: Install helm-unittest
        # helm-unittest v0.6.2's plugin-install hook fails on checksum
        # validation ("no properly formatted SHA checksum lines found"). The
        # release tarball already carries plugin.yaml + the untt binary, so
        # extract it straight into the helm plugins dir — helm discovers the
        # plugin with no install hook (and no broken checksum step).
        run: |
          HELM_PLUGINS="$(helm env HELM_PLUGINS)"
          mkdir -p "$HELM_PLUGINS/helm-unittest"
          curl -fsSL https://github.com/helm-unittest/helm-unittest/releases/download/v0.6.2/helm-unittest-linux-amd64-0.6.2.tgz \
            | tar -xz -C "$HELM_PLUGINS/helm-unittest"
      - name: Lint demarkus-server chart
        run: helm lint deploy/helm/demarkus-server
      - name: Lint demarkus-broker chart
        run: helm lint deploy/helm/demarkus-broker
      - name: Lint demarkus-agent chart
        run: helm lint deploy/helm/demarkus-agent
      - name: Unit test demarkus-server chart
        run: helm unittest deploy/helm/demarkus-server
      - name: Unit test demarkus-broker chart
        run: helm unittest deploy/helm/demarkus-broker

  test-charts-kind:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - uses: helm/kind-action@v1
        with:
          cluster_name: chart-upgrade-wipe
      - name: Upgrade-wipe regression — demarkus-server
        # The token Secret is now created out-of-band by the chart's
        # pre-install/pre-upgrade bootstrap Job (not templated), so it is never
        # helm-release-owned: broker-minted entries survive `helm upgrade` (the
        # Job no-ops on an existing Secret) and the Secret survives `helm
        # uninstall`. (The old lookup-skip "legacy-migration" case is gone with
        # the chart-templated Secret it guarded.)
        run: |
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-server \
            demarkus-server \
            test-server \
            demarkus-server-tokens \
            broker-minted-test \
            ZmFrZS10b2tlbi1oYXNo
      - name: Upgrade-wipe regression — demarkus-broker
        run: |
          # Broker requires a parseable ECDSA P-256 PEM for
          # oidc.brokerSigningKey — OIDCConfig.validate now parses
          # the key at LoadConfig (parse-at-validate). Generate an
          # ephemeral key per run, hand it to helm via --set-file
          # so the multi-line value travels through a file instead
          # of the shell, and let the trap rm it. The PEM never
          # lives in the repo or shell history.
          # (Avoid the literal GitHub-Actions expression marker in
          # this comment — the workflow parser scans `run:` blocks
          # for expressions and rejects an unmatched opener.)
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$SIGNING_KEY_FILE"
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-broker \
            demarkus-broker \
            test-broker \
            demarkus-broker-refresh-tokens \
            broker-seeded-test \
            ZmFrZS10b2tlbg== \
            --set oidc.issuer=https://accounts.google.com \
            --set oidc.clientID=test-client \
            --set oidc.clientSecret=test-secret \
            --set oidc.redirectURL=https://broker.example/auth/callback \
            --set server.publicURL=https://broker.example \
            --set-file oidc.brokerSigningKey="$SIGNING_KEY_FILE"
