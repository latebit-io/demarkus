name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 calls the Pulls.listFiles GitHub API on
    # pull_request events to compute the diff. The default GITHUB_TOKEN
    # in this repo lacks pull-requests scope (Settings → Actions →
    # Workflow permissions is set to restricted), so the action errors
    # with "Bad credentials". Grant the two scopes the action needs at
    # the job level — narrowest blast radius, no effect on other jobs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      broker: ${{ steps.filter.outputs.broker }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            protocol:
              - 'protocol/**'
            server:
              - 'server/**'
              - 'protocol/**'
            client:
              - 'client/**'
              - 'protocol/**'
            broker:
              - 'tools/demarkus-broker/**'
              - 'tools/go.mod'
              - 'tools/go.sum'
              - 'protocol/**'
            charts:
              - 'deploy/helm/**'

  test-protocol:
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: protocol
      - name: Test
        run: cd protocol && go test ./...
      - name: Vet
        run: cd protocol && go vet ./...

  test-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: server
      - name: Test
        run: cd server && go test ./...
      - name: Vet
        run: cd server && go vet ./...
      - name: Build
        run: cd server && go build -o /dev/null ./cmd/demarkus-server

  test-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: client
      - name: Test
        run: cd client && go test ./...
      - name: Vet
        run: cd client && go vet ./...
      - name: Build CLI
        run: cd client && go build -o /dev/null ./cmd/demarkus
      - name: Build TUI
        run: cd client && go build -o /dev/null ./cmd/demarkus-tui
      - name: Build MCP
        run: cd client && go build -o /dev/null ./cmd/demarkus-mcp

  test-broker:
    needs: detect-changes
    if: needs.detect-changes.outputs.broker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: tools/demarkus-broker
      - name: Test
        run: cd tools && go test ./demarkus-broker/...
      - name: Vet
        run: cd tools && go vet ./demarkus-broker/...
      - name: Build
        run: cd tools && go build -o /dev/null ./demarkus-broker

  test-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.2
      - name: Lint demarkus-server chart
        run: helm lint deploy/helm/demarkus-server
      - name: Lint demarkus-broker chart
        run: helm lint deploy/helm/demarkus-broker
      - name: Lint demarkus-agent chart
        run: helm lint deploy/helm/demarkus-agent
      - name: Unit test demarkus-server chart
        run: helm unittest deploy/helm/demarkus-server
      - name: Unit test demarkus-broker chart
        run: helm unittest deploy/helm/demarkus-broker

  test-charts-kind:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.2
      - uses: helm/kind-action@v1
        with:
          cluster_name: chart-upgrade-wipe
      - name: Upgrade-wipe regression — demarkus-server
        run: |
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-server \
            demarkus-server \
            test-server \
            demarkus-server-tokens \
            broker-minted-test \
            ZmFrZS10b2tlbi1oYXNo
      - name: Legacy-migration regression — demarkus-server
        env:
          SIMULATE_LEGACY_NO_KEEP: "true"
        run: |
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-server \
            demarkus-server-legacy \
            test-server-legacy \
            demarkus-server-legacy-tokens \
            broker-minted-test \
            ZmFrZS10b2tlbi1oYXNo
      - name: Upgrade-wipe regression — demarkus-broker
        run: |
          # Broker requires a parseable ECDSA P-256 PEM for
          # oidc.brokerSigningKey — OIDCConfig.validate now parses
          # the key at LoadConfig (parse-at-validate). Generate an
          # ephemeral key per run, hand it to helm via --set-file
          # so the multi-line value travels through a file instead
          # of the shell, and let the trap rm it. The PEM never
          # lives in the repo or shell history.
          # (Avoid the literal GitHub-Actions expression marker in
          # this comment — the workflow parser scans `run:` blocks
          # for expressions and rejects an unmatched opener.)
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$SIGNING_KEY_FILE"
          bash deploy/helm/test-upgrade-wipe.sh \
            deploy/helm/demarkus-broker \
            demarkus-broker \
            test-broker \
            demarkus-broker-refresh-tokens \
            broker-seeded-test \
            ZmFrZS10b2tlbg== \
            --set oidc.issuer=https://accounts.google.com \
            --set oidc.clientID=test-client \
            --set oidc.clientSecret=test-secret \
            --set oidc.redirectURL=https://broker.example/auth/callback \
            --set server.publicURL=https://broker.example \
            --set-file oidc.brokerSigningKey="$SIGNING_KEY_FILE"
