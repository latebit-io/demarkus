name: Bump plugin binary pins

# Keeps the demarkus-memory plugin's pinned managed-binary versions current
# without manual churn: resolves the latest server/client/tools releases and, if
# they differ from the pins, opens (or updates) a single PR. Runs daily, on every
# release, and on demand. The bump is idempotent, so the overlapping triggers
# converge on one PR.
on:
  schedule:
    - cron: "23 7 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugin-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'latebit-io/demarkus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest releases and update pins
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/bump-plugin-pins.sh

      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ steps.bump.outputs.server }}
          CLIENT: ${{ steps.bump.outputs.client }}
          TOOLS: ${{ steps.bump.outputs.tools }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          branch="auto/plugin-pin-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add plugins/claude-code/scripts/lib.sh \
                  plugins/claude-code/.claude-plugin/plugin.json \
                  .claude-plugin/marketplace.json
          git commit -m "chore(plugin-memory): bump managed binaries to latest release" \
                     -m "server ${SERVER}, client ${CLIENT}, tools ${TOOLS}; plugin v${VERSION}."
          git push --force origin "$branch"

          title="chore(plugin-memory): bump managed binaries (server ${SERVER})"
          body=$(printf '%s\n' \
            "Automated bump of the demarkus-memory plugin's managed-binary pins to the latest releases:" \
            "" \
            "- server \`${SERVER}\`" \
            "- client \`${CLIENT}\`" \
            "- tools \`${TOOLS}\`" \
            "" \
            "Plugin patch-bumped to \`v${VERSION}\`. Review and merge to ship; drift-detection re-downloads on the next plugin-managed server spawn." \
            "" \
            "Generated by \`.github/workflows/plugin-pin-bump.yml\`.")

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
            echo "Updated existing PR for $branch."
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
