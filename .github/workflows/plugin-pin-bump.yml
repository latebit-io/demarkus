name: Bump plugin binary pins

# Keeps the demarkus-memory plugin's pinned managed-binary versions current
# without manual churn: resolves the latest server/client/tools releases and, if
# they differ from the pins, opens (or updates) a single PR. Dispatched by
# release.yml right after any binary release (a release trigger here would be
# dead: GoReleaser publishes with the default GITHUB_TOKEN, whose events do not
# trigger workflows). The daily cron is the safety-net backstop. The bump is
# idempotent, so overlapping triggers converge on one PR.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugin-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'latebit-io/demarkus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest releases and update pins
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/bump-plugin-pins.sh

      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ steps.bump.outputs.server }}
          CLIENT: ${{ steps.bump.outputs.client }}
          TOOLS: ${{ steps.bump.outputs.tools }}
          MEMORY_VERSION: ${{ steps.bump.outputs.memory_version }}
          KNOWLEDGE_VERSION: ${{ steps.bump.outputs.knowledge_version }}
        run: |
          set -euo pipefail
          branch="auto/plugin-pin-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          # Pins live in the Go consts + every plugin's bootstrap; versions in the
          # plugin manifests + marketplace. Stage all of them (the bump script only
          # touches these paths).
          git add tools/demarkus-plugin/internal/provision/provision.go \
                  plugins/*/scripts/bootstrap.sh \
                  plugins/claude-code/.claude-plugin/plugin.json \
                  plugins/claude-code-knowledge/.claude-plugin/plugin.json \
                  plugins/pi-memory/package.json \
                  plugins/pi-knowledge/package.json \
                  plugins/opencode-memory/package.json \
                  plugins/opencode-knowledge/package.json \
                  plugins/cursor-memory/.cursor-plugin/plugin.json \
                  plugins/cursor-knowledge/.cursor-plugin/plugin.json \
                  .claude-plugin/marketplace.json \
                  .cursor-plugin/marketplace.json
          git commit -m "chore(plugins): bump managed binaries to latest release" \
                     -m "server ${SERVER}, client ${CLIENT}, tools ${TOOLS}."
          git push --force origin "$branch"

          title="chore(plugins): bump managed binaries (server ${SERVER})"
          body=$(printf '%s\n' \
            "Automated bump of the demarkus plugins' managed-binary pins (Go consts in provision.go + every bootstrap's TOOLS_VERSION) to the latest releases:" \
            "" \
            "- server \`${SERVER}\`" \
            "- client \`${CLIENT}\`" \
            "- tools \`${TOOLS}\`" \
            "" \
            "Plugins patch-bumped: memory \`${MEMORY_VERSION:-unchanged}\`, knowledge \`${KNOWLEDGE_VERSION:-unchanged}\`. Review and merge to ship; drift-detection re-downloads on the next plugin-managed server spawn." \
            "" \
            "Generated by \`.github/workflows/plugin-pin-bump.yml\`.")

          # Look up an OPEN PR only: `gh pr view <branch>` also resolves closed
          # PRs, so after a bump PR was closed unmerged, every subsequent run
          # silently edited the dead PR instead of opening a fresh one.
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" --title "$title" --body "$body"
            echo "Updated open PR #$open_pr for $branch."
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
