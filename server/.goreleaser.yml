version: 2

project_name: demarkus-server

monorepo:
  tag_prefix: server/
  dir: server

builds:
  - id: demarkus-server
    main: ./cmd/demarkus-server
    binary: demarkus-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # Postgres flavor: same command, built with -tags pg so the default
  # binary above keeps zero external database dependencies.
  - id: demarkus-server-pg
    main: ./cmd/demarkus-server
    binary: demarkus-server-pg
    flags:
      - -tags=pg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: demarkus-migrate
    main: ./cmd/demarkus-migrate
    binary: demarkus-migrate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: demarkus-server
    builds:
      - demarkus-server
    name_template: "demarkus-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Shipped as its own archive so a file-store deployment never downloads
  # the Postgres flavor.
  - id: demarkus-server-pg
    builds:
      - demarkus-server-pg
      - demarkus-migrate
    name_template: "demarkus-server-pg_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "demarkus-server_checksums.txt"

changelog:
  use: github-native
