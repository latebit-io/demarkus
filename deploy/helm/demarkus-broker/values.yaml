# Default values for demarkus-broker.
# Override with --values or --set on `helm install`.

image:
  # Single-binary image; demarkus-broker is ENTRYPOINT. HTTP /healthz
  # and /readyz probes, so no CLI is bundled.
  repository: ghcr.io/latebit-io/demarkus-broker
  # tag defaults to .Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Multi-replica HA. Slice C of the broker is stateless modulo k8s Secret
# writes (resourceVersion optimistic concurrency on world tokens Secret +
# refresh-tokens Secret); the sweeper coordinates via a coordination.k8s.io/Lease
# so N>=2 replicas is the production posture. Drop to 1 only for dev/trial
# clusters where you also want to flip sweeper.disabled=true to skip the
# leader-election overhead.
replicaCount: 2

server:
  # HTTP listen port inside the pod. The broker speaks plain HTTP — the
  # Ingress (shipped in the Ingress slice) terminates TLS. The pod listens
  # on this port; the Service forwards to it; the deployment renders
  # containerPort from this value.
  port: 8080

  # Signed-state-cookie HMAC key, base64-encoded. When empty the chart
  # generates a fresh 32-byte key on first install and preserves it across
  # `helm upgrade` via `lookup` on the existing config Secret. Override only
  # if you want to manage the key out-of-band (rotate by setting a new value
  # and bouncing the broker; any in-flight login is invalidated).
  cookieKey: ""

  # State cookie TTL. Long enough for a real user to complete the OIDC
  # redirect, short enough that a stale cookie cannot be replayed.
  stateTTL: 5m

  # Externally-reachable base URL of the broker, no trailing slash
  # (e.g. https://broker.acmecorp.com). Required: advertised as `issuer`
  # in /.well-known/openid-configuration and used as the base for the
  # broker-hosted device_authorization_endpoint + token_endpoint
  # overrides the same doc emits (universe onboarding, plan PR2). May
  # differ from oidc.redirectURL when the broker is fronted at a
  # different path or behind an Ingress with rewrites — operators set
  # this explicitly so the discovery doc never depends on guessing.
  publicURL: ""

  # Namespace the broker itself runs in. Defaults to the release namespace
  # via the helper; override only if the broker's state Secrets live
  # elsewhere (rare).
  brokerNamespace: ""

  # DEV-ONLY: drop the Secure attribute on the OIDC state cookie.
  # Default false. Flip to true only for local / kind harnesses where the
  # broker is reachable over plain HTTP and the Secure attribute would
  # prevent the cookie jar from replaying the state on /auth/callback.
  # Enabling this in a production deployment turns the state cookie into
  # a downgrade-attack surface — any plaintext-hijacked redirect can
  # complete the OIDC dance. Production deployments terminate TLS at the
  # Ingress, in which case this stays false and the cookie's Secure
  # attribute is honored end-to-end.
  insecureCookies: false

  # Refresh-token lifetime emitted on each device-code completion
  # (universe onboarding PR4). 90 days matches industry defaults
  # (Google / Auth0 / Okta sit in 60-180d). Operators tighten for
  # short-lived deployments or relax for headless CI tooling where
  # repeated re-login is operationally painful. Tokens past their TTL
  # are rejected at refresh time and reaped by the periodic Sweeper.
  refreshTokenTTL: 2160h  # 90d

  # Broker-signed id_token lifetime on the /device/token refresh-grant
  # path (PR4). 15m balances bounded compromise window against PR5
  # /me/install request budget. Must be strictly less than
  # refreshTokenTTL — a bearer that outlives its refresh credential
  # cannot be renewed.
  idTokenTTL: 15m

  # Secret name for the broker's refresh-token store (PR4). Holds the
  # JSON map of sha256(refresh_token) -> record. Default derived from
  # the release name. Created with helm.sh/resource-policy: keep so
  # chart lifecycle events never invalidate live refresh tokens.
  refreshTokensSecret: ""

  # MCP gateway listener (knowledge-system layer; plan: Broker MCP
  # Gateway). The gateway is ALWAYS ON — every broker is a
  # knowledge-system gateway, there is no `enabled` knob. Operators
  # tune the address, TLS, and first-write retry behavior here. An
  # existing pre-gateway deployment picks up the listener on :8081
  # silently on chart upgrade: the listener binds, the Service grows
  # a second `mcp` port, the NetworkPolicy admits traffic to it.
  # Exposure beyond the cluster requires setting `ingress.mcp.host`
  # (see the Ingress block below); leaving it unset keeps the
  # listener cluster-internal.
  mcp:
    # Listen address inside the pod. Must differ from server.port so
    # the management API and the MCP surface bind distinct listeners.
    # The Service exposes both ports; the Ingress routes by hostname.
    addr: ":8081"
    # Externally-reachable base URL of the MCP gateway, no trailing
    # slash (e.g. https://knowledge.acmecorp.com). Set it whenever
    # ingress.mcp.host differs from ingress.host: it feeds the
    # RFC 9728 `resource` field and the 401 resource_metadata link,
    # which must name the gateway host, not the issuer. Empty falls
    # back to server.publicURL (single-host deployments).
    publicURL: ""
    # TLS termination at the broker for the MCP listener. Two modes:
    #
    #   1. existingSecretRef.name unset (default) — broker speaks
    #      plain HTTP inside the cluster; the Ingress controller
    #      terminates TLS at the edge. Matches the management API's
    #      posture. Recommended for typical k8s deployments.
    #
    #   2. existingSecretRef.name set — chart mounts the named
    #      kubernetes.io/tls Secret read-only at a chart-managed
    #      path inside the broker pod and the rendered config
    #      points the MCP listener at the cert+key files. Use this
    #      when broker-to-Ingress mTLS is required, or when the
    #      deployment topology bypasses the Ingress entirely.
    #
    # The Secret must be a kubernetes.io/tls Secret (data keys
    # `tls.crt` + `tls.key`). The chart only references the Secret
    # by NAME at render time; a wrong type (Opaque instead of
    # kubernetes.io/tls) or missing data keys surface later as a
    # `CreateContainerConfigError` when the kubelet tries to project
    # the volume at pod startup. Verify the Secret shape out of band
    # before pointing the chart at it.
    tls:
      existingSecretRef:
        # Name of the kubernetes.io/tls Secret in the release
        # namespace. Empty disables broker-side TLS.
        name: ""
    # World-token TTL is NOT a chart knob. The broker provisions one
    # long-lived write token per world (no expiry) and holds it; reads
    # dispatch with no token at all. There is nothing to time out, so
    # there is no broker-side TTL to tune.
    #
    # First-write retry loop knobs. The first write to a world makes the
    # broker provision that world's write token; the world's
    # projected-Secret-volume refresh has a kubelet-bounded propagation
    # lag, so the freshly-written token can 401 at the world for up to
    # ~kubeletSyncPeriod (default ~1 min). The retry loop re-dispatches
    # the same token with backoff only on `unauthorized` responses,
    # distinguishing the propagation race from a genuine denial.
    #
    # Defaults (6 attempts, 250ms → 8s exponential) sum to ~16s of
    # waiting across attempts, well under the typical worst-case
    # propagation window. Tune up for slow-kubelet clusters; tune
    # down for development setups where retry latency masks
    # genuine misconfiguration.
    firstMintMaxAttempts: 6
    firstMintInitialBackoff: 250ms
    firstMintMaxBackoff: 8s

oidc:
  # OIDC discovery URL (e.g. https://accounts.google.com).
  issuer: ""
  # OAuth client ID registered at the IdP.
  clientID: ""
  # OAuth client secret. Two modes:
  #   1. Cleartext via this field — chart bakes it into the chart-managed
  #      config Secret. Easiest install path; the value lives in helm
  #      release history.
  #   2. existingSecretRef below — production path. Chart leaves
  #      clientSecret blank in the config Secret and mounts
  #      OIDC_CLIENT_SECRET into the broker pod from an externally-
  #      managed Kubernetes Secret (External Secrets Operator, Sealed
  #      Secrets, kubectl-created). Broker reads the env var on startup
  #      via the LoadConfig override path.
  # Set exactly one of clientSecret or existingSecretRef.name; the chart
  # fails template-render if both are set so the precedence isn't ambiguous
  # to a reader of the values file.
  clientSecret: ""
  existingSecretRef:
    # Name of the operator-managed Secret. Empty disables this mode.
    name: ""
    # Data key inside the Secret holding the OAuth client secret.
    key: clientSecret
  # Public URL of /auth/callback. Must exactly match the redirect URI
  # registered with the IdP.
  redirectURL: ""

  # Broker-global Google Workspace hosted-domain (`hd`) allowlist.
  # When non-empty, every IdP exchange (device flow, auth-code flow,
  # legacy /auth/callback) is rejected unless the verified id_token's
  # `hd` claim matches one of these entries. Consumer Google accounts
  # (no `hd`) and Workspace users from other tenants are denied before
  # any authorization code, refresh token, or world dispatch is
  # issued. Empty disables the gate — any verified identity passes
  # the broker layer; per-world `worlds[].allow` lists still apply
  # downstream.
  #
  # Keying on `hd` (not the email domain) is the spoof-resistant
  # choice: `hd` is set by Google from the Workspace tenant binding
  # and the user cannot influence it. See
  # /tools/demarkus-broker/internal/broker/authz.go `oidcDomainAllowed`.
  #
  # Entries are lowercased+trimmed at broker startup. Set multiple
  # to admit more than one org (Google's `hd` query param does not
  # support multi-domain — multi-tenant gating MUST be done server-
  # side, which is what this list does).
  #
  # Examples:
  #   allowDomains: ["example.com"]                 # single org
  #   allowDomains: ["example.com", "acme.test"]    # multi-org
  allowDomains: []

  # Broker-side ECDSA P-256 private key (PR4). The broker signs
  # id_tokens on /device/token refresh-grant responses with this key
  # and serves the matching public key at /.well-known/jwks.json. Two
  # modes — exactly the same shape as clientSecret:
  #
  #   1. Cleartext via brokerSigningKey: a multi-line PEM literal
  #      (PKCS#8 `-----BEGIN PRIVATE KEY-----` or SEC1
  #      `-----BEGIN EC PRIVATE KEY-----`). Easiest install path; the
  #      value lives in helm release history. Only acceptable for dev /
  #      kind clusters.
  #
  #   2. existingSigningKeyRef — production path. Chart leaves the
  #      field blank in the config Secret and mounts the PEM into the
  #      broker pod from an externally-managed Kubernetes Secret
  #      (External Secrets Operator, Sealed Secrets, kubectl-created).
  #
  # Generate a fresh key with:
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
  #
  # Rotation: swap the value and bounce the broker. Every refresh
  # token minted by the prior key still verifies (refreshStore is
  # opaque-token-only — the key signs the id_token, not the refresh
  # token), but every broker-signed id_token in flight is invalidated.
  # Cleaner rotation (overlapping keys + JWKS rollover) is deferred to
  # a future PR.
  brokerSigningKey: ""
  existingSigningKeyRef:
    # Name of the operator-managed Secret holding the PEM. Empty
    # disables this mode.
    name: ""
    # Data key inside the Secret holding the PEM.
    key: signing-key.pem

# Per-world authorization. Each entry produces one Role + RoleBinding in
# the world's namespace (RBAC slice) granting the broker SA get/patch on
# the named tokens Secret.
worlds: []
  # - name: team-a
  #   namespace: team-a
  #   tokensSecret: team-a-tokens
  #   # Reachable address handed to clients via /me/install during user
  #   # onboarding (mark://host:port). Optional: worlds without a publicURL
  #   # are excluded from /me/install responses,
  #   # because there is no address to wire the client to. Typically the
  #   # VPN-reachable hostname or in-cluster Service when the user's
  #   # network can route to it; see docs/deployment/security-topology.md.
  #   publicURL: "mark://world-a.cluster.internal:6309"
  #   # Cluster-internal address the MCP gateway uses to route
  #   # `mark://{worldName}/{path}` tool calls to this world.
  #   # Optional: when blank, the gateway resolves via the standard
  #   # `<name>.<namespace>.svc.cluster.local:6309` Service-DNS
  #   # convention (the demarkus-server chart's default keeps Service
  #   # name == world name, so most deployments leave this blank).
  #   # Override when the Service name diverges from the world's
  #   # logical name. Host:port only — the `mark://` scheme is
  #   # implicit.
  #   # internalAddress: "team-a-mark.team-a:6309"
  #   allow:
  #     domains: ["example.com"]
  #     groups: ["engineering"]
  #     emails: ["alice@example.com"]
  #   defaultToken:
  #     # Path glob scoping the broker's per-world write token. Use
  #     # the recursive `/**` glob for "write anywhere in this
  #     # world" — `/*` only matches top-level entries because
  #     # path.Match doesn't cross `/`, so a single-star glob would
  #     # refuse writes to anything in a subdirectory (e.g.
  #     # /team-a/foo.md). Narrow the scope only if you have a
  #     # specific reason to forbid writes to certain subtrees;
  #     # otherwise leave at /** so writers can publish anywhere
  #     # under the world.
  #     paths: ["/**"]
  #     # paths is the only knob. The write token's operations are
  #     # always ["publish"] (hardcoded in worldWriteTokenStore.Provision
  #     # so an open-reads regression can't slip in via config) and the
  #     # token never expires, so there is no operations/expiresAfter
  #     # field to set.

# Registered confidential web clients (RFC 6749 §2.1) — server-side
# apps (e.g. the Universe Library) that authenticate with a client
# secret and receive the authorization-code redirect at a real https
# URL instead of a native-app loopback. Explicit operator-curated
# registry, NOT open dynamic registration. Native/CLI agents never
# appear here. Store only the sha256-hex of the secret; the plaintext
# lives in the web app's own deployment.
webClients: []
  # - clientID: library-web
  #   # sha256-hex of the client secret, e.g.
  #   #   printf '%s' "$SECRET" | sha256sum | cut -d' ' -f1
  #   clientSecretHash: "0123…64 hex chars…cdef"
  #   # Exact-match https redirect allowlist — no wildcards, no
  #   # loopback. The broker rejects any redirect_uri not listed here.
  #   redirectURIs:
  #     - https://library.example.com/auth/callback
  #   # Optional human label for logs.
  #   name: Universe Library

# Periodic expiry + drift sweeper. Leader-elected via
# coordination.k8s.io/Lease so multi-replica deployments enforce
# singleton sweep without coordination on the broker side. Named
# `disabled` (not `enabled`) so the YAML zero-value is the
# production-safe behavior — omit the block and the sweeper runs.
sweeper:
  disabled: false
  interval: 5m
  leaseName: demarkus-broker-sweeper

# Per-subject + per-IP token-bucket rate limiting. Same `disabled`-not-
# `enabled` naming so omission keeps the protection on. Defaults match
# plan §6.2 Slice C.4: 10/min subject burst 5 (on /me/install, the only
# per-subject-limited management route), 20/min IP burst 5 on /auth/login.
#
# trustForwardedFor: the chart default is true because the broker's
# deployment posture is "behind an Ingress that strips spoofed
# X-Forwarded-For and appends the real client IP." This INVERTS the
# binary's default (false). The Ingress slice wires the controller-side
# XFF stripping so the per-IP limiter on /auth/login is effective.
# Flip to false only when running the broker without an Ingress in
# front (dev / port-forward).
rateLimit:
  disabled: false
  tokens:
    perMinute: 10
    burst: 5
  login:
    perMinute: 20
    burst: 5
  trustForwardedFor: true

# Knobs governing how the MCP gateway dials world servers over QUIC.
# Single block at the top level (not per-world) — the dialer posture is
# uniform across worlds.
worldDialer:
  # Disable QUIC TLS chain + hostname verification on the broker→world
  # dial. Required today for in-cluster deployments where each world
  # has a self-signed cert from cert-manager's `selfsigned` ClusterIssuer
  # (no shared CA the broker can trust). QUIC still encrypts on the
  # wire; the broker takes on faith that the address it dialed actually
  # belongs to the world it expects — NetworkPolicy + cluster RBAC do
  # the real isolation work in that topology.
  #
  # Flip back to false once a shared CA is wired (e.g., a cert-manager
  # CA Issuer signing all world certs + a broker-side CA bundle config
  # that loads it into the QUIC client's RootCAs).
  insecureSkipVerify: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness + readiness use the broker's own /healthz and /readyz HTTP
# endpoints (unauthed and rate-limit-bypassed by design — Slice C.4 §Routes).
probes:
  enabled: true
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Workload Identity (GKE) annotation — sets iam.gke.io/gcp-service-account
  # so the broker SA impersonates the named GSA without static keys.
  workloadIdentity:
    gsa: ""

# RBAC ships in the RBAC slice. Schema declared here so values structure
# is stable.
rbac:
  # When true (default), the chart creates per-world Role + RoleBinding
  # in each world's namespace plus a broker-namespace Role for the
  # sweeper Lease, the refresh-tokens Secret, and create/update on the
  # per-world write-token Secrets the broker provisions on first write.
  # Flip to false ONLY if your cluster manages RBAC out-of-band
  # (operator policies, GitOps Roles); you must then grant the broker
  # those same broker-namespace permissions yourself, or the write path
  # fails when it tries to persist a world's write token.
  create: true

# NetworkPolicy ships in the RBAC slice. Schema declared here so values
# structure is stable.
networkPolicy:
  enabled: true
  # Ingress controller namespace selector — broker accepts inbound HTTP
  # only from pods in this namespace. Override to match your controller
  # (defaults assume nginx-ingress in namespace `ingress-nginx`).
  ingressFromNamespace: ingress-nginx

# PodDisruptionBudget ships in the RBAC slice. Schema declared here so
# values structure is stable.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Ingress fronts the broker's plain-HTTP listener with TLS termination
# at the controller. The chart's `rateLimit.trustForwardedFor: true`
# default is only safe when the Ingress controller strips spoofed
# X-Forwarded-For from inbound requests and appends the real client IP
# — verify this for your controller before exposing the broker
# (nginx-ingress and Traefik do it by default; some Cloud LBs need
# explicit config). See README "X-Forwarded-For invariant".
ingress:
  enabled: false
  # IngressClass to route through. nginx is the most common managed-k8s
  # default; override for traefik / haproxy / cloud-specific classes.
  className: nginx
  # Public hostname the broker is reachable at, e.g. broker.example.com.
  # Required when ingress.enabled is true.
  host: ""
  # Controller-specific annotations. The broker's HTTP surface is
  # bog-standard so most defaults work; common knobs would be
  # nginx.ingress.kubernetes.io/proxy-body-size or
  # cert-manager.io/cluster-issuer.
  annotations: {}
  # Path to expose. Defaults to the whole broker surface at /.
  path: /
  pathType: Prefix
  # TLS configuration. Three modes:
  #   1. existingSecret: reference a pre-existing kubernetes.io/tls Secret
  #      (cert-manager-managed, externally-provisioned, etc.).
  #   2. certManager.enabled=true: chart provisions a cert-manager
  #      Certificate resource that creates the TLS Secret in this
  #      release's namespace.
  #   3. neither set: Ingress has no TLS block (Ingress controller
  #      handles TLS termination externally, or the deployment runs
  #      without TLS — not recommended for production).
  tls:
    existingSecret: ""
    certManager:
      enabled: false
      issuerRef:
        kind: ClusterIssuer
        name: letsencrypt-prod
      # Annotations on the Certificate resource.
      annotations: {}

  # MCP gateway exposure. The MCP listener (server.mcp.addr, default
  # :8081) is a separate listener from the management API, so it
  # routes through a distinct hostname rather than path-mixing on
  # the primary host. Keeping the hostnames separate avoids
  # `.well-known/*` collisions between the management API's OIDC
  # discovery (`/.well-known/openid-configuration`,
  # `/.well-known/jwks.json`) and the MCP listener's OAuth metadata
  # (`/.well-known/oauth-protected-resource`,
  # `/.well-known/oauth-authorization-server`).
  #
  # When `mcp.host` is set the chart adds a second rule + TLS block
  # to the same Ingress resource, routing the MCP host to the
  # Service's `mcp` port. Leave blank to keep the listener
  # cluster-internal (still reachable from inside the cluster for
  # in-cluster MCP clients or smoke tests). The MCP host requires
  # the parent `ingress.enabled` to be true.
  mcp:
    # Public hostname the MCP gateway is reachable at, e.g.
    # mcp.broker.example.com. Empty disables MCP ingress (listener
    # stays cluster-internal). Independent of `ingress.host`.
    host: ""
    # TLS configuration for the MCP host. Same three-mode shape as
    # the management host's `ingress.tls`:
    #   1. existingSecret: pre-existing kubernetes.io/tls Secret.
    #   2. certManager.enabled=true: chart provisions a Certificate.
    #   3. neither set: Ingress has no TLS block for this host.
    # The two TLS modes are mutually exclusive (render-time check).
    # Use a different Secret/issuer than the management host so
    # cert rotation on either side stays independent.
    tls:
      existingSecret: ""
      certManager:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        annotations: {}

service:
  type: ClusterIP
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# TopologySpreadConstraints keep the two replicas off the same node when
# possible. ScheduleAnyway so the broker still schedules on
# single-node clusters or when capacity is tight.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {} # filled by deployment template using selector labels

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
