{{/*
Broker configuration Secret. Holds the full config.yaml that the broker
reads at startup (CLI arg -config defaults to /etc/demarkus-broker/config.yaml)
plus a separate `cookie-key` data field that the resolveCookieKey helper
reads from the live Secret on subsequent helm-upgrades to preserve the
HMAC key across chart updates.

Both the cookie-key field and the cookieKey embedded in the config.yaml
field are populated from a single $cookieKey variable so they can never
drift within a single render pass. On `helm upgrade` the lookup branch
of resolveCookieKey returns the live cluster value; on first `helm
install` (and on offline `helm template`) randAlphaNum produces a fresh
key.

The config.yaml is rendered as a Secret rather than a ConfigMap because
it contains both the OIDC client secret and the cookie HMAC key.
*/}}
{{- /* Reject ambiguous values: clientSecret cleartext and existingSecretRef
       are mutually exclusive operator-facing modes. With both set the
       runtime precedence (env var wins over file) would be a surprising
       footgun for whoever reads the values file later. */ -}}
{{- if and .Values.oidc.clientSecret .Values.oidc.existingSecretRef.name -}}
{{- fail "oidc.clientSecret and oidc.existingSecretRef.name are mutually exclusive; set exactly one" -}}
{{- end -}}
{{- if and (not .Values.oidc.clientSecret) (not .Values.oidc.existingSecretRef.name) -}}
{{- fail "oidc.clientSecret or oidc.existingSecretRef.name is required" -}}
{{- end -}}
{{- /* Catch this at render time rather than at pod startup: a blank
       existingSecretRef.key would render a secretKeyRef with no key,
       which the kubelet rejects with a CreateContainerConfigError
       only after the pod schedules. */ -}}
{{- if and .Values.oidc.existingSecretRef.name (not .Values.oidc.existingSecretRef.key) -}}
{{- fail "oidc.existingSecretRef.key is required when oidc.existingSecretRef.name is set" -}}
{{- end -}}
{{- /* Same mutual-exclusion shape for the broker signing key (PR4).
       The render-time guard catches ambiguity before pod startup. */ -}}
{{- if and .Values.oidc.brokerSigningKey .Values.oidc.existingSigningKeyRef.name -}}
{{- fail "oidc.brokerSigningKey and oidc.existingSigningKeyRef.name are mutually exclusive; set exactly one" -}}
{{- end -}}
{{- if and (not .Values.oidc.brokerSigningKey) (not .Values.oidc.existingSigningKeyRef.name) -}}
{{- fail "oidc.brokerSigningKey or oidc.existingSigningKeyRef.name is required" -}}
{{- end -}}
{{- if and .Values.oidc.existingSigningKeyRef.name (not .Values.oidc.existingSigningKeyRef.key) -}}
{{- fail "oidc.existingSigningKeyRef.key is required when oidc.existingSigningKeyRef.name is set" -}}
{{- end -}}
{{- $cookieKey := include "demarkus-broker.resolveCookieKey" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demarkus-broker.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demarkus-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  cookie-key: {{ $cookieKey | quote }}
  config.yaml: |
    server:
      addr: {{ printf ":%d" (int .Values.server.port) | quote }}
      cookieKey: {{ $cookieKey | quote }}
      stateTTL: {{ .Values.server.stateTTL | quote }}
      brokerNamespace: {{ include "demarkus-broker.brokerNamespace" . | quote }}
      issuancesSecret: {{ include "demarkus-broker.issuancesSecretName" . | quote }}
      refreshTokensSecret: {{ include "demarkus-broker.refreshTokensSecretName" . | quote }}
      refreshTokenTTL: {{ .Values.server.refreshTokenTTL | quote }}
      idTokenTTL: {{ .Values.server.idTokenTTL | quote }}
      publicURL: {{ required "server.publicURL is required" .Values.server.publicURL | quote }}
      insecureCookies: {{ .Values.server.insecureCookies }}
    oidc:
      issuer: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
      clientID: {{ required "oidc.clientID is required" .Values.oidc.clientID | quote }}
      {{- /* When existingSecretRef is set, leave clientSecret blank in the
             rendered config — the broker's LoadConfig applies the
             OIDC_CLIENT_SECRET env-var override (sourced via secretKeyRef
             in deployment.yaml) before validate() runs. The mutual-
             exclusion guard above ensures exactly one path produces the
             runtime value. */}}
      clientSecret: {{ default "" .Values.oidc.clientSecret | quote }}
      redirectURL: {{ required "oidc.redirectURL is required" .Values.oidc.redirectURL | quote }}
      {{- /* Same env-var-override pattern as clientSecret: cleartext PEM
             renders into the config Secret; existingSigningKeyRef leaves
             it blank and main.go reads BROKER_SIGNING_KEY at startup. */}}
      brokerSigningKey: |
{{ default "" .Values.oidc.brokerSigningKey | indent 8 }}
    worlds:
{{- range .Values.worlds }}
      {{- /* Wrap .allow with `default (dict)` because Go templates panic on
             nil pointer access — operators commonly omit the allow block
             entirely to get the "all empty = open world" predicate from
             worldAllows. Without this guard, .allow.domains evaluates a
             nil .allow and template rendering aborts. */ -}}
      {{- $allow := default (dict) .allow }}
      - name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
        tokensSecret: {{ .tokensSecret | quote }}
        {{- /* publicURL is the world's reachable address for client install
               (universe onboarding). Optional in values; render explicitly
               so the resulting YAML shape is stable across "set" and "unset"
               and the operator can grep for the field. Blank string means
               "skip in /me/install" — enforced by the broker, not here. */}}
        publicURL: {{ default "" .publicURL | quote }}
        allow:
          domains: {{ default (list) (get $allow "domains") | toJson }}
          groups: {{ default (list) (get $allow "groups") | toJson }}
          emails: {{ default (list) (get $allow "emails") | toJson }}
        defaultToken:
          paths: {{ .defaultToken.paths | toJson }}
          operations: {{ .defaultToken.operations | toJson }}
          expiresAfter: {{ .defaultToken.expiresAfter | quote }}
{{- end }}
    sweeper:
      disabled: {{ .Values.sweeper.disabled }}
      interval: {{ .Values.sweeper.interval | quote }}
      leaseName: {{ .Values.sweeper.leaseName | quote }}
    rateLimit:
      disabled: {{ .Values.rateLimit.disabled }}
      tokens:
        perMinute: {{ .Values.rateLimit.tokens.perMinute }}
        burst: {{ .Values.rateLimit.tokens.burst }}
      login:
        perMinute: {{ .Values.rateLimit.login.perMinute }}
        burst: {{ .Values.rateLimit.login.burst }}
      trustForwardedFor: {{ .Values.rateLimit.trustForwardedFor }}
