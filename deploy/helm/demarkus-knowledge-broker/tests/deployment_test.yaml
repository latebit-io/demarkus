suite: deployment
templates:
  - deployment.yaml
  - secret-config.yaml
release:
  namespace: broker-ns
set:
  oidc.issuer: https://accounts.example.com
  oidc.clientID: broker-app
  oidc.clientSecret: shh
  oidc.redirectURL: https://broker.example.com/auth/callback
  # PR4 requires a signing-key surface — suite-wide default keeps
  # every test in this file rendering. Individual tests override
  # when targeting the signing-key surface specifically.
  oidc.brokerSigningKey: "test-pem-placeholder"
  server.publicURL: https://broker.example.com
tests:
  - it: renders a Deployment with two replicas and rolling update strategy
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-demarkus-knowledge-broker
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: strategy is overridable so operators can trade surge for availability
    template: deployment.yaml
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0

  - it: container image uses AppVersion when image.tag empty and relies on ENTRYPOINT
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/latebit-io/demarkus-knowledge-broker:0.1.22
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: checksum/config annotation present so config changes roll the pod
    template: deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[0-9a-f]{64}$'

  - it: pod-level securityContext locks down the pod
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: container-level securityContext locks down the container
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: HTTP probes hit /healthz and /readyz on the http port
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: probes omitted when probes.enabled=false
    template: deployment.yaml
    set:
      probes.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: POD_NAME env always set from fieldRef metadata.name
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: OIDC_CLIENT_SECRET env absent when only clientSecret cleartext set
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OIDC_CLIENT_SECRET

  - it: OIDC_CLIENT_SECRET env mounted via secretKeyRef when existingSecretRef.name set
    template: deployment.yaml
    set:
      oidc.clientSecret: ""
      oidc.existingSecretRef.name: my-oidc-secret
      oidc.existingSecretRef.key: clientSecret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-oidc-secret
                key: clientSecret

  - it: BROKER_SIGNING_KEY env absent when only brokerSigningKey cleartext set
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: BROKER_SIGNING_KEY

  - it: BROKER_SIGNING_KEY env mounted via secretKeyRef when existingSigningKeyRef.name set
    template: deployment.yaml
    set:
      oidc.brokerSigningKey: ""
      oidc.existingSigningKeyRef.name: my-broker-signing
      oidc.existingSigningKeyRef.key: signing-key.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROKER_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: my-broker-signing
                key: signing-key.pem

  - it: topologySpread matchLabels populated from selector labels, not values empty default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: demarkus-knowledge-broker
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: container args reference /etc/demarkus-knowledge-broker/config.yaml
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-config"
      - contains:
          path: spec.template.spec.containers[0].args
          content: /etc/demarkus-knowledge-broker/config.yaml
