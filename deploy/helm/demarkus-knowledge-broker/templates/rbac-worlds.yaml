{{- if .Values.rbac.create }}
{{- /* World RBAC: one Role + RoleBinding per world namespace, get/update
   pinned to each world's tokens Secret and agent token Secret there. The
   broker creates either when missing; outside the broker namespace that
   needs a create rule, since resourceNames cannot restrict create. With
   rbac.create false, provision these Roles out of band. */ -}}
{{- $fullname := include "demarkus-knowledge-broker.fullname" . -}}
{{- $name := printf "%s-worlds" $fullname -}}
{{- $saName := include "demarkus-knowledge-broker.serviceAccountName" . -}}
{{- $saNamespace := .Release.Namespace -}}
{{- $labels := include "demarkus-knowledge-broker.labels" . -}}
{{- $brokerNs := include "demarkus-knowledge-broker.brokerNamespace" . -}}
{{- $agentTokens := include "demarkus-knowledge-broker.agentTokens" . | fromYamlArray -}}
{{- $secretsByNs := dict -}}
{{- range include "demarkus-knowledge-broker.worlds" . | fromYamlArray }}
{{- $secrets := append (default list (get $secretsByNs .namespace)) .tokensSecret }}
{{- $worldName := .name }}
{{- range $agentTokens }}{{ if eq .world $worldName }}{{ $secrets = append $secrets .secret }}{{ end }}{{ end }}
{{- $_ := set $secretsByNs .namespace $secrets }}
{{- end }}
{{- range $namespace, $secrets := $secretsByNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson $secrets }}
    verbs: ["get", "update"]
  {{- if ne $namespace $brokerNs }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
{{- end }}
