{{/*
Broker configuration Secret: the config.yaml the broker reads at startup.
Rendered deterministically (no lookup, no random values) so GitOps
controllers see a stable manifest; runtime state lives in Secrets the
broker creates itself.
*/}}
{{- /* Reject ambiguous values: clientSecret cleartext and existingSecretRef
       are mutually exclusive operator-facing modes. With both set the
       runtime precedence (env var wins over file) would be a surprising
       footgun for whoever reads the values file later. */ -}}
{{- if and .Values.oidc.clientSecret .Values.oidc.existingSecretRef.name -}}
{{- fail "oidc.clientSecret and oidc.existingSecretRef.name are mutually exclusive; set exactly one" -}}
{{- end -}}
{{- if and (not .Values.oidc.clientSecret) (not .Values.oidc.existingSecretRef.name) -}}
{{- fail "oidc.clientSecret or oidc.existingSecretRef.name is required" -}}
{{- end -}}
{{- /* Catch this at render time rather than at pod startup: a blank
       existingSecretRef.key would render a secretKeyRef with no key,
       which the kubelet rejects with a CreateContainerConfigError
       only after the pod schedules. */ -}}
{{- if and .Values.oidc.existingSecretRef.name (not .Values.oidc.existingSecretRef.key) -}}
{{- fail "oidc.existingSecretRef.key is required when oidc.existingSecretRef.name is set" -}}
{{- end -}}
{{- /* Signing key: cleartext, an existing Secret, or neither (the broker
       generates one into server.signingKeySecret on first start). */ -}}
{{- if and .Values.oidc.brokerSigningKey .Values.oidc.existingSigningKeyRef.name -}}
{{- fail "oidc.brokerSigningKey and oidc.existingSigningKeyRef.name are mutually exclusive; set at most one" -}}
{{- end -}}
{{- if and .Values.oidc.existingSigningKeyRef.name (not .Values.oidc.existingSigningKeyRef.key) -}}
{{- fail "oidc.existingSigningKeyRef.key is required when oidc.existingSigningKeyRef.name is set" -}}
{{- end -}}
{{- /* MCP gateway TLS validation. The chart's only TLS mode is
       existingSecretRef pointing at a kubernetes.io/tls Secret;
       in-line cert/key cleartext is deliberately not supported (a
       private-key PEM in helm release history is never acceptable
       even for dev). Skipping TLS entirely (existingSecretRef.name
       blank) is the recommended path because the Ingress terminates
       TLS at the edge. */ -}}
{{- /* Catch the misconfig where an operator points both listeners
       at the same port — would collide at bind() inside the broker
       pod, surfacing as a CrashLoop with no breadcrumb in the
       chart-render output. Compare the parsed port NUMBERS rather
       than raw strings so equivalent forms like `0.0.0.0:8080`,
       `:8080`, and `127.0.0.1:8080` all collapse to one collision
       signal against management's `server.port`. */ -}}
{{- $mcpPort := include "demarkus-knowledge-broker.mcpPort" . | int -}}
{{- if eq $mcpPort (int .Values.server.port) -}}
{{- fail "server.mcp.addr must differ from server.port (management API and MCP gateway bind distinct listeners)" -}}
{{- end -}}
{{- /* Web clients: exactly one secret mode per entry. */ -}}
{{- range $i, $wc := .Values.webClients -}}
{{- $ref := default dict $wc.existingSecretRef -}}
{{- $modes := 0 -}}
{{- if $wc.clientSecret }}{{ $modes = add1 $modes }}{{ end -}}
{{- if $wc.clientSecretHash }}{{ $modes = add1 $modes }}{{ end -}}
{{- if $ref.name }}{{ $modes = add1 $modes }}{{ end -}}
{{- if ne (int $modes) 1 -}}
{{- fail (printf "webClients[%d]: set exactly one of clientSecret, clientSecretHash, existingSecretRef.name" $i) -}}
{{- end -}}
{{- end -}}
{{- $worlds := include "demarkus-knowledge-broker.worlds" . | fromYamlArray -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demarkus-knowledge-broker.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demarkus-knowledge-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    server:
      addr: {{ printf ":%d" (int .Values.server.port) | quote }}
      {{- with .Values.server.cookieKey }}
      cookieKey: {{ . | quote }}
      {{- end }}
      cookieKeySecret: {{ include "demarkus-knowledge-broker.cookieKeySecretName" . | quote }}
      stateTTL: {{ .Values.server.stateTTL | quote }}
      brokerNamespace: {{ include "demarkus-knowledge-broker.brokerNamespace" . | quote }}
      refreshTokensSecret: {{ include "demarkus-knowledge-broker.refreshTokensSecretName" . | quote }}
      signingKeySecret: {{ include "demarkus-knowledge-broker.signingKeySecretName" . | quote }}
      dynamicClientsSecret: {{ include "demarkus-knowledge-broker.dynamicClientsSecretName" . | quote }}
      refreshTokenTTL: {{ .Values.server.refreshTokenTTL | quote }}
      idTokenTTL: {{ .Values.server.idTokenTTL | quote }}
      publicURL: {{ required "server.publicURL is required" .Values.server.publicURL | quote }}
      insecureCookies: {{ .Values.server.insecureCookies }}
      {{- /* MCP gateway block. Always rendered — gateway is always
             on (plan v4 Non-Negotiable). TLS certFile/keyFile are
             only emitted when an existingSecretRef pins them to the
             chart-managed mount path; absence means the broker
             listens plain HTTP and the Ingress terminates TLS. */}}
      mcp:
        addr: {{ .Values.server.mcp.addr | quote }}
        {{- with .Values.server.mcp.publicURL }}
        publicURL: {{ . | quote }}
        {{- end }}
        {{- with .Values.server.mcp.tls.existingSecretRef.name }}
        tls:
          certFile: {{ printf "%s/tls.crt" (include "demarkus-knowledge-broker.mcpTLSMountPath" $) | quote }}
          keyFile: {{ printf "%s/tls.key" (include "demarkus-knowledge-broker.mcpTLSMountPath" $) | quote }}
        {{- end }}
        firstMintMaxAttempts: {{ .Values.server.mcp.firstMintMaxAttempts }}
        firstMintInitialBackoff: {{ .Values.server.mcp.firstMintInitialBackoff | quote }}
        firstMintMaxBackoff: {{ .Values.server.mcp.firstMintMaxBackoff | quote }}
        toolProfile: {{ .Values.server.mcp.toolProfile | quote }}
    oidc:
      issuer: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
      clientID: {{ required "oidc.clientID is required" .Values.oidc.clientID | quote }}
      {{- /* When existingSecretRef is set, leave clientSecret blank in the
             rendered config — the broker's LoadConfig applies the
             OIDC_CLIENT_SECRET env-var override (sourced via secretKeyRef
             in deployment.yaml) before validate() runs. The mutual-
             exclusion guard above ensures exactly one path produces the
             runtime value. */}}
      clientSecret: {{ default "" .Values.oidc.clientSecret | quote }}
      redirectURL: {{ required "oidc.redirectURL is required" .Values.oidc.redirectURL | quote }}
      {{- /* Cleartext PEM renders here; existingSigningKeyRef arrives as
             BROKER_SIGNING_KEY; blank makes the broker generate and persist
             one in signingKeySecret. */}}
      brokerSigningKey: |
{{ default "" .Values.oidc.brokerSigningKey | indent 8 }}
      {{- /* Broker-global hd allowlist. Render an explicit `[]` when
             unset so the rendered config is self-documenting (an
             operator reading the Secret sees the gate is open by
             design, not missing-by-omission). Non-empty: render as
             a flow-style list; the broker lowercases+trims at
             validate, so casing in values is preserved verbatim here. */}}
      allowDomains: {{ toJson (default (list) .Values.oidc.allowDomains) }}
    worlds:
{{- range $worlds }}
      {{- /* Optional fields render as empty so the YAML shape is stable:
             blank publicURL skips /me/install, blank internalAddress takes
             the broker's Service-DNS default, blank dialAddress dials the
             internal address itself. */ -}}
      {{- $allow := default (dict) .allow }}
      {{- $defaultToken := default (dict) .defaultToken }}
      - name: {{ required "worlds[].name is required" .name | quote }}
        namespace: {{ .namespace | quote }}
        tokensSecret: {{ .tokensSecret | quote }}
        publicURL: {{ default "" .publicURL | quote }}
        internalAddress: {{ default "" .internalAddress | quote }}
        dialAddress: {{ default "" .dialAddress | quote }}
        allow:
          domains: {{ default (list) (get $allow "domains") | toJson }}
          groups: {{ default (list) (get $allow "groups") | toJson }}
          emails: {{ default (list) (get $allow "emails") | toJson }}
        defaultToken:
          paths: {{ required "worlds[].defaultToken.paths is required" (get $defaultToken "paths") | toJson }}
{{- end }}
    {{- /* Confidential web-client registry. A cleartext clientSecret
           renders here (the broker hashes it at load); an
           existingSecretRef is named by clientSecretEnv and mounted by
           the deployment under that name. */}}
    {{- if .Values.webClients }}
    webClients:
{{- range $i, $wc := .Values.webClients }}
      - clientID: {{ required "webClients[].clientID is required" .clientID | quote }}
        {{- with .clientSecretHash }}
        clientSecretHash: {{ . | quote }}
        {{- end }}
        {{- with .clientSecret }}
        clientSecret: {{ . | quote }}
        {{- end }}
        {{- if (default dict .existingSecretRef).name }}
        clientSecretEnv: {{ include "demarkus-knowledge-broker.webClientSecretEnv" $i | quote }}
        {{- end }}
        redirectURIs: {{ required "webClients[].redirectURIs is required" .redirectURIs | toJson }}
        name: {{ default "" .name | quote }}
{{- end }}
    {{- else }}
    webClients: []
    {{- end }}
    sweeper:
      disabled: {{ .Values.sweeper.disabled }}
      interval: {{ .Values.sweeper.interval | quote }}
      leaseName: {{ .Values.sweeper.leaseName | quote }}
    rateLimit:
      disabled: {{ .Values.rateLimit.disabled }}
      tokens:
        perMinute: {{ .Values.rateLimit.tokens.perMinute }}
        burst: {{ .Values.rateLimit.tokens.burst }}
      login:
        perMinute: {{ .Values.rateLimit.login.perMinute }}
        burst: {{ .Values.rateLimit.login.burst }}
      trustForwardedFor: {{ .Values.rateLimit.trustForwardedFor }}
    {{- $worldDialer := .Values.worldDialer | default (dict) }}
    worldDialer:
      insecureSkipVerify: {{ default false $worldDialer.insecureSkipVerify }}
