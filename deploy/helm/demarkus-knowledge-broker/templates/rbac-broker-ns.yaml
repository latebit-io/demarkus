{{- if .Values.rbac.create }}
{{- /* Broker-namespace RBAC: the broker SA's access to its own state.

   K8s RBAC has a hard limitation that shapes the structure below:
   `resourceNames` does not apply to `create` requests (the name of
   the new object isn't known at authorization time, so the rule
   simply does not match). A single rule that lists `create`
   alongside `get`/`update` AND uses `resourceNames` will silently
   deny create. Each create-capable surface therefore needs a
   separate, name-unrestricted rule. The cost is that create is
   namespace-wide for that resource type — acceptable here because
   the namespace is broker-owned, and the rest of the SA's surface
   (get/update) is still tightly scoped by resourceNames.

   - coordination.k8s.io/leases: the sweeper's leader-election Lease.
     get/update pinned to the configured lease name; create gets
     its own rule (namespace-wide).

   - secrets (refresh-tokens, dynamic-clients, cookie-key): runtime
     state the broker creates on first write (never templated, so a
     GitOps render cannot reset it); get/update pinned by name,
     create through the namespace-wide rule.

   - secrets (per-world write-token): the broker provisions these
     lazily on the first write to each configured world. get/update
     pinned per-world; create gets its own rule (namespace-wide).
     Names are pinned per world via resourceNames so a compromised
     broker SA cannot read or update any other Secret in the broker
     namespace.

   - secrets (signing-key): generated by the broker on first start when
     no key is configured; get/update pinned, create through the same
     namespace-wide rule. */ -}}
{{- $brokerNs := include "demarkus-knowledge-broker.brokerNamespace" . -}}
{{- $name := include "demarkus-knowledge-broker.fullname" . -}}
{{- $worlds := include "demarkus-knowledge-broker.worlds" . | fromYamlArray -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $brokerNs }}
  labels:
    {{- include "demarkus-knowledge-broker.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ .Values.sweeper.leaseName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "demarkus-knowledge-broker.refreshTokensSecretName" . | quote }}
      - {{ include "demarkus-knowledge-broker.dynamicClientsSecretName" . | quote }}
      - {{ include "demarkus-knowledge-broker.cookieKeySecretName" . | quote }}
      - {{ include "demarkus-knowledge-broker.signingKeySecretName" . | quote }}
    verbs: ["get", "update"]
  {{- if $worlds }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $worlds }}
      - {{ include "demarkus-knowledge-broker.writeTokenSecretName" (dict "worldName" .name) | quote }}
      {{- end }}
    verbs: ["get", "update"]
  {{- end }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $brokerNs }}
  labels:
    {{- include "demarkus-knowledge-broker.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "demarkus-knowledge-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
