suite: one world list drives every sub-chart
values:
  - fixtures/values.yaml
templates:
  - charts/knowledge/templates/configmap.yaml
  - charts/knowledge/templates/secret-broker-config.yaml
  - charts/agent/templates/configmap.yaml
  - charts/agent/templates/deployment.yaml
  # Rendered only because deployment.yaml includes it for a checksum.
  - charts/agent/templates/secret.yaml
  - charts/knowledge/templates/token-bootstrap.yaml
  - templates/validate.yaml
tests:
  - it: knowledge server derives authorities, buckets and token Secrets
    template: charts/knowledge/templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: knowledge-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "root"\n\s+authorities:\n\s+- "root.knowledge.namespace.svc.cluster.local"\n\s+bucket:\n\s+url: "gs://deployment-root"\n\s+worldID: "52b471f7-8d38-4c89-b44a-6f4f8b1a4f48"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'tokensFile: "/run/demarkus/worlds/team-a/tokens.toml"'

  - it: broker serves every global world locally by its derived authority with its allow list
    template: charts/knowledge/templates/secret-broker-config.yaml
    asserts:
      - equal:
          path: metadata.name
          value: knowledge-broker-config
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- name: "team-a"\n\s*profile: "knowledge"\n\s*local: true\n\s*namespace: "NAMESPACE"\n\s*tokensSecret: "team-a-tokens"\n\s*publicURL: ""\n\s*internalAddress: "team-a.knowledge.namespace.svc.cluster.local:6309"\n\s*allow:\n\s*domains: \[\]\n\s*groups: \["team-a"\]'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'signingKeySecret: "knowledge-signing-key"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'webClients:\n\s*- clientID: "library-web"\n\s*clientSecretEnv: "WEB_CLIENT_SECRET_0"\n\s*redirectURIs:'

  - it: agent crawls the non-hub worlds and publishes into the hub through the shared Service
    template: charts/agent/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \[\n\s+"mark://team-a",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'hubs = \[\n\s+"mark://root",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."root"\]\ndial_address = "knowledge.NAMESPACE.svc.cluster.local:6309"\nserver_name = "root.knowledge.NAMESPACE.svc.cluster.local"'

  - it: agent projects the hub token the broker issues
    template: charts/agent/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: agent
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[1].secret.name
          value: root-token-values
      - contains:
          path: spec.template.spec.containers[0].args
          content: --insecure

  - it: keeps the sub-chart name label the NetworkPolicy selectors expect
    template: charts/agent/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: demarkus-agent

  - it: broker issues the agent's hub token into the Secret the agent projects
    template: charts/knowledge/templates/secret-broker-config.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'agentTokens:\n\s*- world: "root"\n\s*secret: "root-token-values"\n\s*key: "admin"'

  - it: knowledge server runs no token bootstrap Job
    template: charts/knowledge/templates/token-bootstrap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a per-world namespace; worlds share the knowledge server's
    template: templates/validate.yaml
    set:
      global.worlds:
        - name: root
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          hub: true
          namespace: elsewhere
    asserts:
      - failedTemplate:
          errorPattern: 'global.worlds\[root\].namespace is not supported'
