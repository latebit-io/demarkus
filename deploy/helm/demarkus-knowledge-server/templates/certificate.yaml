{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
  {{- with .Values.tls.certManager.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
  issuerRef:
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    name: {{ .Values.tls.certManager.issuerRef.name }}
  dnsNames:
    {{- range .Values.worlds }}
    {{- range .authorities }}
    - {{ lower . | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.dynamicWorlds.enabled }}
    {{- /* Dynamic tenant authorities are <slug>.<service-dns>; one
         wildcard covers every provisioned world without reissuing. */}}
    - {{ printf "%s.%s.svc.cluster.local" (include "demarkus-knowledge-server.fullname" .) .Release.Namespace | quote }}
    - {{ printf "*.%s.%s.svc.cluster.local" (include "demarkus-knowledge-server.fullname" .) .Release.Namespace | quote }}
    {{- end }}
{{- end }}
