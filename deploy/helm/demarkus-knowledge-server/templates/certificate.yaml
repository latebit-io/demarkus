{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
  {{- with .Values.tls.certManager.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
  issuerRef:
    {{- if .Values.tls.certManager.selfSigned.create }}
    kind: Issuer
    name: {{ include "demarkus-knowledge-server.selfSignedIssuerName" . }}
  {{- /* A self-signed cert's issuer DN is its subject; empty violates RFC 5280. */}}
  subject:
    organizations:
      - demarkus
    {{- else }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    name: {{ .Values.tls.certManager.issuerRef.name }}
    {{- end }}
  dnsNames:
    {{- range include "demarkus-knowledge-server.worlds" . | fromYamlArray }}
    {{- range .authorities }}
    - {{ lower . | quote }}
    {{- end }}
    {{- end }}
    {{- if include "demarkus-knowledge-server.provisioningEnabled" . }}
    {{- /* Tenant authorities are <slug>.<authorityDomain>; one wildcard
           covers every provisioned world without reissuing. */}}
    {{- $domain := include "demarkus-knowledge-server.authorityDomain" . }}
    - {{ $domain | quote }}
    - {{ printf "*.%s" $domain | quote }}
    {{- end }}
{{- end }}
