{{- include "demarkus-knowledge-server.validate" . -}}
{{- /* The broker's config.yaml, a Secret because it can carry the OIDC client
       secret and a cookie key. The render is deterministic: the broker
       generates and persists its own keys unless configured. */ -}}
{{- $cookieKey := include "demarkus-knowledge-server.resolveCookieKey" . -}}
{{- $worlds := include "demarkus-knowledge-server.worlds" . | fromYamlArray -}}
{{- $agentTokens := include "demarkus-knowledge-server.agentTokens" . | fromYamlArray -}}
{{- $authorityDomain := include "demarkus-knowledge-server.authorityDomain" . -}}
{{- $broker := .Values.broker -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demarkus-knowledge-server.brokerConfigSecretName" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Kept so the next `helm upgrade` finds a legacy key through lookup. */}}
  {{- with $cookieKey }}
  cookie-key: {{ . | quote }}
  {{- end }}
  config.yaml: |
    server:
      addr: {{ printf ":%d" (int .Values.server.httpPort) | quote }}
      bearerAddr: {{ printf ":%d" (int .Values.server.bearerPort) | quote }}
      {{- with $cookieKey }}
      cookieKey: {{ . | quote }}
      {{- end }}
      cookieKeySecret: {{ include "demarkus-knowledge-server.cookieKeySecretName" . | quote }}
      stateTTL: {{ $broker.stateTTL | quote }}
      brokerNamespace: {{ .Release.Namespace | quote }}
      signingKeySecret: {{ include "demarkus-knowledge-server.signingKeySecretName" . | quote }}
      dynamicClientsSecret: {{ include "demarkus-knowledge-server.dynamicClientsSecretName" . | quote }}
      oauthStateSecret: {{ include "demarkus-knowledge-server.oauthStateSecretName" . | quote }}
      stateBucket: {{ $broker.stateBucket | quote }}
      refreshTokenTTL: {{ $broker.refreshTokenTTL | quote }}
      maxSessionsPerUser: {{ int $broker.maxSessionsPerUser }}
      idTokenTTL: {{ $broker.idTokenTTL | quote }}
      publicURL: {{ $broker.publicURL | quote }}
      insecureCookies: {{ $broker.insecureCookies }}
      mcp:
        {{- with $broker.mcp.publicURL }}
        publicURL: {{ . | quote }}
        {{- end }}
        toolProfile: {{ $broker.mcp.toolProfile | quote }}
      {{- with $broker.memory.publicURL }}
      memory:
        publicURL: {{ . | quote }}
        toolProfile: {{ $broker.memory.toolProfile | quote }}
      {{- end }}
    oidc:
      issuer: {{ $broker.oidc.issuer | quote }}
      clientID: {{ $broker.oidc.clientID | quote }}
      {{- /* With existingSecretRef the pod carries OIDC_CLIENT_SECRET and the
             loader applies it before validation. */}}
      clientSecret: {{ default "" $broker.oidc.clientSecret | quote }}
      redirectURL: {{ $broker.oidc.redirectURL | quote }}
      brokerSigningKey: |
{{ default "" $broker.oidc.brokerSigningKey | indent 8 }}
      allowDomains: {{ toJson (default (list) $broker.oidc.allowDomains) }}
    worlds:
{{- range $worlds }}
      {{- /* The worlds this process serves: the first authority is the SNI the
             gateway routes by, and local makes a world the server does not
             route a startup error. */}}
      - name: {{ .name | quote }}
        profile: {{ .profile | quote }}
        local: true
        namespace: {{ $.Release.Namespace | quote }}
        tokensSecret: {{ .tokenSecret.name | quote }}
        publicURL: {{ default "" .publicURL | quote }}
        internalAddress: {{ printf "%s:%d" (lower (index .authorities 0)) (int $.Values.server.udpPort) | quote }}
        {{- include "demarkus-knowledge-server.allowLists" .allow | nindent 8 }}
        writeScope:
          paths: {{ .writeScope.paths | toJson }}
{{- end }}
{{- range $broker.remoteWorlds }}
      {{- $writeScope := default (dict) .writeScope }}
      - name: {{ .name | quote }}
        profile: {{ default "knowledge" .profile | quote }}
        namespace: {{ default $.Release.Namespace .namespace | quote }}
        tokensSecret: {{ default (printf "%s-tokens" .name) .tokensSecret | quote }}
        publicURL: {{ default "" .publicURL | quote }}
        internalAddress: {{ .internalAddress | quote }}
        dialAddress: {{ default "" .dialAddress | quote }}
        {{- include "demarkus-knowledge-server.allowLists" .allow | nindent 8 }}
        writeScope:
          paths: {{ default (list "/**") (get $writeScope "paths") | toJson }}
{{- end }}
    {{- if $agentTokens }}
    agentTokens:
{{- range $agentTokens }}
      - world: {{ required "broker.agentTokens[].world is required" .world | quote }}
        secret: {{ required "broker.agentTokens[].secret is required" .secret | quote }}
        key: {{ required "broker.agentTokens[].key is required" .key | quote }}
        {{- with .paths }}
        paths: {{ toJson . }}
        {{- end }}
{{- end }}
    {{- end }}
    {{- /* A cleartext clientSecret is hashed by the broker at load; an
           existingSecretRef is named by clientSecretEnv and mounted by the
           deployment under that name. */}}
    {{- if $broker.webClients }}
    webClients:
{{- range $i, $wc := $broker.webClients }}
      - clientID: {{ required "broker.webClients[].clientID is required" .clientID | quote }}
        {{- with .clientSecretHash }}
        clientSecretHash: {{ . | quote }}
        {{- end }}
        {{- with .clientSecret }}
        clientSecret: {{ . | quote }}
        {{- end }}
        {{- if (default dict .existingSecretRef).name }}
        clientSecretEnv: {{ include "demarkus-knowledge-server.webClientSecretEnv" $i | quote }}
        {{- end }}
        redirectURIs: {{ required "broker.webClients[].redirectURIs is required" .redirectURIs | toJson }}
        name: {{ default "" .name | quote }}
{{- end }}
    {{- else }}
    webClients: []
    {{- end }}
    {{- if include "demarkus-knowledge-server.provisioningEnabled" . }}
    {{- $prov := .Values.provisioning }}
    provisioning:
      mode: {{ $prov.mode | quote }}
      {{- include "demarkus-knowledge-server.allowLists" $prov.allow | nindent 6 }}
      maxTenants: {{ int $prov.maxTenants }}
      maxDocumentsPerTenant: {{ int $prov.maxDocumentsPerTenant }}
      authorityDomain: {{ $authorityDomain | quote }}
      bucketPrefix: {{ trimPrefix "gs://" (include "demarkus-knowledge-server.bucketPrefix" .) | quote }}
      bucketProject: {{ $prov.bucketProject | quote }}
      bucketLocation: {{ default "" $prov.bucketLocation | quote }}
      worldsSecret: {{ $prov.worldsSecret | quote }}
      registrySecret: {{ include "demarkus-knowledge-server.registrySecretName" . | quote }}
    {{- end }}
    sweeper:
      disabled: {{ $broker.sweeper.disabled }}
      interval: {{ $broker.sweeper.interval | quote }}
      leaseName: {{ $broker.sweeper.leaseName | quote }}
    rateLimit:
      disabled: {{ $broker.rateLimit.disabled }}
      tokens:
        perMinute: {{ $broker.rateLimit.tokens.perMinute }}
        burst: {{ $broker.rateLimit.tokens.burst }}
      login:
        perMinute: {{ $broker.rateLimit.login.perMinute }}
        burst: {{ $broker.rateLimit.login.burst }}
      trustForwardedFor: {{ $broker.rateLimit.trustForwardedFor }}
    worldDialer:
      insecureSkipVerify: {{ $broker.worldDialer.insecureSkipVerify }}
