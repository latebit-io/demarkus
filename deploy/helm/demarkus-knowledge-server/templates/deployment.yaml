{{- $worlds := include "demarkus-knowledge-server.worlds" . | fromYamlArray -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demarkus-knowledge-server.fullname" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/broker-config: {{ include (print $.Template.BasePath "/secret-broker-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "demarkus-knowledge-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: knowledge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -server-config
            - /etc/demarkus/config.yaml
            - -broker-config
            - /etc/demarkus/broker/config.yaml
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # The leader-election holder identity for the sweeper Lease.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- /* Operator-managed Secrets the loader reads from the env. */}}
            {{- range $env := list
                  (dict "name" "OIDC_CLIENT_SECRET" "ref" .Values.broker.oidc.existingSecretRef)
                  (dict "name" "BROKER_SIGNING_KEY" "ref" .Values.broker.oidc.existingSigningKeyRef)
                  (dict "name" "BROKER_COOKIE_KEY" "ref" .Values.broker.existingCookieKeyRef) }}
            {{- with $env.ref.name }}
            - name: {{ $env.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $env.ref.key | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $wc := .Values.broker.webClients }}
            {{- $ref := default dict $wc.existingSecretRef }}
            {{- if $ref.name }}
            - name: {{ include "demarkus-knowledge-server.webClientSecretEnv" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name | quote }}
                  key: {{ default "clientSecret" $ref.key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: mark
              protocol: UDP
              containerPort: {{ .Values.server.udpPort }}
            - name: http
              protocol: TCP
              containerPort: {{ .Values.server.httpPort }}
            - name: health
              protocol: TCP
              containerPort: {{ .Values.server.healthPort }}
            - name: peer
              protocol: UDP
              containerPort: {{ .Values.server.peerPort }}
          {{- /* The broker's /readyz answers only once OIDC discovery and every
                 world are up, and drops first on shutdown so the load balancer
                 stops sending sessions; the server's /livez is the liveness. */}}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: config
              mountPath: /etc/demarkus
              readOnly: true
            - name: broker-config
              mountPath: /etc/demarkus/broker
              readOnly: true
            - name: tls
              mountPath: /run/demarkus/tls
              readOnly: true
            {{- range $index, $world := $worlds }}
            - name: {{ printf "world-token-%d" $index }}
              mountPath: {{ printf "/run/demarkus/worlds/%s" $world.name | quote }}
              readOnly: true
            {{- end }}
            {{- if include "demarkus-knowledge-server.provisioningEnabled" . }}
            - name: tenant-worlds
              mountPath: /run/demarkus/tenant-worlds
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "demarkus-knowledge-server.configName" . }}
            items:
              - key: config.yaml
                path: config.yaml
              {{- range $world := $worlds }}
              {{- $key := include "demarkus-knowledge-server.policyKey" $world.name }}
              {{- if $world.initialPolicy }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
              {{- end }}
        - name: broker-config
          secret:
            secretName: {{ include "demarkus-knowledge-server.brokerConfigSecretName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        - name: tls
          secret:
            secretName: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- range $index, $world := $worlds }}
        {{- /* Both optional: the broker creates the runtime Secret on its
               first agent token mint, the static one is the operator's; the
               world opens without either and reloads as they are projected. */}}
        - name: {{ printf "world-token-%d" $index }}
          projected:
            sources:
              - secret:
                  name: {{ $world.tokenSecret.name | quote }}
                  optional: true
                  items:
                    - key: {{ $world.tokenSecret.key | quote }}
                      path: tokens.toml
              - secret:
                  name: {{ $world.staticTokenSecret.name | quote }}
                  optional: true
                  items:
                    - key: {{ $world.staticTokenSecret.key | quote }}
                      path: static-tokens.toml
        {{- end }}
        {{- if include "demarkus-knowledge-server.provisioningEnabled" . }}
        {{- /* Optional: the broker creates it on the first provision, which
               may happen after install; a provisioned tenant is served in
               process before the projection lands. */}}
        - name: tenant-worlds
          secret:
            secretName: {{ .Values.provisioning.worldsSecret | quote }}
            optional: true
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "demarkus-knowledge-server.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
