{{- $worlds := include "demarkus-knowledge-server.worlds" . | fromYamlArray -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demarkus-knowledge-server.fullname" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "demarkus-knowledge-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: knowledge-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/demarkus/config.yaml"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: mark
              protocol: UDP
              containerPort: {{ .Values.server.udpPort }}
            - name: health
              protocol: TCP
              containerPort: {{ .Values.server.healthPort }}
            - name: peer
              protocol: UDP
              containerPort: {{ .Values.server.peerPort }}
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: config
              mountPath: /etc/demarkus
              readOnly: true
            - name: tls
              mountPath: /run/demarkus/tls
              readOnly: true
            {{- range $index, $world := $worlds }}
            - name: {{ printf "world-token-%d" $index }}
              mountPath: {{ printf "/run/demarkus/worlds/%s" $world.name | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.dynamicWorlds.enabled }}
            - name: dynamic-worlds
              mountPath: /run/demarkus/dynamic-worlds
              readOnly: true
            - name: dynamic-worlds-tokens
              mountPath: /run/demarkus/worlds-tokens
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "demarkus-knowledge-server.configName" . }}
            items:
              - key: config.yaml
                path: config.yaml
              {{- range $world := $worlds }}
              {{- $key := include "demarkus-knowledge-server.policyKey" $world.name }}
              {{- if $world.initialPolicy }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
              {{- end }}
        - name: tls
          secret:
            secretName: {{ include "demarkus-knowledge-server.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- range $index, $world := $worlds }}
        {{- /* Both optional: the broker creates the runtime Secret on its
               first mint, the static one is the operator's; the server opens
               the world without either and reloads as they are projected. */}}
        - name: {{ printf "world-token-%d" $index }}
          projected:
            sources:
              - secret:
                  name: {{ $world.tokenSecret.name | quote }}
                  optional: true
                  items:
                    - key: {{ $world.tokenSecret.key | quote }}
                      path: tokens.toml
              - secret:
                  name: {{ $world.staticTokenSecret.name | quote }}
                  optional: true
                  items:
                    - key: {{ $world.staticTokenSecret.key | quote }}
                      path: static-tokens.toml
        {{- end }}
        {{- if .Values.dynamicWorlds.enabled }}
        {{- /* optional: the broker creates both Secrets on the first
               provision, which may happen after install. */}}
        - name: dynamic-worlds
          secret:
            secretName: {{ .Values.dynamicWorlds.worldsSecret | quote }}
            optional: true
        - name: dynamic-worlds-tokens
          secret:
            secretName: {{ .Values.dynamicWorlds.tokensSecret | quote }}
            optional: true
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "demarkus-knowledge-server.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
