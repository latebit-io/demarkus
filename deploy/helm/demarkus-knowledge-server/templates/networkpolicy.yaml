{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demarkus-knowledge-server.fullname" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The HTTP listener is reached through the Ingress controller alone.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressFromNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.httpPort }}
    # Direct QUIC clients: the agent and any configured CIDRs. The MCP
    # gateways reach the worlds in process.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.agent.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.agent.podLabels | nindent 14 }}
        {{- range .Values.networkPolicy.externalCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: UDP
          port: {{ .Values.server.udpPort }}
    # Commit hints between this chart's own replicas.
    - from:
        - podSelector:
            matchLabels:
              {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ .Values.server.peerPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Standard NetworkPolicy cannot target GCS FQDNs or rotating addresses,
    # and the OIDC issuer and API server sit behind 443 too. This permits any
    # TCP/443 destination; use an egress proxy or CNI FQDN policy when
    # destination-level restriction is required.
    {{- if .Values.networkPolicy.allowUnrestrictedHTTPS }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    # GKE Dataplane V2 uses this metadata-server endpoint.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
        - protocol: TCP
          port: 987
    # Commit hints to this chart's own replicas.
    - to:
        - podSelector:
            matchLabels:
              {{- include "demarkus-knowledge-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ .Values.server.peerPort }}
    {{- /* Worlds served elsewhere: UDP to their ports, which may span
           namespaces and clusters. */}}
    {{- if .Values.broker.remoteWorlds }}
    {{- $ports := dict }}
    {{- range .Values.broker.remoteWorlds }}
    {{- $suffix := regexFind ":[0-9]+$" (default .internalAddress .dialAddress) }}
    {{- $_ := set $ports (default (toString $.Values.server.udpPort) (trimPrefix ":" $suffix)) true }}
    {{- end }}
    - ports:
        {{- range $port := keys $ports | sortAlpha }}
        - protocol: UDP
          port: {{ $port }}
        {{- end }}
    {{- end }}
{{- end }}
