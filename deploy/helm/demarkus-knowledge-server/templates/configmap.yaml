{{- include "demarkus-knowledge-server.validate" . -}}
{{- $worlds := include "demarkus-knowledge-server.worlds" . | fromYamlArray -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demarkus-knowledge-server.configName" . }}
  labels:
    {{- include "demarkus-knowledge-server.labels" . | nindent 4 }}
data:
  config.yaml: |
    version: 1
    listen:
      address: {{ printf ":%d" (int .Values.server.udpPort) | quote }}
      maxIncomingStreams: {{ .Values.server.maxIncomingStreams }}
      idleTimeout: {{ .Values.server.idleTimeout | quote }}
    health:
      address: {{ printf ":%d" (int .Values.server.healthPort) | quote }}
    peers:
      listen: {{ printf ":%d" (int .Values.server.peerPort) | quote }}
      service: {{ printf "%s-peers.%s.svc" (include "demarkus-knowledge-server.fullname" .) .Release.Namespace | quote }}
    tls:
      certFile: /run/demarkus/tls/tls.crt
      keyFile: /run/demarkus/tls/tls.key
    {{- if include "demarkus-knowledge-server.provisioningEnabled" . }}
    worldsFile: /run/demarkus/tenant-worlds/worlds.yaml
    {{- end }}
    {{- with include "demarkus-knowledge-server.floorWorld" . }}
    floorWorld: {{ . | quote }}
    {{- end }}
    contentCheck:
      pii: {{ .Values.server.contentCheck.pii | quote }}
      workDomains:
        {{- range .Values.server.contentCheck.workDomains }}
        - {{ lower . | quote }}
        {{- else }}
        []
        {{- end }}
      nearDuplicate: {{ .Values.server.contentCheck.nearDuplicate | default "block" | quote }}
      injection: {{ .Values.server.contentCheck.injection | default "warn" | quote }}
      {{- with .Values.server.contentCheck.classifier }}
      {{- if .kind }}
      classifier:
        kind: {{ .kind | quote }}
        {{- with .url }}
        url: {{ . | quote }}
        {{- end }}
        {{- with .model }}
        model: {{ . | quote }}
        {{- end }}
        {{- with .timeout }}
        timeout: {{ . | quote }}
        {{- end }}
        {{- with .threshold }}
        threshold: {{ . }}
        {{- end }}
        {{- with .maxBytes }}
        maxBytes: {{ . }}
        {{- end }}
        {{- with .maxInFlight }}
        maxInFlight: {{ . }}
        {{- end }}
      {{- end }}
      {{- end }}
    worlds:
      {{- range $world := $worlds }}
      - name: {{ $world.name | quote }}
        authorities:
          {{- range $world.authorities }}
          - {{ lower . | quote }}
          {{- end }}
        bucket:
          url: {{ $world.bucket.url | quote }}
          worldID: {{ $world.bucket.worldID | quote }}
          {{- with $world.bucket.checkpointGrace }}
          checkpointGrace: {{ . | quote }}
          {{- end }}
        auth:
          tokensFile: {{ printf "/run/demarkus/worlds/%s/tokens.toml" $world.name | quote }}
          staticTokensFile: {{ printf "/run/demarkus/worlds/%s/static-tokens.toml" $world.name | quote }}
        policy:
          path: /.well-known/demarkus/policy.md
          {{- if $world.initialPolicy }}
          file: {{ printf "/etc/demarkus/%s" (include "demarkus-knowledge-server.policyKey" $world.name) | quote }}
          {{- end }}
          {{- /* Restricted only once governors exist to write through the broker. */}}
          {{- $restrict := and (ne $world.profile "memory") (not (empty $.Values.broker.governors)) }}
          governance: {{ $world.governance | default (ternary "restricted" "open" $restrict) | quote }}
        readOnly: {{ $world.readOnly }}
        gated: {{ eq $world.profile "memory" }}
        {{- /* The server seeds a memory's policy; an initialPolicy is the operator's own. */}}
        {{- if and (eq $world.profile "memory") (not $world.initialPolicy) (not $world.readOnly) }}
        seed: memory
        {{- end }}
        limits:
          maxConcurrentRequests: {{ $world.limits.maxConcurrentRequests }}
          requestTimeout: {{ $world.limits.requestTimeout | quote }}
          requestsPerSecond: {{ $world.limits.requestsPerSecond }}
          burst: {{ $world.limits.burst }}
      {{- end }}
{{- range $world := $worlds }}
{{- if $world.initialPolicy }}
  {{ include "demarkus-knowledge-server.policyKey" $world.name }}: |
    {{- $world.initialPolicy | nindent 4 }}
{{- end }}
{{- end }}
