{{- /* Broker-written state seeded empty on first install: the refresh
       token map and the RFC 7591 registrations. resource-policy keep and
       the lookup skip mean an upgrade or uninstall never touches them. */ -}}
{{- range $name := list (include "demarkus-knowledge-server.refreshTokensSecretName" .) (include "demarkus-knowledge-server.dynamicClientsSecretName" .) }}
{{- if not (lookup "v1" "Secret" $.Release.Namespace $name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "demarkus-knowledge-server.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data: {}
{{- end }}
{{- end }}
