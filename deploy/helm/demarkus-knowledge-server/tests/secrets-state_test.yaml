suite: broker state secrets
templates:
  - secrets-broker-state.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: seeds an empty refresh tokens Secret the chart never reclaims
    documentIndex: 0
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-refresh-tokens
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: data
          value: {}

  - it: seeds an empty dynamic clients Secret the chart never reclaims
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-dynamic-clients
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: takes configured names
    set:
      broker.refreshTokensSecret: my-refresh
      broker.dynamicClientsSecret: my-clients
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.name
          value: my-refresh
      - documentIndex: 1
        equal:
          path: metadata.name
          value: my-clients
