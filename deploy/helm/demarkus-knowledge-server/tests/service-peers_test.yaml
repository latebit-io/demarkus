suite: peers service
templates:
  - service-peers.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: is headless, includes unready replicas and exposes only the peer port
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-peers
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0]
          value:
            name: peer
            protocol: UDP
            port: 6310
            targetPort: peer
