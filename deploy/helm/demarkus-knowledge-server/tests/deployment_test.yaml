suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - secret-broker-config.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: deploys two replicas with zero-downtime rolling updates
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: uses the composed image with both config files
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/latebit-io/demarkus-knowledge:0.25.0
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-server-config", "/etc/demarkus/config.yaml", "-broker-config", "/etc/demarkus/broker/config.yaml"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[0-9a-f]{64}$'
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/broker-config"]
          pattern: '^[0-9a-f]{64}$'
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: broker-config
            secret:
              secretName: RELEASE-NAME-broker-config
              items:
                - key: config.yaml
                  path: config.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: broker-config
            mountPath: /etc/demarkus/broker
            readOnly: true

  - it: identifies the pod for the sweeper Lease and mounts operator Secrets into the env
    template: deployment.yaml
    set:
      broker.oidc.clientSecret: ""
      broker.oidc.existingSecretRef.name: broker-oidc
      broker.oidc.existingSigningKeyRef.name: broker-key
      broker.existingCookieKeyRef.name: broker-cookie
      broker.webClients:
        - clientID: library-web
          existingSecretRef: {name: library-oauth}
          redirectURIs: [https://library.example.com/auth/callback]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: POD_NAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            valueFrom: {secretKeyRef: {name: broker-oidc, key: clientSecret}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROKER_SIGNING_KEY
            valueFrom: {secretKeyRef: {name: broker-key, key: signing-key.pem}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROKER_COOKIE_KEY
            valueFrom: {secretKeyRef: {name: broker-cookie, key: cookie-key}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEB_CLIENT_SECRET_0
            valueFrom: {secretKeyRef: {name: library-oauth, key: clientSecret}}

  - it: appends extra environment after the chart's own
    template: deployment.yaml
    set:
      extraEnv:
        - name: STORAGE_EMULATOR_HOST
          value: fake-gcs:4443
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1]
          value:
            name: STORAGE_EMULATOR_HOST
            value: fake-gcs:4443

  - it: mounts the tenant worlds fragment optionally when provisioning is on
    template: deployment.yaml
    set:
      worlds: []
      worldDefaults.bucketPrefix: gs://deployment-
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: allowlisted
      provisioning.bucketProject: project
    asserts:
      - equal:
          path: spec.template.spec.volumes[3]
          value:
            name: tenant-worlds
            secret:
              secretName: memory-worlds-config
              optional: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3].mountPath
          value: /run/demarkus/tenant-worlds

  - it: exposes QUIC, HTTP, health and peer ports at the pod and probes both halves
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: mark
            protocol: UDP
            containerPort: 6309
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            protocol: TCP
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            protocol: TCP
            containerPort: 8081
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: peer
            protocol: UDP
            containerPort: 6310
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health

  - it: mounts existing TLS data read-only
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: knowledge-tls
      - equal:
          path: spec.template.spec.volumes[2].secret.items
          value:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2]
          value:
            name: tls
            mountPath: /run/demarkus/tls
            readOnly: true

  - it: projects only the config document when no initial policy is set
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.items
          value:
            - key: config.yaml
              path: config.yaml

  - it: projects a configured initial policy beside the config document
    template: deployment.yaml
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
          initialPolicy: "strictness: warn\n"
        - name: team-b
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-b, worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49}
          tokenSecret: {name: team-b-tokens, key: tokens.toml}
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.items
          value:
            - key: config.yaml
              path: config.yaml
            - key: policy-team-a.md
              path: policy-team-a.md

  - it: projects one optional runtime and static token Secret pair per world
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[3]
          value:
            name: world-token-0
            projected:
              sources:
                - secret:
                    name: team-a-tokens
                    optional: true
                    items:
                      - key: tokens.toml
                        path: tokens.toml
                - secret:
                    name: team-a-static-tokens
                    optional: true
                    items:
                      - key: tokens.toml
                        path: static-tokens.toml
      - equal:
          path: spec.template.spec.volumes[4]
          value:
            name: world-token-1
            projected:
              sources:
                - secret:
                    name: team-b-tokens
                    optional: true
                    items:
                      - key: tokens.toml
                        path: tokens.toml
                - secret:
                    name: team-b-static-tokens
                    optional: true
                    items:
                      - key: tokens.toml
                        path: static-tokens.toml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3].mountPath
          value: /run/demarkus/worlds/team-a
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[4].mountPath
          value: /run/demarkus/worlds/team-b

  - it: applies pod and container security contexts
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: spreads replicas across nodes and zones
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: uses the Workload Identity service account and graceful termination
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - notExists:
          path: spec.template.spec.volumes[6]
      - notExists:
          path: spec.volumeClaimTemplates
