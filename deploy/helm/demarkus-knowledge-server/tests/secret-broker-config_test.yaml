suite: broker config
templates:
  - secret-broker-config.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: renders one listener, the broker state names and the IdP registration
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-broker-config
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'server:\n\s*addr: ":8080"\n\s*bearerAddr: ":8443"\n\s*cookieKeySecret: "RELEASE-NAME-cookie-key"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'brokerNamespace: "NAMESPACE"\n\s*signingKeySecret: "RELEASE-NAME-signing-key"\n\s*dynamicClientsSecret: "RELEASE-NAME-dynamic-clients"\n\s*oauthStateSecret: "RELEASE-NAME-oauth-state"\n\s*stateBucket: "gs://deployment-broker-state"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'refreshTokenTTL: "2160h"\n\s*maxSessionsPerUser: 20\n'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'publicURL: "https://broker.example.com"\n\s*insecureCookies: false\n\s*mcp:\n\s*toolProfile: "full"\n\s*oidc:\n\s*issuer: "https://accounts.example.com"\n\s*clientID: "broker-app"\n\s*clientSecret: "shh"\n\s*redirectURL: "https://broker.example.com/auth/callback"'
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'mcp:\n\s*addr|memory:|provisioning:|cookieKey:|federation:'
      - notExists:
          path: stringData["cookie-key"]

  - it: marks every served world local with its first authority as the SNI and the world's scope
    set:
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          authorities: [Team-A.example.com, team-a.knowledge.svc.cluster.local]
          bucket: {url: gs://deployment-team-a}
          allow: {groups: ["team-a"]}
          writeScope: {paths: ["/team-a/**"]}
          publicURL: "mark://team-a.example.com:6309"
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'worlds:\n\s*- name: "team-a"\n\s*profile: "knowledge"\n\s*local: true\n\s*namespace: "NAMESPACE"\n\s*tokensSecret: "team-a-tokens"\n\s*publicURL: "mark://team-a.example.com:6309"\n\s*internalAddress: "team-a.example.com:6309"\n\s*allow:\n\s*domains: \[\]\n\s*groups: \["team-a"\]\n\s*emails: \[\]\n\s*writeScope:\n\s*paths: \["/team-a/\*\*"\]'
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'dialAddress|defaultToken'

  - it: applies worldDefaults.allow and writeScope to every world
    set:
      worldDefaults.allow.domains: [example.com]
      worldDefaults.writeScope.paths: ["/shared/*"]
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- name: "team-a"[\s\S]*?domains: \["example.com"\][\s\S]*?paths: \["/shared/\*"\][\s\S]*- name: "team-b"[\s\S]*?domains: \["example.com"\][\s\S]*?paths: \["/shared/\*"\]'

  - it: renders a remote world for the pool without the local marker
    set:
      broker.remoteWorlds:
        - name: legacy
          internalAddress: legacy.other.example:6309
          dialAddress: legacy-lb.other.example:6309
          publicURL: "mark://legacy.other.example:6309"
          allow: {emails: [alice@example.com]}
      broker.worldDialer.insecureSkipVerify: true
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- name: "legacy"\n\s*profile: "knowledge"\n\s*namespace: "NAMESPACE"\n\s*tokensSecret: "legacy-tokens"\n\s*publicURL: "mark://legacy.other.example:6309"\n\s*internalAddress: "legacy.other.example:6309"\n\s*dialAddress: "legacy-lb.other.example:6309"\n\s*allow:\n\s*domains: \[\]\n\s*groups: \[\]\n\s*emails: \["alice@example.com"\]\n\s*writeScope:\n\s*paths: \["/\*\*"\]'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'worldDialer:\n\s*insecureSkipVerify: true'

  - it: derives an agent token entry per hub world
    set:
      worlds:
        - name: root
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          bucket: {url: gs://deployment-root}
          hub: true
        - name: team-a
          worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49
          bucket: {url: gs://deployment-team-a}
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'agentTokens:\n\s*- world: "root"\n\s*secret: "root-token-values"\n\s*key: "admin"\n\s*webClients: \[\]'

  - it: takes explicit agent tokens and an empty list as configured
    set:
      broker.agentTokens:
        - world: team-a
          secret: agent-token
          key: token
          paths: ["/agent/**"]
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'agentTokens:\n\s*- world: "team-a"\n\s*secret: "agent-token"\n\s*key: "token"\n\s*paths: \["/agent/\*\*"\]'

  - it: renders the memory gateway and provisioning from the chart's own domain and bucket prefix
    set:
      worlds: []
      worldDefaults.bucketPrefix: gs://deployment-
      worldDefaults.authorityDomain: knowledge.example.internal
      broker.memory.publicURL: https://memory.example.com
      broker.memory.toolProfile: lean
      provisioning.mode: open
      provisioning.maxTenants: 50
      provisioning.maxDocumentsPerTenant: 500
      provisioning.bucketProject: project
      provisioning.bucketLocation: EU
      provisioning.allow.domains: [example.com]
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'memory:\n\s*publicURL: "https://memory.example.com"\n\s*toolProfile: "lean"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'provisioning:\n\s*mode: "open"\n\s*allow:\n\s*domains: \["example.com"\]\n\s*groups: \[\]\n\s*emails: \[\]\n\s*maxTenants: 50\n\s*maxDocumentsPerTenant: 500\n\s*authorityDomain: "knowledge.example.internal"\n\s*bucketPrefix: "deployment-"\n\s*bucketProject: "project"\n\s*bucketLocation: "EU"\n\s*worldsSecret: "memory-worlds-config"\n\s*registrySecret: "demarkus-memory-broker-registry"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'worlds:\n\s*webClients'

  - it: renders a hand-provisioned memory world under the memory profile
    set:
      broker.memory.publicURL: https://memory.example.com
      worlds:
        - name: alice
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          profile: memory
          bucket: {url: gs://deployment-alice}
          allow: {emails: [alice@example.com]}
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: '- name: "alice"\n\s*profile: "memory"\n\s*local: true'

  - it: leaves the client secret blank and renders every web client secret mode
    set:
      broker.oidc.clientSecret: ""
      broker.oidc.existingSecretRef.name: broker-oidc
      broker.webClients:
        - clientID: hashed
          clientSecretHash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          redirectURIs: [https://one.example.com/cb]
        - clientID: library-web
          existingSecretRef: {name: library-oauth}
          redirectURIs: [https://library.example.com/auth/callback]
          name: Library
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'clientSecret: ""'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'webClients:\n\s*- clientID: "hashed"\n\s*clientSecretHash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"\n\s*redirectURIs: \["https://one.example.com/cb"\]\n\s*name: ""\n\s*- clientID: "library-web"\n\s*clientSecretEnv: "WEB_CLIENT_SECRET_1"\n\s*redirectURIs: \["https://library.example.com/auth/callback"\]\n\s*name: "Library"'

  - it: rejects a web client with no or two secret modes
    set:
      broker.webClients:
        - clientID: half
          redirectURIs: [https://one.example.com/cb]
    asserts:
      - failedTemplate:
          errorMessage: 'broker.webClients[0]: set exactly one of clientSecret, clientSecretHash, existingSecretRef.name'

  - it: keeps a configured cookie key in both places and a signing key PEM
    set:
      broker.cookieKey: dGVzdC1rZXk=
      broker.oidc.brokerSigningKey: "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----"
    asserts:
      - equal:
          path: stringData["cookie-key"]
          value: dGVzdC1rZXk=
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'cookieKey: "dGVzdC1rZXk="'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'brokerSigningKey: \|\n\s*-----BEGIN PRIVATE KEY-----\n\s*test\n\s*-----END PRIVATE KEY-----'

  - it: renders the sweeper, rate limit and hd allowlist knobs
    set:
      broker.sweeper.disabled: true
      broker.rateLimit.trustForwardedFor: false
      broker.oidc.allowDomains: [Example.com]
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'allowDomains: \["Example.com"\]'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'sweeper:\n\s*disabled: true\n\s*interval: "5m"\n\s*leaseName: "demarkus-broker-sweeper"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'trustForwardedFor: false'

  - it: renders federation when it has a hub, leaving a blank cadence to the broker
    set:
      broker.federation.hub: team-a
      broker.federation.quietPeriod: 5s
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'leaseName: "demarkus-broker-sweeper"\n\s*federation:\n\s*hub: "team-a"\n\s*leaseName: "demarkus-federation"\n\s*quietPeriod: "5s"\n\s*rateLimit:'
