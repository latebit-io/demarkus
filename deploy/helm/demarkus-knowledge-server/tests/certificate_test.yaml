suite: certificate
templates:
  - certificate.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: does not render when an existing TLS Secret is used
    asserts:
      - hasDocuments:
          count: 0

  - it: derives one multi-SAN certificate from all world authorities
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: internal-ca
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.secretName
          value: RELEASE-NAME-tls
      - equal:
          path: spec.issuerRef
          value:
            kind: ClusterIssuer
            name: internal-ca
      - equal:
          path: spec.dnsNames
          value:
            - team-a.example.com
            - team-a.knowledge.svc.cluster.local
            - team-b.example.com

  - it: propagates issuer kind and annotations
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      tls.certManager.issuerRef.kind: Issuer
      tls.certManager.issuerRef.name: internal-ca
      tls.certManager.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: covers provisioned tenant authorities with an authority domain wildcard
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      worlds: []
      worldDefaults.bucketPrefix: gs://deployment-
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: allowlisted
      provisioning.bucketProject: project
    asserts:
      - contains:
          path: spec.dnsNames
          content: "RELEASE-NAME.NAMESPACE.svc.cluster.local"
      - contains:
          path: spec.dnsNames
          content: "*.RELEASE-NAME.NAMESPACE.svc.cluster.local"

  - it: follows worldDefaults.authorityDomain for the tenant wildcard
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      worldDefaults.authorityDomain: knowledge.example.internal
      worlds: []
      worldDefaults.bucketPrefix: gs://deployment-
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: allowlisted
      provisioning.bucketProject: project
    asserts:
      - contains:
          path: spec.dnsNames
          content: "*.knowledge.example.internal"

  - it: points at the chart-rendered self-signed Issuer
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      tls.certManager.selfSigned.create: true
    asserts:
      - equal:
          path: spec.issuerRef
          value:
            kind: Issuer
            name: RELEASE-NAME-selfsigned
      - equal:
          path: spec.subject.organizations
          value: [demarkus]

  - it: sets no subject for an external issuer
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: internal-ca
    asserts:
      - notExists:
          path: spec.subject
