suite: network policy
templates:
  - networkpolicy.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: is omitted when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: isolates ingress and egress when enabled
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - lengthEqual:
          path: spec.ingress
          count: 3
      - equal:
          path: spec.ingress[0].ports[0]
          value:
            protocol: TCP
            port: 8080

  - it: admits the HTTP listener only from the Ingress controller namespace
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - notExists:
          path: spec.ingress[0].from[0].podSelector
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1

  - it: admits the bearer listener from any source
    asserts:
      - notExists:
          path: spec.ingress[2].from
      - equal:
          path: spec.ingress[2].ports
          value:
            - protocol: UDP
              port: 8443

  - it: admits peer hints only from this chart's own pods
    asserts:
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: demarkus-knowledge-server
      - notExists:
          path: spec.ingress[1].from[0].namespaceSelector
      - equal:
          path: spec.ingress[1].ports[0]
          value:
            protocol: UDP
            port: 6310
      - equal:
          path: spec.egress[-1].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: demarkus-knowledge-server
      - equal:
          path: spec.egress[-1].ports[0]
          value:
            protocol: UDP
            port: 6310

  - it: closes the QUIC port to direct clients unless CIDRs are configured
    asserts:
      - notContains:
          path: spec.ingress
          content:
            ports:
              - protocol: UDP
                port: 6309
          any: true

  - it: allows DNS over UDP and TCP only to kube-system
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: UDP
            port: 53
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: TCP
            port: 53

  - it: allows unrestricted HTTPS for GCS and both GKE metadata endpoints
    asserts:
      - notExists:
          path: spec.egress[1].to
      - equal:
          path: spec.egress[1].ports[0]
          value:
            protocol: TCP
            port: 443
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 169.254.169.254/32
      - equal:
          path: spec.egress[2].ports[0].port
          value: 80
      - equal:
          path: spec.egress[2].ports[1].port
          value: 8080
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 169.254.169.252/32
      - equal:
          path: spec.egress[3].ports[0].port
          value: 988
      - equal:
          path: spec.egress[3].ports[1].port
          value: 987

  - it: omits unrestricted HTTPS unless explicitly allowed
    set:
      networkPolicy.allowUnrestrictedHTTPS: false
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 4
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 169.254.169.254/32

  - it: admits configured direct-client CIDRs on the QUIC port
    set:
      networkPolicy.externalCIDRs: [203.0.113.0/24]
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 4
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - ipBlock:
                  cidr: 203.0.113.0/24
            ports:
              - protocol: UDP
                port: 6309

  - it: opens UDP egress to remote worlds by their ports
    set:
      broker.remoteWorlds:
        - name: legacy
          internalAddress: legacy.other.example:6309
        - name: far
          internalAddress: far.other.example:6309
          dialAddress: far-lb.other.example:6400
    asserts:
      - equal:
          path: spec.egress[-1].ports
          value:
            - protocol: UDP
              port: 6309
            - protocol: UDP
              port: 6400
      - notExists:
          path: spec.egress[-1].to

  - it: can be disabled for a CNI-managed policy
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
