suite: required values and uniqueness
templates:
  - configmap.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: rejects fewer than two replicas
    set:
      replicaCount: 1
    asserts:
      - failedTemplate:
          errorMessage: replicaCount must be at least 2 for production availability

  - it: rejects colliding public and health ports
    set:
      server.healthPort: 6309
    asserts:
      - failedTemplate:
          errorMessage: server.healthPort must differ from server.udpPort

  - it: rejects a port outside 1 to 65535
    set:
      service.bearerPort: 70000
    asserts:
      - failedTemplate:
          errorMessage: service.bearerPort must be between 1 and 65535

  - it: rejects a bearer port colliding with a UDP listener
    set:
      server.bearerPort: 6310
    asserts:
      - failedTemplate:
          errorMessage: server.bearerPort must differ from server.udpPort and server.peerPort

  - it: rejects a bearer Service port colliding with the QUIC port
    set:
      service.bearerPort: 6309
    asserts:
      - failedTemplate:
          errorMessage: service.bearerPort must differ from server.udpPort

  - it: requires the Ingress controller namespace when NetworkPolicy is enabled
    set:
      networkPolicy.ingressFromNamespace: ""
    asserts:
      - failedTemplate:
          errorMessage: networkPolicy.ingressFromNamespace is required when NetworkPolicy is enabled

  - it: rejects an HTTP port colliding with the health or QUIC port
    set:
      server.httpPort: 8081
    asserts:
      - failedTemplate:
          errorMessage: server.httpPort must differ from server.healthPort and server.udpPort

  - it: requires explicit acceptance of unrestricted HTTPS egress
    set:
      networkPolicy.allowUnrestrictedHTTPS: false
    asserts:
      - failedTemplate:
          errorMessage: networkPolicy.allowUnrestrictedHTTPS must be true when built-in NetworkPolicy is enabled; otherwise disable it and provide CNI or proxy egress controls

  - it: preserves direct-client source addresses for CIDR filtering
    set:
      service.type: LoadBalancer
      service.externalTrafficPolicy: Cluster
      networkPolicy.externalCIDRs: [203.0.113.0/24]
    asserts:
      - failedTemplate:
          errorMessage: service.externalTrafficPolicy must be Local when networkPolicy.externalCIDRs is set

  - it: requires exactly one TLS mode
    set:
      tls.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: tls.existingSecret or tls.certManager.enabled is required

  - it: rejects both TLS modes
    set:
      tls.certManager.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: tls.existingSecret and tls.certManager.enabled are mutually exclusive; set exactly one

  - it: requires a cert-manager issuer
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: tls.certManager.issuerRef.name is required when cert-manager is enabled (or set tls.certManager.selfSigned.create)

  - it: requires Workload Identity on a created service account
    set:
      serviceAccount.workloadIdentity.gsa: ""
    asserts:
      - failedTemplate:
          errorMessage: serviceAccount.workloadIdentity.gsa is required when serviceAccount.create is true

  - it: requires the name of an existing service account
    set:
      serviceAccount.create: false
      serviceAccount.name: ""
    asserts:
      - failedTemplate:
          errorMessage: serviceAccount.name is required when serviceAccount.create is false

  - it: provisioning renders worldsFile and permits zero static worlds
    set:
      worlds: []
      worldDefaults.bucketPrefix: gs://deployment-
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: allowlisted
      provisioning.bucketProject: project
    asserts:
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: 'worldsFile: /run/demarkus/tenant-worlds/worlds.yaml'

  - it: requires the memory gateway for provisioning
    set:
      provisioning.mode: allowlisted
    asserts:
      - failedTemplate:
          errorMessage: provisioning needs the memory gateway (broker.memory.publicURL)

  - it: requires a tenant cap in open mode
    set:
      worldDefaults.bucketPrefix: gs://deployment-
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: open
      provisioning.bucketProject: project
    asserts:
      - failedTemplate:
          errorMessage: provisioning.maxTenants must be positive in open mode

  - it: requires a bucket prefix and project for provisioning
    set:
      broker.memory.publicURL: https://memory.example.com
      provisioning.mode: allowlisted
      provisioning.bucketProject: project
    asserts:
      - failedTemplate:
          errorMessage: 'worldDefaults.bucketPrefix (or global.bucketPrefix) is required when provisioning is enabled: tenant buckets are gs://<prefix><slug>'

  - it: rejects an unknown provisioning mode
    set:
      provisioning.mode: sometimes
    asserts:
      - failedTemplate:
          errorMessage: 'provisioning.mode must be static, allowlisted or open (got "sometimes")'

  - it: requires a gs:// state bucket
    set:
      broker.stateBucket: deployment-broker-state
    asserts:
      - failedTemplate:
          errorMessage: 'broker.stateBucket "deployment-broker-state" must be an exact lowercase gs://bucket URL'

  - it: refuses a world's bucket as the state bucket
    set:
      broker.stateBucket: gs://deployment-team-a
    asserts:
      - failedTemplate:
          errorMessage: 'broker.stateBucket "gs://deployment-team-a" is world "team-a"''s bucket; the broker needs its own'

  - it: requires the broker's public URL and IdP registration
    set:
      broker.publicURL: ""
    asserts:
      - failedTemplate:
          errorMessage: broker.publicURL is required

  - it: requires exactly one OIDC client secret mode
    set:
      broker.oidc.existingSecretRef.name: broker-oidc
    asserts:
      - failedTemplate:
          errorMessage: broker.oidc.clientSecret and broker.oidc.existingSecretRef.name are mutually exclusive; set exactly one

  - it: keeps the memory gateway on its own host
    set:
      broker.memory.publicURL: https://broker.example.com/memory
    asserts:
      - failedTemplate:
          errorMessage: broker.memory.publicURL must be on a different host than the knowledge gateway; the mux selects the gateway by Host

  - it: requires a memory world to name its tenant
    set:
      broker.memory.publicURL: https://memory.example.com
      worlds:
        - name: alice
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          profile: memory
          bucket: {url: gs://deployment-alice}
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].allow must name the tenant identity (domains, groups or emails) on a memory world

  - it: rejects a memory world without the memory gateway
    set:
      worlds:
        - name: alice
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          profile: memory
          bucket: {url: gs://deployment-alice}
          allow: {emails: [alice@example.com]}
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].profile memory needs the memory gateway (broker.memory.publicURL)

  - it: requires a write scope on every world
    set:
      worldDefaults.writeScope.paths: []
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].writeScope.paths is required (or set worldDefaults.writeScope.paths)

  - it: requires at least one world
    set:
      worlds: []
    asserts:
      - failedTemplate:
          errorMessage: worlds (or global.worlds) must contain at least one world, or enable provisioning

  - it: rejects duplicate world names
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
        - name: team-a
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-b, worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49}
          tokenSecret: {name: team-b-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[1].name "team-a" is duplicated'

  - it: rejects duplicate normalized authorities
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com, TEAM-A.EXAMPLE.COM]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].authorities[1] "TEAM-A.EXAMPLE.COM" is duplicated after normalization'

  - it: rejects duplicate buckets
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
        - name: team-b
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49}
          tokenSecret: {name: team-b-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[1].bucket.url "gs://deployment-team-a" is duplicated'

  - it: rejects duplicate world IDs
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
        - name: team-b
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-b, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-b-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[1].worldID "52b471f7-8d38-4c89-b44a-6f4f8b1a4f48" is duplicated'

  - it: rejects duplicate token Secrets
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
        - name: team-b
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-b, worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[1].tokenSecret.name "team-a-tokens" is duplicated'

  - it: rejects a static token Secret named like a token Secret
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          staticTokenSecret: {name: team-a-tokens}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].staticTokenSecret.name "team-a-tokens" is duplicated'

  - it: rejects a generated raw Secret name that a static token Secret already uses
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          staticTokenSecret: {name: team-a-token-values}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0]: generated raw Secret name "team-a-token-values" collides with a tokenSecret.name or staticTokenSecret.name'

  - it: requires a bucket when no prefix derives one
    set:
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].bucket.url is required (or set worldDefaults.bucketPrefix / global.bucketPrefix)

  - it: requires a world ID
    set:
      worldDefaults.bucketPrefix: gs://deployment-
      worlds:
        - name: team-a
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].worldID is required

  - it: rejects an issuerRef next to the self-signed issuer
    set:
      tls.existingSecret: ""
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: internal-ca
      tls.certManager.selfSigned.create: true
    asserts:
      - failedTemplate:
          errorMessage: tls.certManager.selfSigned.create and tls.certManager.issuerRef.name are mutually exclusive; set exactly one

  - it: rejects world names unsafe for Kubernetes mount paths
    set:
      worlds[0].name: Team_A
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].name must be a valid lowercase DNS label

  - it: rejects authority ports
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com:6309]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].authorities[0] "team-a.example.com:6309" must be a DNS hostname without a port'

  - it: rejects oversized authority labels
    set:
      worlds:
        - name: team-a
          authorities: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].authorities[0] "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.com" must contain valid DNS labels'

  - it: rejects bucket paths
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a/prefix, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].bucket.url "gs://deployment-team-a/prefix" must be an exact lowercase gs://bucket URL'

  - it: accepts valid dotted bucket names over 63 bytes
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.ccc, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - isKind:
          of: ConfigMap

  - it: rejects dotted-decimal IPv4 bucket names
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://192.168.5.4, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].bucket.url "gs://192.168.5.4" must not use an IPv4 address as a bucket name'

  - it: rejects noncanonical world IDs
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52B471F7-8D38-4C89-B44A-6F4F8B1A4F48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].worldID "52B471F7-8D38-4C89-B44A-6F4F8B1A4F48" must be a canonical lowercase UUID with RFC 4122 variant'

  - it: rejects UUIDs without the RFC 4122 variant
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-744a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
    asserts:
      - failedTemplate:
          errorMessage: 'worlds[0].worldID "52b471f7-8d38-4c89-744a-6f4f8b1a4f48" must be a canonical lowercase UUID with RFC 4122 variant'

  - it: rejects an initial policy on a read-only world
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
          readOnly: true
          initialPolicy: "strictness: warn\n"
    asserts:
      - failedTemplate:
          errorMessage: worlds[0].initialPolicy must not be set on a read-only world, which is never seeded

  - it: derives authorities, bucket and token Secret from name and worldID
    set:
      worldDefaults.bucketPrefix: gs://deployment-
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
    asserts:
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-a"\n\s+authorities:\n\s+- "team-a.release-name.namespace.svc.cluster.local"\n\s+bucket:\n\s+url: "gs://deployment-team-a"\n\s+worldID: "52b471f7-8d38-4c89-b44a-6f4f8b1a4f48"'

  - it: derives authorities from worldDefaults.authorityDomain
    set:
      worldDefaults.authorityDomain: knowledge.example.internal
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          bucket: {url: gs://deployment-team-a}
    asserts:
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: '- "team-a.knowledge.example.internal"'

  - it: takes the world list and defaults from the umbrella globals
    set:
      worlds: []
      global:
        authorityDomain: knowledge.example.internal
        bucketPrefix: gs://deployment-
        worlds:
          - name: root
            worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
            hub: true
            allow: {domains: [example.com]}
          - name: team-b
            worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49
            readOnly: true
    asserts:
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "root"\n\s+authorities:\n\s+- "root.knowledge.example.internal"\n\s+bucket:\n\s+url: "gs://deployment-root"'
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-b"[\s\S]*readOnly: true'
      - template: configmap.yaml
        notMatchRegex:
          path: data["config.yaml"]
          pattern: 'hub|allow'
      - template: configmap.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-config

  - it: names itself after global.knowledgeService so the agent finds it
    set:
      worlds: []
      global:
        knowledgeService: knowledge
        bucketPrefix: gs://deployment-
        worlds:
          - name: root
            worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
    asserts:
      - template: configmap.yaml
        equal:
          path: metadata.name
          value: knowledge-config
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: '- "root.knowledge.namespace.svc.cluster.local"'

  - it: lets a world override every derived field
    set:
      worldDefaults.bucketPrefix: gs://deployment-
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          authorities: [team-a.example.com]
          bucket: {url: gs://custom-bucket}
          tokenSecret: {name: custom-tokens, key: custom.toml}
    asserts:
      - template: configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: 'authorities:\n\s+- "team-a.example.com"\n\s+bucket:\n\s+url: "gs://custom-bucket"'

  - it: rejects a fullnameOverride that differs from global.knowledgeService
    set:
      fullnameOverride: other
      global.knowledgeService: knowledge
    asserts:
      - failedTemplate:
          errorMessage: 'fullnameOverride "other" differs from global.knowledgeService "knowledge"; the broker and agent dial the latter'
