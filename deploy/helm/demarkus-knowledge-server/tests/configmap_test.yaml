suite: strict configuration
templates:
  - configmap.yaml
values:
  - fixtures/valid-values.yaml
tests:
  - it: renders one strict versioned config document
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: '^version: 1\nlisten:'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'health:\n  address: ":8081"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'peers:\n  listen: ":6310"\n  service: "RELEASE-NAME-peers.NAMESPACE.svc"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'certFile: /run/demarkus/tls/tls.crt\n  keyFile: /run/demarkus/tls/tls.key'

  - it: renders the content check and no floor without a hub
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'contentCheck:\n  pii: "block"\n  workDomains:\n    \[\]\n  nearDuplicate: "block"\n  injection: "warn"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'floorWorld'

  - it: takes the floor from the hub and renders the content check values
    set:
      broker.federation.hub: team-a
      server.contentCheck.pii: warn
      server.contentCheck.workDomains: ["Acme.Example"]
      server.contentCheck.nearDuplicate: warn
      server.contentCheck.injection: block
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'floorWorld: "team-a"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'contentCheck:\n  pii: "warn"\n  workDomains:\n    - "acme.example"\n  nearDuplicate: "warn"\n  injection: "block"'

  - it: policyFloor overrides the hub
    set:
      broker.federation.hub: team-a
      server.policyFloor: team-b
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'floorWorld: "team-b"'

  - it: policyFloor none renders no floor
    set:
      broker.federation.hub: team-a
      server.policyFloor: none
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'floorWorld'

  - it: normalizes authorities and renders fixed isolated token paths
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'tokensFile: "/run/demarkus/worlds/team-a/tokens.toml"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'tokensFile: "/run/demarkus/worlds/team-b/tokens.toml"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'staticTokensFile: "/run/demarkus/worlds/team-a/static-tokens.toml"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'tokenSecret'

  - it: applies defaults and preserves per-world overrides
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-a"[\s\S]*readOnly: false[\s\S]*maxConcurrentRequests: 32[\s\S]*requestTimeout: "10s"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-b"[\s\S]*readOnly: true[\s\S]*maxConcurrentRequests: 16[\s\S]*requestTimeout: "5s"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-a"[\s\S]*gated: false'

  - it: gates a memory world off the capability listener
    set:
      broker.memory.publicURL: https://memory.example.com
      worlds:
        - name: alice
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          profile: memory
          bucket: {url: gs://deployment-alice}
          allow: {emails: [alice@example.com]}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "alice"[\s\S]*gated: true'

  - it: restricts governance on a knowledge world once governors exist, opens it on memory, honours an override
    set:
      broker.governors: [admin@example.com]
      broker.memory.publicURL: https://memory.example.com
      worldDefaults.bucketPrefix: gs://deployment-
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f41
        - name: alice
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f42
          profile: memory
          allow: {emails: [alice@example.com]}
        - name: lab
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f43
          governance: open
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- name: "team-a"\n(?: {4}[^\n]*\n)*? {6}governance: "restricted"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- name: "alice"\n(?: {4}[^\n]*\n)*? {6}governance: "open"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- name: "lab"\n(?: {4}[^\n]*\n)*? {6}governance: "open"'

  - it: keeps every world open without governors, as before govern, unless a world restricts
    set:
      broker.governors: []
      worldDefaults.bucketPrefix: gs://deployment-
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f41
        - name: lab
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f43
          governance: restricted
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- name: "team-a"\n(?: {4}[^\n]*\n)*? {6}governance: "open"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- name: "lab"\n(?: {4}[^\n]*\n)*? {6}governance: "restricted"'

  - it: passes a world's checkpoint grace through, and omits it unset
    set:
      worlds:
        - name: team-a
          worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
          bucket: {url: gs://team-a-bucket, checkpointGrace: 30m}
        - name: team-b
          worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49
          bucket: {url: gs://team-b-bucket}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'worldID: "52b471f7-8d38-4c89-b44a-6f4f8b1a4f48"\n      checkpointGrace: "30m"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'worldID: "42b471f7-8d38-4c89-b44a-6f4f8b1a4f49"\n      checkpointGrace'

  - it: propagates listener settings
    set:
      server.udpPort: 7443
      server.healthPort: 9090
      server.maxIncomingStreams: 256
      server.idleTimeout: 45s
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'address: ":7443"\n  maxIncomingStreams: 256\n  idleTimeout: "45s"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'health:\n  address: ":9090"'

  - it: omits the policy file when no initial policy is configured
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'file: /etc/demarkus/policy'
      - isNull:
          path: data["policy-team-a.md"]

  - it: ships an initial policy as chart content and points the world at it
    set:
      worlds:
        - name: team-a
          authorities: [team-a.example.com]
          bucket: {url: gs://deployment-team-a, worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48}
          tokenSecret: {name: team-a-tokens, key: tokens.toml}
          initialPolicy: |
            # Write Policy

            Ours from the start.

            strictness: block
        - name: team-b
          authorities: [team-b.example.com]
          bucket: {url: gs://deployment-team-b, worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49}
          tokenSecret: {name: team-b-tokens, key: tokens.toml}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-a"[\s\S]*file: "/etc/demarkus/policy-team-a.md"'
      - equal:
          path: data["policy-team-a.md"]
          value: |
            # Write Policy

            Ours from the start.

            strictness: block
      # The second world configures none, so it keeps the embedded default.
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'name: "team-b"[\s\S]*file:'
      - isNull:
          path: data["policy-team-b.md"]

  - it: renders no classifier by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'classifier:'

  - it: renders a configured classifier
    set:
      server.contentCheck.classifier.kind: anthropic
      server.contentCheck.classifier.model: claude-haiku-5-5
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'classifier:\n    kind: "anthropic"\n    model: "claude-haiku-5-5"\n    timeout: "5s"\nworlds:'
