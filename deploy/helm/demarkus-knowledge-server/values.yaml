# demarkus-knowledge: the multi-world knowledge server and the OIDC broker
# with its MCP gateways in one process. HTTP /healthz and /readyz probes.
image:
  repository: ghcr.io/latebit-io/demarkus-knowledge
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

server:
  udpPort: 6309
  # The knowledge server's own liveness and readiness listener.
  healthPort: 8081
  # The broker's plain HTTP listener: management API (OIDC login, device
  # flow, /me/install) and both MCP gateways by hostname. The Ingress
  # terminates TLS.
  httpPort: 8080
  maxIncomingStreams: 128
  idleTimeout: 30s
  # Replicas tell each other about commits on this port (ALPN mark-peer),
  # so a WATCH on one replica sees another's write at once instead of on
  # the 5 s poll. Reached only through the headless peers Service and
  # admitted only from this chart's pods by the NetworkPolicy.
  peerPort: 6310
  # The bearer listener (UDP, ALPN mark): clients signed in at the IdP put
  # their bearer in the auth field instead of a capability token, and the
  # broker admits every request (ADR 0033). The NetworkPolicy admits it from
  # anywhere; the Service carries it on service.bearerPort.
  bearerPort: 8443

# Static worlds; empty is valid only with provisioning enabled below, or when
# the umbrella supplies global.worlds. An existing empty bucket is initialized
# and seeded on first start. Both token Secrets mount optional: a world opens
# without them and reloads as they appear (ownership in the README).
#
# Only name and worldID are required. Everything else derives from
# worldDefaults (or the umbrella's global.*):
#   authorities:        [<name>.<authorityDomain>]
#   bucket.url:         <bucketPrefix><name>
#   tokenSecret:        {name: <name>-tokens, key: tokens.toml}
#   staticTokenSecret:  {name: <name>-static-tokens, key: tokens.toml}
#   allow, writeScope:  worldDefaults, merged key by key
# Any field set on a world overrides the derived value. The same entry
# configures the gateway: allow is the per world identity predicate,
# writeScope the paths an allowed identity may write, publicURL the address
# /me/install hands direct clients (blank omits the world), hub marks the
# federation hub (at most one world), profile picks the gateway (knowledge,
# or memory for a hand-provisioned tenant whose allow names one identity).
worlds: []
  # - name: team-a
  #   worldID: 52b471f7-8d38-4c89-b44a-6f4f8b1a4f48
  #   allow:
  #     groups: ["team-a"]
  # - name: team-b
  #   worldID: 42b471f7-8d38-4c89-b44a-6f4f8b1a4f49
  #   authorities: [team-b.example.com]
  #   bucket: {url: gs://other-bucket, checkpointGrace: 30m}  # grace: 15m default and minimum
  #   readOnly: true
  #   publicURL: "mark://team-b.example.com:6309"

tokens:
  admin:
    label: admin
    # Recursive: `/*` is root-level only (Go path.Match).
    paths: ["/**"]
    # Publish-only: any token with `read` flips a world into
    # read-auth-required mode and breaks the broker's open reads.
    operations: ["publish"]
    # Explicit token shared by every bootstrapped world; if empty, a fresh
    # 64-char token is generated per world.
    token: ""

  # When true, also create a <world>-token-values Secret with the raw value,
  # for a direct client that writes with it.
  emitRawValues: true

  # A token Secret's hash must match the raw value minted with it, so a
  # pre-install Job creates any missing ones out-of-band and the chart never
  # templates them. Disable for GitOps installs; see the README.
  bootstrap:
    enabled: true
    # Needs kubectl + sh + coreutils. kubectl supports only ±1 minor of the
    # API server, so override this to match your cluster (default fits 1.34+).
    image: docker.io/alpine/k8s:1.35.5
    imagePullPolicy: IfNotPresent

# Dynamic tenant provisioning for the memory gateway: static disables it,
# allowlisted gates on provisioning.allow, open admits any verified identity
# and requires maxTenants. Needs broker.memory.publicURL. A provisioned
# tenant is served in this process at once and recorded in the two Secrets
# below, which the pods mount for restarts; `worlds: []` is then a
# legitimate install. Flow, RBAC and the GCP credential requirement are in
# the README.
provisioning:
  mode: static
  # Gate for allowlisted mode; same predicate as per-world allow.
  allow: {}
    # domains: ["example.com"]
    # emails: ["alice@example.com"]
  # Hard cap on dynamic tenants. Required (>0) in open mode.
  maxTenants: 0
  # Per-tenant document quota (limits.maxDocuments). 0 = unlimited.
  maxDocumentsPerTenant: 0
  # GCP project + location for bucket creation. Tenant buckets are
  # gs://<bucketPrefix><slug>, from worldDefaults.bucketPrefix or
  # global.bucketPrefix; tenant authorities are <slug>.<authorityDomain>.
  bucketProject: ""
  bucketLocation: ""
  # Secret in this namespace whose worlds.yaml key carries the tenant
  # worlds fragment the server mounts.
  worldsSecret: memory-worlds-config
  # Registry Secret name; blank uses the binary's default
  # (demarkus-memory-broker-registry) so an upgrade keeps its tenants.
  registrySecret: ""

worldDefaults:
  # Suffix for derived authorities (<name>.<authorityDomain>); also the SNI
  # the broker and agent dial with. Falls back to global.authorityDomain,
  # then <fullname>.<namespace>.svc.cluster.local. Need not resolve in DNS.
  authorityDomain: ""
  # Prefix for derived bucket URLs, e.g. gs://my-project-demarkus-. Falls
  # back to global.bucketPrefix; empty means every world sets bucket.url.
  bucketPrefix: ""
  readOnly: false
  # Authorization predicate every world starts from; all lists empty admits
  # any verified identity.
  allow: {}
  # Path globs an allowed identity may write through the gateway. /** is
  # recursive; /* matches top-level entries only. Reads are never scoped.
  writeScope:
    paths: ["/**"]
  # Seeded as version 1 of /.well-known/demarkus/policy.md when the world is
  # created; empty uses the embedded warn-level default, and a world that has
  # a policy keeps it. Prose must never begin a line with a directive name
  # (strictness:, require_tags:, require_fields:).
  initialPolicy: ""
  limits:
    maxConcurrentRequests: 32
    requestTimeout: 10s
    requestsPerSecond: 50
    burst: 100

# The QUIC certificate: every world authority as a SAN, plus the tenant
# wildcard when provisioning is enabled.
tls:
  # Set exactly one mode. Existing Secrets must contain tls.crt and tls.key.
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef:
      kind: ClusterIssuer
      name: ""
    # Render a namespaced self-signed Issuer and use it instead of issuerRef.
    # Clients then need insecure dialing until a CA issuer replaces it.
    selfSigned:
      create: false
    annotations: {}

# The broker half of the process. One HTTP listener serves the management
# API and both MCP gateways; the gateway a request reaches is chosen by its
# Host: the memory hostname when configured, the knowledge gateway otherwise.
broker:
  # Externally reachable base URL, no trailing slash (e.g.
  # https://broker.example.com). Required: the issuer of the broker's
  # discovery document and the default knowledge gateway URL.
  publicURL: ""
  # Knowledge gateway: every world with profile knowledge, org-open reads,
  # writes under each world's allow and writeScope.
  mcp:
    # Base URL when the gateway is fronted at its own hostname
    # (ingress.mcp.host); empty is broker.publicURL. Plugins join with
    # <publicURL>/mcp.
    publicURL: ""
    # Tool surface: "full" (default) or "lean"; see MCP-API.md "Tool profiles".
    toolProfile: "full"
  # Memory gateway: one private world per identity, on when publicURL is set.
  # Its hostname must differ from the knowledge gateway's.
  memory:
    publicURL: ""
    toolProfile: "full"

  # Signed-state-cookie HMAC key, base64-encoded, in one of three modes:
  #   1. blank (default): the broker generates a key on first start and
  #      persists it in the cookieKeySecret Secret; the render stays
  #      deterministic under `helm template` (Argo CD, Flux).
  #   2. cookieKey: a literal, in plaintext in your values.
  #   3. existingCookieKeyRef: an operator-managed Secret (SealedSecret,
  #      ExternalSecret), read through BROKER_COOKIE_KEY.
  # Rotating invalidates in-flight logins.
  cookieKey: ""
  existingCookieKeyRef:
    name: ""
    key: cookie-key
  # Secret holding the generated key. Default <fullname>-cookie-key.
  cookieKeySecret: ""
  # State cookie TTL: long enough to complete the OIDC redirect, short
  # enough that a stale cookie cannot be replayed.
  stateTTL: 5m
  # DEV-ONLY: drop the Secure attribute on the OIDC state cookie so a
  # plain-HTTP harness can replay it. In production it makes the cookie
  # hijackable; keep false.
  insecureCookies: false
  # Refresh-token lifetime. 90 days matches industry defaults.
  refreshTokenTTL: 2160h
  # Live logins per user; past it the oldest is revoked.
  maxSessionsPerUser: 20
  # Broker-signed id_token lifetime; must be less than refreshTokenTTL.
  idTokenTTL: 15m
  # gs:// bucket for refresh token records and MCP host registrations, one
  # object each. Required; dedicated to the broker, never a world's bucket.
  # The workload identity needs roles/storage.objectAdmin on it.
  stateBucket: ""
  # Generated id_token signing key. Default <fullname>-signing-key.
  signingKeySecret: ""
  # Where registrations lived before stateBucket; the broker imports them at
  # start and empties it. Default <fullname>-dynamic-clients.
  dynamicClientsSecret: ""
  # In-flight authorization codes and device grants, shared by every replica
  # so a login may cross pods. The broker creates it; entries live minutes.
  # Default <fullname>-oauth-state.
  oauthStateSecret: ""

  oidc:
    # OIDC discovery URL (e.g. https://accounts.google.com).
    issuer: ""
    # OAuth client ID registered at the IdP.
    clientID: ""
    # OAuth client secret: cleartext here (lives in helm release history) or
    # an operator-managed Secret read through OIDC_CLIENT_SECRET. Exactly one.
    clientSecret: ""
    existingSecretRef:
      name: ""
      key: clientSecret
    # Public URL of /auth/callback, exactly as registered with the IdP.
    redirectURL: ""
    # Google Workspace hosted-domain (`hd`) allowlist checked on every IdP
    # exchange before any code or token is issued; empty admits any verified
    # identity, then per-world allow applies.
    allowDomains: []
    # ECDSA P-256 key signing broker id_tokens, served at /.well-known/jwks.json:
    #   1. blank (default): generated on first start into signingKeySecret.
    #      Rotate by deleting the Secret and restarting the Deployment.
    #   2. brokerSigningKey: a PEM literal (PKCS#8 or SEC1); dev only.
    #   3. existingSigningKeyRef: an operator-managed Secret holding the PEM.
    # Generate one with: openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
    brokerSigningKey: ""
    existingSigningKeyRef:
      name: ""
      key: signing-key.pem

  # Registered confidential web clients (RFC 6749 2.1), such as the library.
  # Each entry sets exactly one of clientSecret (hashed at load),
  # clientSecretHash (sha256 hex) or existingSecretRef (the Secret the web
  # app mounts). Native and CLI agents never appear here.
  webClients: []
    # - clientID: library-web
    #   existingSecretRef:
    #     name: library-oauth
    #     key: clientSecret   # default
    #   redirectURIs:
    #     - https://library.example.com/auth/callback
    #   name: Universe Library

  # Worlds served elsewhere (another cluster) the gateway reads over QUIC.
  # Writes stay local. internalAddress is the authority and SNI, dialAddress
  # the socket when it differs, publicURL what /me/install hands out.
  remoteWorlds: []
    # - name: legacy
    #   internalAddress: "legacy.other-cluster.example:6309"
    #   allow:
    #     groups: ["engineering"]
  # QUIC dialing for remoteWorlds. insecureSkipVerify trusts the address it
  # dialed; opt in only where those worlds carry self-signed certificates.
  worldDialer:
    insecureSkipVerify: false

  # Refresh token expiry sweeper, leader-elected across replicas. Named
  # `disabled` so the zero value keeps it on.
  sweeper:
    disabled: false
    interval: 5m
    leaseName: demarkus-broker-sweeper

  # Federation graph, checkpointed into the hub's /graph/worlds/ and
  # /graph.md by one replica under the Lease; see the README. hub, a writable
  # knowledge world, defaults to the world marked hub; none is off. Blank
  # quietPeriod and interval take 30s and 1m.
  federation:
    hub: ""
    leaseName: demarkus-federation
    quietPeriod: ""
    interval: ""

  # Per-subject (/me/install) and per-IP (/auth/login) token buckets.
  # trustForwardedFor is only safe behind an Ingress that strips spoofed
  # X-Forwarded-For; flip it off without one (dev, port-forward).
  rateLimit:
    disabled: false
    tokens:
      perMinute: 10
      burst: 5
    login:
      perMinute: 20
      burst: 5
    trustForwardedFor: true

# Role and RoleBinding in the release namespace for the broker's state: the
# sweeper and federation Leases, its own Secrets, and the tenant registry and
# worlds fragment when provisioning is on. Flip off only if RBAC is managed
# out of band.
rbac:
  create: true

# Ingress fronting the HTTP listener with TLS at the controller. The
# management host serves login and /me/install; the optional MCP and memory
# hosts serve the two gateways at /mcp. Every host may also be the same
# name: routes never overlap.
ingress:
  enabled: false
  className: nginx
  # Public hostname of the management API, e.g. broker.example.com.
  # Required when enabled.
  host: ""
  annotations: {}
  # Knowledge gateway hostname (broker.mcp.publicURL); empty routes the
  # gateway through the management host.
  mcp:
    host: ""
  # Memory gateway hostname (broker.memory.publicURL). Required when the
  # memory gateway is configured and the Ingress is on.
  memory:
    host: ""
  # TLS for every host above. Two modes, or neither when the controller
  # terminates TLS on its own:
  #   1. existingSecret: a kubernetes.io/tls Secret covering all hosts.
  #   2. certManager.enabled: one Certificate with every host as a SAN.
  tls:
    existingSecret: ""
    certManager:
      enabled: false
      issuerRef:
        kind: ClusterIssuer
        name: letsencrypt-prod
      annotations: {}

service:
  type: ClusterIP
  # Service port of the bearer listener: 443 is the UDP port networks that
  # block 6309 still pass.
  bearerPort: 443
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: Local

serviceAccount:
  create: true
  name: ""
  annotations: {}
  workloadIdentity:
    # GSA with storage access to every configured world bucket.
    gsa: ""

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 24
  liveness:
    periodSeconds: 30
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Standard NetworkPolicy cannot restrict GCS by FQDN, and the OIDC issuer
  # and the API server sit behind TCP 443 too. Explicitly accept unrestricted
  # TCP/443, or disable this policy and supply CNI/proxy controls.
  allowUnrestrictedHTTPS: false
  # Namespace of the Ingress controller that may reach the HTTP listener.
  ingressFromNamespace: ingress-nginx
  agent:
    namespace: demarkus-agent
    podLabels:
      app.kubernetes.io/name: demarkus-agent
  # Required for direct clients when service.type is LoadBalancer.
  externalCIDRs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# Extra environment for the container, e.g. STORAGE_EMULATOR_HOST for a
# GCS emulator in a dev cluster.
extraEnv: []
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
nameOverride: ""
# Resource names default to the release name (global.knowledgeService under
# the umbrella).
fullnameOverride: ""
