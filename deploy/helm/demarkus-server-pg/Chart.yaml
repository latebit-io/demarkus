apiVersion: v2
name: demarkus-server-pg
description: |
  Mark Protocol server, Postgres backend. Same server as the demarkus-server
  chart, built with the pgstore backend linked in: all state lives in
  Postgres, so no content PVC is created and replicas share one world. Use
  the demarkus-server chart for the dependency-free file store.
type: application
version: 0.1.0
dependencies:
  - name: demarkus-server-common
    version: "0.1.0"
    repository: "file://../demarkus-server-common"
appVersion: "0.7.1"
keywords:
  - demarkus
  - mark-protocol
  - markdown
  - quic
  - postgres
home: https://demarkus.io
sources:
  - https://github.com/latebit-io/demarkus
maintainers:
  - name: latebit-io
    url: https://github.com/latebit-io
