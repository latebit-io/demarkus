# Only what differs from the file-store chart; the shared library templates
# are covered once, by the demarkus-server suite.
suite: statefulset (postgres backend)
templates:
  - statefulset.yaml
# The DSN Secret has no default, so every render needs it; the one test that
# asserts the refusal clears it again.
set:
  server.postgres.dsnSecret.name: pg-app
tests:
  - it: renders a StatefulSet named for this chart
    template: statefulset.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-demarkus-server-pg

  - it: runs the postgres backend and never passes -root
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-store"
      - contains:
          path: spec.template.spec.containers[0].args
          content: postgres
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "-root"

  - it: reads the DSN from a Secret, never from the pod spec
    template: statefulset.yaml
    set:
      server.postgres.dsnSecret.key: uri
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEMARKUS_PG_DSN
            valueFrom:
              secretKeyRef:
                name: pg-app
                key: uri

  - it: dsnSecret.key defaults to uri
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DEMARKUS_PG_DSN")].valueFrom.secretKeyRef.key
          value: uri

  - it: creates no content PVC and no content mount
    template: statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: content
            mountPath: /var/lib/demarkus/content

  - it: uses the postgres flavor of the server image
    template: statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/latebit-io/demarkus-server-pg:'
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: refuses to render without the DSN Secret name
    template: statefulset.yaml
    set:
      server.postgres.dsnSecret.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "server.postgres.dsnSecret.name is required: it names the Secret holding the Postgres DSN"

  - it: still mounts tokens, tmp and home
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tokens
            mountPath: /etc/demarkus/tokens
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
