apiVersion: v1
kind: Service
metadata:
  name: {{ include "demarkus-memory-broker.fullname" . }}
  labels:
    {{- include "demarkus-memory-broker.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.server.port }}
      targetPort: http
    {{- /* MCP gateway port. Always rendered alongside `http` — the
           listener is always on. `targetPort: mcp` resolves to the
           deployment's named containerPort so renumbering
           server.mcp.addr never desyncs the Service from the pod. */}}
    - name: mcp
      protocol: TCP
      port: {{ include "demarkus-memory-broker.mcpPort" . }}
      targetPort: mcp
  selector:
    {{- include "demarkus-memory-broker.selectorLabels" . | nindent 4 }}
