suite: statefulset
templates:
  - statefulset.yaml
tests:
  - it: renders a StatefulSet with correct name + replicas
    template: statefulset.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-demarkus-server
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-demarkus-server

  - it: container args include -port and -root by default
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-port"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "6309"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-root"
      - contains:
          path: spec.template.spec.containers[0].args
          content: /var/lib/demarkus/content

  - it: -read-only added when server.readOnly=true
    template: statefulset.yaml
    set:
      server.readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-read-only"

  - it: -read-only absent when server.readOnly=false (default)
    template: statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "-read-only"

  - it: TLS args + volume absent when no TLS configured
    template: statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "-tls-cert"
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: RELEASE-NAME-demarkus-server-tls

  - it: TLS args + volume present when cert-manager enabled
    template: statefulset.yaml
    set:
      tls.certManager.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-tls-cert"
      - contains:
          path: spec.template.spec.containers[0].args
          content: /etc/demarkus/tls/tls.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: RELEASE-NAME-demarkus-server-tls

  - it: TLS uses existingSecret when set
    template: statefulset.yaml
    set:
      tls.existingSecret: my-corp-tls
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: my-corp-tls

  - it: udpPort knob propagates to args and port
    template: statefulset.yaml
    set:
      server.udpPort: 443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "443"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 443
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: UDP

  - it: pod-level securityContext has runAsNonRoot + seccompProfile
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: container-level securityContext locks down container
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes disabled when probes.enabled=false
    template: statefulset.yaml
    set:
      probes.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: probes use demarkus CLI fetching agent-manifest
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: "/demarkus"
      - contains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: "-no-cache"
      - contains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: "mark://localhost:6309/.well-known/agent-manifest.md"

  - it: startup probe gates liveness with a first-boot budget
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          content: "mark://localhost:6309/.well-known/agent-manifest.md"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds

  - it: container image is the demarkus-server repo and relies on ENTRYPOINT
    template: statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/latebit-io/demarkus-server:'
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: volumeClaimTemplates provisions content PVC
    template: statefulset.yaml
    set:
      storage.className: premium-rwo
      storage.size: 10Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: content
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: premium-rwo

  - it: volumeClaimTemplates sets volumeMode to match the k8s default (no drift)
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeMode
          value: Filesystem

  - it: volumeMode is overridable
    template: statefulset.yaml
    set:
      storage.volumeMode: Block
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeMode
          value: Block

  - it: empty volumeMode override still renders Filesystem (no silent drift)
    template: statefulset.yaml
    set:
      storage.volumeMode: ""
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeMode
          value: Filesystem

  - it: volumeClaimTemplates carries only stable labels (immutable-safe across bumps)
    template: statefulset.yaml
    asserts:
      # The PVC template is immutable, so it must carry only labels that are
      # stable across chart bumps. selectorLabels (name + instance) qualify;
      # the version/chart/managed-by labels would churn every release and turn
      # each bump into a forbidden in-place VCT update.
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            app.kubernetes.io/name: demarkus-server
            app.kubernetes.io/instance: RELEASE-NAME
