{{- $tlsSecret := include "demarkus-server.tlsSecretName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "demarkus-server.fullname" . }}
  labels:
    {{- include "demarkus-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "demarkus-server.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "demarkus-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demarkus-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* No checksum/tokens: the token Secret is runtime-owned (bootstrap
               Job + broker), not chart-rendered, so there is nothing stable to
               hash here. Token rotation is an explicit operator action. */}}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "demarkus-server.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -port
            - {{ .Values.server.udpPort | quote }}
            - -root
            - /var/lib/demarkus/content
            - -tokens
            - /etc/demarkus/tokens/tokens.toml
            {{- if $tlsSecret }}
            - -tls-cert
            - /etc/demarkus/tls/tls.crt
            - -tls-key
            - /etc/demarkus/tls/tls.key
            {{- end }}
            {{- if .Values.server.readOnly }}
            - -read-only
            {{- end }}
            {{- with .Values.server.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: HOME
              value: /home/demarkus
            # JSON-by-default in k8s deployments so log shippers (Datadog,
            # OTel Collector, Vector, Fluent Bit, Grafana Alloy) can parse
            # structured fields without grok patterns. Operators who want
            # human-readable text on a debug pod can override to "text".
            - name: DEMARKUS_LOG_FORMAT
              value: {{ .Values.server.logFormat | default "json" | quote }}
          ports:
            - name: mark
              protocol: UDP
              containerPort: {{ .Values.server.udpPort }}
          {{- if .Values.probes.enabled }}
          # Holds liveness off during startup work (world walk / catalog
          # backfill); see values.yaml.
          startupProbe:
            exec:
              command:
                - /demarkus
                - -insecure
                - -no-cache
                - {{ printf "mark://localhost:%d/.well-known/agent-manifest.md" (int .Values.server.udpPort) | quote }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - /demarkus
                - -insecure
                - -no-cache
                - {{ printf "mark://localhost:%d/.well-known/agent-manifest.md" (int .Values.server.udpPort) | quote }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - /demarkus
                - -insecure
                - -no-cache
                - {{ printf "mark://localhost:%d/.well-known/agent-manifest.md" (int .Values.server.udpPort) | quote }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: content
              mountPath: /var/lib/demarkus/content
            - name: tokens
              mountPath: /etc/demarkus/tokens
              readOnly: true
            {{- if $tlsSecret }}
            - name: tls
              mountPath: /etc/demarkus/tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/demarkus
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tokens
          secret:
            secretName: {{ include "demarkus-server.tokensSecretName" . }}
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: content
        # selectorLabels ONLY — never the full label set. volumeClaimTemplates
        # is immutable, and the full labels carry `helm.sh/chart` +
        # `app.kubernetes.io/version`, which change on every chart bump. Stamping
        # those here turns each version bump into a forbidden in-place VCT update
        # (the same immutable-field trap the volumeMode comment below guards
        # against, via metadata instead of spec). selectorLabels (name +
        # instance) are stable across versions, so the VCT stays byte-identical
        # across bumps and GitOps applies them cleanly.
        labels:
          {{- include "demarkus-server.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.storage.accessMode }}
        # Render volumeMode explicitly. Kubernetes defaults a PVC's volumeMode
        # to Filesystem server-side, so omitting it here makes the rendered
        # manifest (volumeMode absent) drift from the live PVC (Filesystem).
        # volumeClaimTemplates is immutable, so under a GitOps tool using
        # ServerSideApply (e.g. ArgoCD) that drift turns every subsequent sync
        # that must re-apply the StatefulSet — like an image bump — into a
        # rejected "forbidden update to immutable field" loop. Emitting the
        # value the cluster will default to keeps render == live. Default it
        # so an empty override (""/null) can't render a blank field — that
        # would let Kubernetes re-default it server-side and silently
        # reintroduce the very drift this block exists to prevent.
        volumeMode: {{ .Values.storage.volumeMode | default "Filesystem" }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className | quote }}
        {{- end }}
