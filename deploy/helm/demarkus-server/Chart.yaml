apiVersion: v2
name: demarkus-server
description: |
  Mark Protocol server, file-store backend. Serves markdown over QUIC, with
  capability-based auth, versioned content store, and TLS. One Helm release =
  one world. The server image links no external database driver.
type: application
version: 0.1.0
dependencies:
  - name: demarkus-server-common
    version: "0.1.0"
    repository: "file://../demarkus-server-common"
appVersion: "0.7.1"
keywords:
  - demarkus
  - mark-protocol
  - markdown
  - quic
home: https://demarkus.io
sources:
  - https://github.com/latebit-io/demarkus
maintainers:
  - name: latebit-io
    url: https://github.com/latebit-io
