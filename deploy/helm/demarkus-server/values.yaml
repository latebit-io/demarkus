# Default values for demarkus-server.
# Override with --values or --set on `helm install`.

image:
  # Bundles demarkus-server (ENTRYPOINT) and the demarkus CLI used by
  # the StatefulSet's exec probes. Admin CLIs (demarkus-token,
  # demarkus-publish) live outside the runtime image; see
  # tools/.goreleaser.yml for their distribution.
  repository: ghcr.io/latebit-io/demarkus-server
  # tag defaults to .Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Pod count. Multi-replica with shared content is a Phase 7 concern; keep at 1.
replicaCount: 1

server:
  # UDP port the server listens on. Default protocol port. Override to 443 for
  # VPN/middlebox-hostile networks (Cloudflare Warp, corp firewalls that filter
  # non-standard UDP).
  udpPort: 6309

  # Reject all write operations (FETCH/LIST/VERSIONS only).
  readOnly: false

  # Log format. "json" (default) produces one structured JSON record per
  # event for log shippers; "text" produces human-readable key=value lines.
  # The chart defaults to JSON because production deployments invariably
  # want machine-parseable logs.
  logFormat: json

  # Extra args appended to the server command line.
  extraArgs: []

  # Document store backend: "file" (versioned files on the PVC) or
  # "postgres" (all state in Postgres; no content PVC is created).
  store: file

  # Postgres backend wiring; required when store=postgres. The DSN is read
  # from a Secret (e.g. a CloudNativePG cluster's <cluster>-app Secret,
  # key "uri") so credentials never land in values files.
  postgres:
    dsnSecret:
      name: ""
      key: uri

# Service exposing the server. LoadBalancer with protocol UDP is the standard
# path on managed Kubernetes (GKE, EKS); use ClusterIP/NodePort for local dev.
service:
  type: LoadBalancer
  # Optional: bind LB to a specific external IP (if your cloud supports it).
  loadBalancerIP: ""
  # Cloud-specific Service annotations (e.g. AWS NLB selection).
  annotations: {}
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb

# Persistent storage for the versioned content store.
storage:
  className: ""        # cluster-default if empty
  size: 5Gi
  accessMode: ReadWriteOnce
  # Match the value Kubernetes defaults onto the PVC so the rendered
  # volumeClaimTemplates equals the live one — avoids immutable-field drift
  # that wedges GitOps re-applies (e.g. ArgoCD on an image bump). Override to
  # Block only for raw-block volumes.
  volumeMode: Filesystem

# TLS — server speaks QUIC, so TLS is mandatory. Three modes:
#   1. existingSecret: reference a pre-existing tls Secret (cert-manager, etc.)
#   2. certManager.enabled=true: chart provisions a cert-manager Certificate
#   3. neither set: server auto-generates a self-signed dev cert at startup
tls:
  existingSecret: ""

  certManager:
    enabled: false
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod
    # If empty, defaults to <release>.<namespace>.svc.cluster.local
    dnsNames: []
    # Annotations on the Certificate resource.
    annotations: {}

# Initial admin token.
# - If you provide tokens.admin.token (raw), the chart uses it as-is.
# - Otherwise the chart auto-generates one on first install and preserves it
#   across helm upgrades via `lookup` on the existing Secret.
# - The chart writes TWO Secrets:
#     <release>-tokens         server-mounted, contains TOML with hash only
#     <release>-token-values   raw token, for the broker to read/revoke
#   These are kept separate so the server never mounts raw token bytes.
tokens:
  admin:
    label: admin
    paths: ["/**"]
    operations: ["publish", "read"]
    # Explicit token value; if empty, auto-generated on first install.
    token: ""

  # When true, also create the <release>-token-values Secret with the raw value.
  # Required when the broker / federation agent manages this world. Default true.
  emitRawValues: true

  # Token Secrets are runtime-owned (server reads tokens.toml; the broker appends
  # its write-token entry at runtime). A one-time pre-install/pre-upgrade Job
  # creates them out-of-band — atomically and consistently — then hands off; the
  # chart never templates them, so no GitOps controller reconciles (and corrupts)
  # their content. Disable only if tokens are provisioned by some other means.
  bootstrap:
    enabled: true
    # Needs kubectl + sh + coreutils (sha256sum, tr); alpine/k8s bundles all
    # three. Pinned within ±1 minor of the cluster (GKE 1.35) per the kubectl
    # version-skew policy; bump alongside cluster upgrades. Override with the
    # org's approved image + tag. (bitnami/kubectl was dropped — its Docker Hub
    # repo no longer publishes version tags.)
    image: docker.io/alpine/k8s:1.35.5
    imagePullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Probes exec the demarkus CLI against /.well-known/agent-manifest.md (always
# public; -no-cache spares the read-only root fs). The startup probe covers
# world walks and catalog backfill so a slow first boot is not restart-looped.
probes:
  enabled: true
  startup:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  workloadIdentity:
    gsa: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
