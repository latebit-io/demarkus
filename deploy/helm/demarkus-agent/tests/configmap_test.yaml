suite: configmap
templates:
  - configmap.yaml
tests:
  - it: renders agent.toml with seeds and hubs
    set:
      config.seeds:
        - mark://team-a:6309
        - mark://team-b:6309
      config.hubs:
        - mark://hub:6309
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \['
      - matchRegex:
          path: data["agent.toml"]
          pattern: '"mark://team-a:6309"'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '"mark://hub:6309"'

  - it: renders crawl + schedule + politeness blocks with defaults
    set:
      config.seeds:
        - mark://team-a:6309
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'workers = 5'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'interval = "6h"'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'request_delay = "100ms"'

  - it: renders logical authority endpoint overrides
    set:
      config.seeds:
        - mark://team-a
      config.endpoints.team-a.dialAddress: shared-a.internal:6309
      config.endpoints.team-a.serverName: team-a.internal
      config.endpoints.team-b.dialAddress: shared-b.internal:6309
      config.endpoints.team-b.serverName: team-b.internal
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."team-a"\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '(?s)\[endpoints\."team-a"\]\ndial_address = "shared-a.internal:6309"\nserver_name = "team-a.internal"'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '(?s)\[endpoints\."team-b"\]\ndial_address = "shared-b.internal:6309"\nserver_name = "team-b.internal"'

  - it: emits empty arrays when no seeds/hubs configured
    set:
      config.seeds: []
      config.hubs: []
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \[\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'hubs = \[\]'
      - notMatchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\.'

  - it: derives seeds, hubs and endpoints from worlds, hub and dialAddress
    set:
      worlds: [root, team-a, team-b]
      hub: root
      dialAddress: knowledge.demarkus-knowledge.svc.cluster.local:6309
      authorityDomain: knowledge.demarkus-knowledge.svc.cluster.local
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \[\n\s+"mark://team-a",\n\s+"mark://team-b",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'hubs = \[\n\s+"mark://root",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."root"\]\ndial_address = "knowledge.demarkus-knowledge.svc.cluster.local:6309"\nserver_name = "root.knowledge.demarkus-knowledge.svc.cluster.local"'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."team-b"\]\ndial_address = "knowledge.demarkus-knowledge.svc.cluster.local:6309"\nserver_name = "team-b.knowledge.demarkus-knowledge.svc.cluster.local"'

  - it: derives the topology from the umbrella globals
    set:
      global:
        knowledgeService: knowledge
        worlds:
          - name: root
            hub: true
          - name: team-a
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \[\n\s+"mark://team-a",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'hubs = \[\n\s+"mark://root",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."team-a"\]\ndial_address = "knowledge.NAMESPACE.svc.cluster.local:6309"\nserver_name = "team-a.knowledge.NAMESPACE.svc.cluster.local"'

  - it: omits endpoints when no dial address is known
    set:
      worlds: [root, team-a]
      hub: root
    asserts:
      - notMatchRegex:
          path: data["agent.toml"]
          pattern: 'endpoints'

  - it: explicit config lists override the derived ones
    set:
      worlds: [root, team-a]
      hub: root
      dialAddress: knowledge.ns.svc.cluster.local:6309
      config.seeds: [mark://other]
      config.endpoints.team-a.dialAddress: custom.internal:6309
    asserts:
      - matchRegex:
          path: data["agent.toml"]
          pattern: 'seeds = \[\n\s+"mark://other",\n\]'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."team-a"\]\ndial_address = "custom.internal:6309"'
      - matchRegex:
          path: data["agent.toml"]
          pattern: '\[endpoints\."root"\]\ndial_address = "knowledge.ns.svc.cluster.local:6309"'
