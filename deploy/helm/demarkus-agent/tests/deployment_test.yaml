suite: deployment
# deployment.yaml `include`s configmap.yaml and secret.yaml for the
# checksum/config + checksum/tokens annotations. Both must be in the
# suite template list for those `include` calls to resolve at render
# time; otherwise helm-unittest reports "no template ... associated
# with template gotpl" and every test errors. Per-test `template:`
# scoping narrows assertions back to deployment.yaml. Same pattern as
# server `statefulset_test.yaml` post-§6.3.D.1.
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: renders a Deployment with correct name and labels
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-demarkus-agent
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: container image is the demarkus-agent repo and relies on ENTRYPOINT
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/latebit-io/demarkus-agent:'
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: omits --publish when no hubs configured
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs: []
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --publish

  - it: includes --publish when hubs configured
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs:
        - mark://hub:6309
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --publish

  - it: includes --per-server by default
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs:
        - mark://hub:6309
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --per-server

  - it: omits --per-server when perServer=false
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs:
        - mark://hub:6309
      perServer: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --per-server

  - it: includes --publish-graph when publishGraph=true
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs:
        - mark://hub:6309
      publishGraph: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --publish-graph

  - it: omits --publish-graph by default
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      config.hubs:
        - mark://hub:6309
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --publish-graph

  - it: includes --insecure when insecure=true
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      insecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --insecure

  - it: state volume is emptyDir by default
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="state")].emptyDir
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="state")].persistentVolumeClaim

  - it: state volume is PVC when persistent=true and emits PVC document
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
      state.persistent: true
      state.storageClassName: premium-rwo
      state.size: 5Gi
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Deployment
      - documentIndex: 1
        isKind:
          of: PersistentVolumeClaim
      - documentIndex: 1
        equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - documentIndex: 1
        equal:
          path: spec.storageClassName
          value: premium-rwo

  - it: pod-level securityContext only contains pod-supported fields
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - notExists:
          path: spec.template.spec.securityContext.readOnlyRootFilesystem
      - notExists:
          path: spec.template.spec.securityContext.allowPrivilegeEscalation

  - it: container-level securityContext locks down the container
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: tokens volume mounts at /home/demarkus/.mark for tokens.LoadDefault
    template: deployment.yaml
    set:
      config.seeds:
        - mark://team-a:6309
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tokens
            mountPath: /home/demarkus/.mark
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /home/demarkus
