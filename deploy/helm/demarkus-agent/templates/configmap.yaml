apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demarkus-agent.fullname" . }}-config
  labels:
    {{- include "demarkus-agent.labels" . | nindent 4 }}
data:
  agent.toml: |
    {{- $seeds := include "demarkus-agent.seeds" . | fromYamlArray }}
    {{- $hubs := include "demarkus-agent.hubs" . | fromYamlArray }}
    {{- $endpoints := include "demarkus-agent.endpoints" . | fromYaml }}
    {{- if $seeds }}
    seeds = [
      {{- range $seeds }}
      {{ . | quote }},
      {{- end }}
    ]
    {{- else }}
    seeds = []
    {{- end }}

    {{- if $hubs }}
    hubs = [
      {{- range $hubs }}
      {{ . | quote }},
      {{- end }}
    ]
    {{- else }}
    hubs = []
    {{- end }}

    {{- range $authority, $endpoint := $endpoints }}
    [endpoints.{{ $authority | quote }}]
    dial_address = {{ $endpoint.dialAddress | quote }}
    {{- if $endpoint.serverName }}
    server_name = {{ $endpoint.serverName | quote }}
    {{- end }}

    {{- end }}
    [crawl]
    max_depth = {{ .Values.config.crawl.maxDepth }}
    max_servers = {{ .Values.config.crawl.maxServers }}
    max_documents = {{ .Values.config.crawl.maxDocuments }}
    workers = {{ .Values.config.crawl.workers }}

    [schedule]
    interval = {{ .Values.config.schedule.interval | quote }}

    [politeness]
    request_delay = {{ .Values.config.politeness.requestDelay | quote }}
    per_server_concurrency = {{ .Values.config.politeness.perServerConcurrency }}
