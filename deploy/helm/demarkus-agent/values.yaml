# Default values for demarkus-agent.
# Override with --values or --set on `helm install`.

image:
  # Single-binary image; demarkus-agent is ENTRYPOINT. The agent runs
  # as a daemon with no probes today, so no CLI is bundled.
  repository: ghcr.io/latebit-io/demarkus-agent
  # tag defaults to .Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Log format. "json" (default) produces structured JSON records for log
# shippers; "text" produces human-readable key=value lines. The chart
# defaults to JSON because production deployments want machine-parseable
# logs across server / broker / agent.
logFormat: json

# Pod count. The agent maintains a crawl-politeness cache on disk;
# multiple replicas would duplicate work. Keep at 1.
replicaCount: 1

# Derived topology: name the worlds and the hub once and the chart derives
# config.seeds (every non-hub world), config.hubs, config.endpoints (when a
# shared dial address is known) and tokens.fromWorldSecrets (the hub's
# <hub>-token-values from the knowledge-server chart). Under the umbrella
# these come from global.worlds, global.knowledgeService and
# global.authorityDomain. Any explicit config.* or tokens.* entry below
# overrides its derived list.
worlds: []
  # - root
  # - team-a
# World that receives the published index. Else the global world flagged
# hub: true.
hub: ""
# Shared knowledge Service host:port every world is dialed at. Else
# <global.knowledgeService>.<release namespace>.svc.cluster.local:6309.
dialAddress: ""
# SNI suffix for derived endpoints (<name>.<authorityDomain>); must match
# the knowledge-server chart's authorityDomain. Else global.authorityDomain,
# else <global.knowledgeService>.<release namespace>.svc.cluster.local.
authorityDomain: ""

# Crawler config. Becomes the contents of /etc/demarkus/agent.toml.
# See client/internal/fedcrawl/config.go for the full schema.
config:
  # mark:// URLs of servers to crawl from on each tick. Required unless
  # derived from worlds above.
  seeds: []
  #  - mark://team-a.example.com:6309
  #  - mark://team-b.example.com:6309

  # mark:// URLs of hubs to publish indexes to. Unset derives mark://<hub>
  # from hub or global.worlds; an explicit [] means crawl only.
  hubs: ~
  #  - mark://hub.example.com:6309

  # Optional logical-authority transport overrides. Keys match authorities in
  # seeds, hubs, or discovered mark:// links. Identity and token lookup keep
  # using the key; only socket dialing and TLS SNI use these endpoint fields.
  endpoints: {}
  #  team-a:
  #    dialAddress: shared.internal:6309
  #    serverName: team-a.internal

  crawl:
    maxDepth: 2
    maxServers: 50
    maxDocuments: 1000
    workers: 5
  schedule:
    interval: 6h
  politeness:
    requestDelay: 100ms
    perServerConcurrency: 2

# Publishing mode. true = one index per discovered server at /index/<host>.md.
# false = single aggregated /index.md published to every configured hub,
# overwriting any curated /index.md there; only set false when no hub has one.
perServer: true

# Also publish a link-graph export to each hub at /graph.md (the durable
# topology the reading-room floor renders: nodes + edges). Independent of the
# hash index; aggregated across servers so cross-server edges are kept.
publishGraph: false

# Skip TLS certificate verification on outbound mark:// connections.
# Useful for self-signed dev clusters. Leave false in production.
insecure: false

# Tokens for publishing to hubs / reading private servers.
# Mounted under ~/.mark inside the container: tokens.toml from existingSecret
# or inline, and one file per entry of fromWorldSecrets at tokens.d/<hostPort>.
# tokens.toml wins over tokens.d for the same hostPort.
tokens:
  # Name of an existing Secret with a "tokens.toml" key. If set, takes precedence.
  existingSecret: ""

  # Inline tokens, generates Secret <release>-tokens with key tokens.toml.
  # Format: hostPort -> raw token.
  inline: {}
  #   "hub.example.com:6309": "abc123..."

  # Raw tokens the demarkus-knowledge-server chart mints into
  # <world>-token-values (tokens.emitRawValues). Each entry projects one
  # Secret key to ~/.mark/tokens.d/<hostPort>; the pod stays Pending until
  # every named Secret exists, so server and agent install in one step.
  # Same namespace only. The agent reads tokens at startup: rotate by
  # restarting the pod.
  fromWorldSecrets: []
  #  - hostPort: "team-a:6309"       # logical authority, matches config keys
  #    secret: team-a-token-values   # <world>-token-values from the server chart
  #    key: admin                    # defaults to "admin" (the server chart's tokens.admin.label)

# Persist the crawl-politeness state file across pod restarts.
# Losing it just means a fresh crawl on next tick — no data loss on the hub.
# Default: ephemeral (emptyDir).
state:
  persistent: false
  storageClassName: ""
  size: 1Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nameOverride: ""
# Resource names default to the release name.
fullnameOverride: ""

# Pod-level overrides.
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Liveness/readiness probes are intentionally omitted: the agent is an outbound
# scheduled job, not a service. K8s restarts on process exit, which is the
# correct behavior — the daemon loop logs and continues on transient crawl
# errors, and exits only on configuration/unrecoverable failures.

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # GKE Workload Identity: when set, annotates the SA with the GCP service
  # account binding. Not needed for the agent unless your hubs require it.
  workloadIdentity:
    gsa: ""

# Pod-level securityContext (applies to all containers, supports a limited
# subset of fields: runAs*, fsGroup, seccompProfile, etc.).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext (the agent container).
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
