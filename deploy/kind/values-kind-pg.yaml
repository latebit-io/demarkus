# Overrides for the demarkus-server-pg chart in the kind harness. Used by
# scripts/e2e-backend-parity.sh alongside values-kind.yaml (the file-store
# chart); the pair must differ only in the storage backend.

# Pinned to the pre-split image: the chart defaults to demarkus-server-pg,
# which has no published tag yet. Drop this override once a release
# publishes that image.
image:
  repository: ghcr.io/latebit-io/demarkus-server

service:
  type: ClusterIP

server:
  postgres:
    dsnSecret:
      # CloudNativePG publishes app credentials in <cluster>-app; its "uri"
      # key is a full DSN pointing at the <cluster>-rw Service.
      name: demarkus-pg-app
      key: uri

# tls block intentionally left at chart defaults — the server self-signs a
# dev cert at startup; clients verify with `demarkus -insecure`.
