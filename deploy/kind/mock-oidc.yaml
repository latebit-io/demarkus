# Mock OIDC issuer for kind-based broker testing.
#
# The demarkus-knowledge-broker performs OIDC discovery at startup (broker/oidc.go:67)
# and exits if the issuer is unreachable, so a kind harness that exercises
# the broker needs a real OIDC endpoint inside the cluster. mock-oauth2-server
# (navikt) serves the discovery document, JWKS, /authorize, /token, and
# /jwks endpoints out of the box at /<issuer-id>/... — the broker can drive
# the full login + callback + ID-token verification flow against it.
#
# Reachable from broker pods at:
#   http://mock-oauth2-server.demarkus.svc.cluster.local:8080/default
#
# JSON_CONFIG (mounted from the ConfigMap below) sets:
#   - interactiveLogin=false so /authorize bypasses the HTML login form
#     and 302s directly back with a code (lets curl-only smoke tests
#     drive the full mint without scraping a form).
#   - default tokenCallback claims include email=alice@example.com +
#     email_verified=true so the broker's authorizedWorlds predicate
#     (allow.emails: ["alice@example.com"]) matches.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-oauth2-server-config
  labels:
    app.kubernetes.io/name: mock-oauth2-server
data:
  config.json: |
    {
      "interactiveLogin": false,
      "tokenCallbacks": [
        {
          "issuerId": "default",
          "tokenExpiry": 3600,
          "requestMappings": [
            {
              "requestParam": "grant_type",
              "match": "authorization_code",
              "claims": {
                "sub": "alice-kind-test",
                "email": "alice@example.com",
                "email_verified": true
              }
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth2-server
  labels:
    app.kubernetes.io/name: mock-oauth2-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-oauth2-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth2-server
  labels:
    app.kubernetes.io/name: mock-oauth2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-oauth2-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-oauth2-server
      # Bounce the pod when the config changes so we don't ship a
      # stale interactiveLogin / claims set on subsequent up.sh runs.
      annotations:
        checksum/config: "v1-alice-noninteractive"
    spec:
      containers:
        - name: mock-oauth2-server
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG_PATH
              value: /etc/mock-oauth2-server/config.json
          volumeMounts:
            - name: config
              mountPath: /etc/mock-oauth2-server
              readOnly: true
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: mock-oauth2-server-config
