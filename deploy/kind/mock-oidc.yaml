# Mock OIDC issuer for kind-based broker testing.
#
# The demarkus-broker performs OIDC discovery at startup (broker/oidc.go:67)
# and exits if the issuer is unreachable, so a kind harness that exercises
# the broker needs a real OIDC endpoint inside the cluster. mock-oauth2-server
# (navikt) serves the discovery document, JWKS, /authorize, /token, and
# /jwks endpoints out of the box at /<issuer-id>/... — the broker can drive
# the full login + callback + ID-token verification flow against it.
#
# Reachable from broker pods at:
#   http://mock-oauth2-server.demarkus.svc.cluster.local:8080/default
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth2-server
  labels:
    app.kubernetes.io/name: mock-oauth2-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-oauth2-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth2-server
  labels:
    app.kubernetes.io/name: mock-oauth2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-oauth2-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-oauth2-server
    spec:
      containers:
        - name: mock-oauth2-server
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
