<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  </head>
  <body{% if page.url == '/' %} class="is-home"{% endif %}>
    <svg class="graphfield" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <g class="gf-edges">
        <line x1="120" y1="150" x2="300" y2="80"/>
        <line x1="120" y1="150" x2="250" y2="300"/>
        <line x1="120" y1="150" x2="90" y2="430"/>
        <line x1="250" y1="300" x2="430" y2="360"/>
        <line x1="300" y1="80" x2="560" y2="170"/>
        <line x1="430" y1="360" x2="560" y2="170"/>
        <line x1="430" y1="360" x2="700" y2="300"/>
        <line x1="560" y1="170" x2="700" y2="300"/>
        <line x1="700" y1="300" x2="640" y2="500"/>
        <line x1="560" y1="170" x2="820" y2="150"/>
        <line x1="820" y1="150" x2="980" y2="260"/>
        <line x1="820" y1="150" x2="1120" y2="150"/>
        <line x1="980" y1="260" x2="1190" y2="370"/>
        <line x1="980" y1="260" x2="1000" y2="470"/>
        <line x1="1120" y1="150" x2="1330" y2="230"/>
        <line x1="1190" y1="370" x2="1330" y2="230"/>
        <line x1="1190" y1="370" x2="1290" y2="520"/>
        <line x1="1000" y1="470" x2="1180" y2="650"/>
        <line x1="1290" y1="520" x2="1180" y2="650"/>
        <line x1="640" y1="500" x2="860" y2="600"/>
        <line x1="860" y1="600" x2="1000" y2="470"/>
        <line x1="640" y1="500" x2="520" y2="640"/>
        <line x1="520" y1="640" x2="300" y2="560"/>
        <line x1="250" y1="300" x2="300" y2="560"/>
        <line x1="300" y1="560" x2="140" y2="660"/>
        <line x1="90" y1="430" x2="140" y2="660"/>
        <line x1="520" y1="640" x2="700" y2="730"/>
        <line x1="700" y1="730" x2="860" y2="600"/>
        <line x1="700" y1="730" x2="980" y2="720"/>
        <line x1="980" y1="720" x2="1180" y2="650"/>
        <line x1="700" y1="730" x2="420" y2="810"/>
        <line x1="420" y1="810" x2="140" y2="660"/>
        <line x1="980" y1="720" x2="1080" y2="840"/>
        <line x1="1080" y1="840" x2="1180" y2="650"/>
        <line x1="430" y1="360" x2="520" y2="640"/>
        <line x1="700" y1="300" x2="860" y2="600"/>
      </g>
      <g class="gf-nodes">
        <circle cx="120" cy="150" r="6" class="hub"/>
        <circle cx="300" cy="80" r="3.4"/>
        <circle cx="250" cy="300" r="3.4"/>
        <circle cx="90" cy="430" r="3.4"/>
        <circle cx="430" cy="360" r="6" class="hub"/>
        <circle cx="560" cy="170" r="3.4"/>
        <circle cx="700" cy="300" r="3.4"/>
        <circle cx="640" cy="500" r="3.4"/>
        <circle cx="820" cy="150" r="3.4"/>
        <circle cx="980" cy="260" r="6" class="hub"/>
        <circle cx="1120" cy="150" r="3.4"/>
        <circle cx="1190" cy="370" r="3.4"/>
        <circle cx="1000" cy="470" r="3.4"/>
        <circle cx="1290" cy="520" r="3.4"/>
        <circle cx="1330" cy="230" r="3.4"/>
        <circle cx="1180" cy="650" r="3.4"/>
        <circle cx="860" cy="600" r="3.4"/>
        <circle cx="520" cy="640" r="3.4"/>
        <circle cx="300" cy="560" r="3.4"/>
        <circle cx="140" cy="660" r="3.4"/>
        <circle cx="700" cy="730" r="6" class="hub"/>
        <circle cx="980" cy="720" r="3.4"/>
        <circle cx="420" cy="810" r="3.4"/>
        <circle cx="1080" cy="840" r="3.4"/>
      </g>
    </svg>
    <div class="vignette" aria-hidden="true"></div>

    <header class="shell site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">M</span>
        <span class="brand-word">Demarkus</span>
      </a>
      {% include nav.html %}
    </header>

    <main class="shell site-main">
      {% if page.url == '/' %}
      <section class="hero">
        <p class="eyebrow">Built on the Mark Protocol</p>
        <h1>Memory for agents, knowledge for teams, a second brain for you</h1>
        <p class="hero-copy">{{ site.description }}</p>
      </section>
      {% endif %}
      <article class="content-card">
        {{ content }}
      </article>
    </main>

    <footer class="shell site-footer">
      <p class="colophon">
        <span>Demarkus &middot; Agent memory &amp; knowledge systems</span>
        <span>Versioned &middot; Permanent &middot; Built on the Mark Protocol</span>
      </p>
    </footer>
  </body>
</html>
