server:
  addr: ":8080"
  bearerAddr: ":8443"
  cookieKeySecret: "knowledge-cookie-key"
  stateTTL: "5m"
  brokerNamespace: "demarkus"
  signingKeySecret: "knowledge-signing-key"
  dynamicClientsSecret: "knowledge-dynamic-clients"
  oauthStateSecret: "knowledge-oauth-state"
  stateBucket: "gs://knowledge-broker-state"
  refreshTokenTTL: "2160h"
  maxSessionsPerUser: 20
  idTokenTTL: "15m"
  publicURL: "https://broker.example.com"
  insecureCookies: false
  mcp:
    toolProfile: "full"
oidc:
  issuer: "https://accounts.example.com"
  clientID: "broker-app"
  clientSecret: "shh"
  redirectURL: "https://broker.example.com/auth/callback"
  brokerSigningKey: |
    
  allowDomains: []
worlds:
  - name: "team-a"
    profile: "knowledge"
    local: true
    namespace: "demarkus"
    tokensSecret: "team-a-tokens"
    publicURL: ""
    internalAddress: "team-a.example.com:6309"
    allow:
      domains: []
      groups: []
      emails: []
    writeScope:
      paths: ["/**"]
  - name: "team-b"
    profile: "knowledge"
    local: true
    namespace: "demarkus"
    tokensSecret: "team-b-tokens"
    publicURL: ""
    internalAddress: "team-b.example.com:6309"
    allow:
      domains: []
      groups: []
      emails: []
    writeScope:
      paths: ["/**"]
webClients: []
sweeper:
  disabled: false
  interval: "5m"
  leaseName: "demarkus-broker-sweeper"
federation:
  hub: "team-a"
  leaseName: "demarkus-federation"
rateLimit:
  disabled: false
  tokens:
    perMinute: 10
    burst: 5
  login:
    perMinute: 20
    burst: 5
  trustForwardedFor: true
worldDialer:
  insecureSkipVerify: false
