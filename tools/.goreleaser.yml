version: 2

project_name: demarkus-tools

monorepo:
  tag_prefix: tools/
  dir: tools

builds:
  - id: demarkus-token
    main: ./demarkus-token
    binary: demarkus-token
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: demarkus-publish
    main: ./demarkus-publish
    binary: demarkus-publish
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w

  - id: demarkus-plugin
    main: ./demarkus-plugin
    binary: demarkus-plugin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Separate archives so operators (and plugins) pull only the binary they
# need don't carry the full bundle. Same shape as client/.goreleaser.yml.
archives:
  - id: demarkus-token
    builds:
      - demarkus-token
    name_template: "demarkus-token_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: demarkus-publish
    builds:
      - demarkus-publish
    name_template: "demarkus-publish_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: demarkus-plugin
    builds:
      - demarkus-plugin
    name_template: "demarkus-plugin_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "demarkus-tools_checksums.txt"

changelog:
  use: github-native
